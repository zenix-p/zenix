<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zenix - New Password</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,Tahoma,sans-serif;background-color:#030712;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#f8fafc;padding:15px;position:relative;overflow-x:hidden}.glow-1,.glow-2{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none}.glow-1{width:250px;height:250px;background:#0ea5e9;top:10%;left:10%}.glow-2{width:250px;height:250px;background:#a855f7;bottom:10%;right:10%}.auth-card{width:100%;max-width:400px;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.7);position:relative;z-index:10}.logo{text-align:center;margin-bottom:22px}.logo-icon{width:56px;height:56px;margin:0 auto 10px;background:rgba(56,189,248,.15);border:1px solid #38bdf8;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#38bdf8}.logo h2{font-size:26px;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.logo p{color:#94a3b8;font-size:12px;margin-top:4px}.group{margin-bottom:14px}.group label{display:block;margin-bottom:6px;font-size:12px;color:#cbd5e1}.req{color:#ef4444;font-weight:700;margin-inline-start:3px}.wrap{position:relative;display:flex;align-items:center}.wrap i.f-icon{position:absolute;color:#64748b;font-size:14px}html[dir="rtl"] .wrap i.f-icon{right:14px}html[dir="ltr"] .wrap i.f-icon{left:14px}.group input{width:100%;padding:12px 14px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:13px;outline:0}html[dir="rtl"] .group input{padding-right:40px}html[dir="ltr"] .group input{padding-left:40px}.group input:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.2)}.btn{width:100%;padding:13px;background:linear-gradient(135deg,#0284c7,#9333ea);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .3s ease;margin-top:10px}.btn:disabled{background:rgba(255,255,255,.1);color:#64748b;cursor:not-allowed;box-shadow:none}.footer{text-align:center;margin-top:16px;font-size:12px;color:#94a3b8}.footer a{color:#38bdf8;text-decoration:none;font-weight:700}#msg{margin-top:10px;font-size:12px;text-align:center;font-weight:700;padding:8px;border-radius:8px}.err{color:#ef4444;background:rgba(239,68,68,.1)}.succ{color:#22c55e;background:rgba(34,197,94,.1)}</style></head><body><div class="glow-1"></div><div class="glow-2"></div><div class="auth-card"><div class="logo"><div class="logo-icon"><i class="fas fa-lock"></i></div><h2>ZENIX</h2><p>تعیین رمز عبور جدید</p></div><form id="form"><div class="group"><label><i class="fas fa-key"></i> رمز عبور جدید <span class="req">*</span></label><div class="wrap"><i class="fas fa-lock f-icon"></i><input type="password" id="pass1" placeholder="حداقل ۶ کاراکتر" required></div></div><div class="group"><label><i class="fas fa-check-circle"></i> تکرار رمز عبور جدید <span class="req">*</span></label><div class="wrap"><i class="fas fa-lock f-icon"></i><input type="password" id="pass2" placeholder="تکرار رمز عبور" required></div></div><button type="submit" id="t-btn" class="btn" disabled>تغییر رمز عبور</button><div id="msg"></div></form><div class="footer"><p><a href="login.html"><i class="fas fa-arrow-right"></i> انصراف و بازگشت به ورود</a></p></div></div><script>const p1=document.getElementById('pass1'),p2=document.getElementById('pass2'),btn=document.getElementById('t-btn'),msg=document.getElementById('msg'),form=document.getElementById('form');function check(){btn.disabled=!(p1.value.length>0&&p2.value.length>0)}[p1,p2].forEach(i=>i.addEventListener('input',check));form.addEventListener('submit',e=>{e.preventDefault();if(p1.value.length<6)return msg.textContent='رمز عبور باید حداقل ۶ کاراکتر باشد.',msg.className='err';if(p1.value!==p2.value)return msg.textContent='رمز عبور و تکرار آن یکسان نیستند!',msg.className='err';msg.textContent='رمز عبور با موفقیت تغییر کرد! انتقال به ورود...';msg.className='succ';setTimeout(()=>window.location.href='login.html',2000});</script></body></html>
