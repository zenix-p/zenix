                null;
            try { document.dispatchEvent(new CustomEvent('cf-token-ready')); } catch (e) {}

        window.onCaptchaExpired = function () {
            window.__cfToken = null;
            try { document.dispatchEvent(new CustomEvent('cf-token-ready')); } catch (e) {}

            window.__cfToken = null;

                        id="user"
                        inputmode="email"
                        pattern="[^\s@]+@[^\s@]+\.[^\s@]+"
                        aria-label="Email address"
                        autocomplete="email"
                        autocorrect="off"
                        autocapitalize="none"
                        spellcheck="false"
                        lang="en"
                        data-lpignore="true"
                        data-form-type="other"
                        required>
                </div>
            </div>
            <div class="group">
                <label id="l-pass"><i class="fas fa-lock"></i> <span id="txt-pass"></span> <span class="req">*</span></label>
                <div class="wrap-input">

                        id="pass"
                        aria-label="Password"

                        spellcheck="false"

                    <span id="t-remember"></span>
                </label>
                <a href="forgot-password.html" id="t-forgot"></a>
            </div>

            <button type="submit" id="t-btn" class="btn" disabled></button>
        </form>
        <div id="msg"></div>
        <div class="footer">
            <p id="t-foot"></p>
        </div>
    </div>

        function hardDisableSpellcheck(el) {
            if (!el) return;
            try {
                el.spellcheck = false;
                el.setAttribute('spellcheck', 'false');
                el.setAttribute('autocorrect', 'off');
                el.setAttribute('autocapitalize', 'none');
                el.setAttribute('data-gramm', 'false');
                el.setAttribute('data-gramm_editor', 'false');
                el.setAttribute('data-enable-grammarly', 'false');
            } catch (e) {}
        }
        hardDisableSpellcheck(userIn);
        hardDisableSpellcheck(passIn);

        function getCaptchaToken() {
            const domToken = document.querySelector('[name="cf-turnstile-response"]')?.value;
            return domToken || window.__cfToken || null;

        // ★★★ اصلاح شده: چک status + بازگشت 'BANNED' برای کاربران مسدود
        async function getTargetPage(userId) {
            try {
                const { data } = await supabaseClient
                    .from('users')
                    .select('phone, status')
                    .eq('id', userId)
                    .maybeSingle();

                // اگر کاربر مسدود است، علامت BANNED برگردان
                if (data && (data.status === 'cancelled' || data.status === 'banned')) {
                    return 'BANNED';

                if (!data || !data.phone || data.phone.trim() === '') return 'profile.html';
                return 'dashboard.html';

        function setLang(l) {

            langMenu?.classList.remove('show');

        function isValidEmail(email) {
            if (!email) return false;
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);

            submitBtn.disabled = !(emailOk && passOk && capOk);
        }

        document.addEventListener('cf-token-ready', () => { checkInputs(); });

        let lastKnownToken = null;
        setInterval(() => {
            if (isSubmitting) return;
            const token = getCaptchaToken();
            if (token !== lastKnownToken) {
                lastKnownToken = token;
                checkInputs();
            }
        }, 400);

        userIn.addEventListener('focus', clearError);
        userIn.addEventListener('input', () => { clearError(); checkInputs(); });
        passIn.addEventListener('focus', clearError);
        passIn.addEventListener('input', checkInputs);

        function showError(errKey) {
            const t = langData[currentLang] || langData.en;
            msg.innerHTML = `<div>${t[errKey] || errKey}</div>`;
            msg.className = 'err show';
            checkInputs();
        }

        // ★★★ نمایش پیام مسدود بودن با آیکون واضح
        function showBanned() {
            const t = langData[currentLang] || langData.en;
            msg.innerHTML = `<div><i class="fas fa-ban" style="margin-inline-end:6px;"></i>${t.errDisabled}</div>`;
            msg.className = 'err show';
            submitBtn.disabled = false;
            isSubmitting = false;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const emailVal = userIn.value.trim().toLowerCase();
            const passVal = passIn.value.trim();

            if (!isValidEmail(emailVal)) return showError('errEmail');
            const captchaToken = getCaptchaToken();
            if (!captchaToken) return showError('errCaptcha');

            const currentSubmit = ++submitCounter;
            isSubmitting = true;
            submitBtn.disabled = true;
            clearError();

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: emailVal,
                    password: passVal,
                    options: { captchaToken: captchaToken }
                });

                if (currentSubmit !== submitCounter) { isSubmitting = false; return; }
                if (error) throw error;

                const targetPage = await getTargetPage(data.user.id);
                if (currentSubmit !== submitCounter) { isSubmitting = false; return; }

                // ★★★ چک مسدود بودن: اگر BANNED بود، خارج شو + پیام بده
                if (targetPage === 'BANNED') {
                    try { await supabaseClient.auth.signOut(); } catch (_) {}
                    try { if (window.turnstile) window.turnstile.reset(); } catch(e) {}
                    showBanned();
                    return;
                }

                const t = langData[currentLang] || langData.en;
                msg.innerHTML = `<div>${t.succ}</div>`;
                msg.className = 'succ show';
                setTimeout(() => { window.location.href = targetPage; }, 1000);
            } catch (error) {
                if (currentSubmit !== submitCounter) { isSubmitting = false; return; }
                console.error('Login Error:', error);
                isSubmitting = false;
                submitBtn.disabled = false;

                try { if (window.turnstile) window.turnstile.reset(); } catch(e) {}

                if (error.status === 429 || (error.message && error.message.toLowerCase().includes('too many requests'))) {
                    const t = langData[currentLang] || langData.en;
                    msg.innerHTML = `<div>${t.errTooMany}</div>`;
                    msg.className = 'err show';
                } else {
                    showError('errNoUser');
                }
                checkInputs();
            }
        });

        window.addEventListener('pageshow', () => { clearError(); checkInputs(); });
        setLang(currentLang);
    </script>
</body>
</html>
