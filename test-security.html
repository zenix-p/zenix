<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تست امنیت</title>
<style>
body{background:#030712;color:#f8fafc;font-family:system-ui,sans-serif;padding:30px;max-width:600px;margin:auto;line-height:2}
h2{color:#38bdf8}
button{background:#38bdf8;color:#030712;border:none;padding:12px 24px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin:8px 4px}
button:disabled{background:#475569;cursor:not-allowed}
.result{padding:16px;border-radius:10px;margin-top:20px;font-size:14px;display:none}
.result.show{display:block}
.result.pass{background:rgba(34,197,94,.15);border:2px solid #22c55e;color:#4ade80}
.result.fail{background:rgba(239,68,68,.15);border:2px solid #ef4444;color:#f87171}
.result.info{background:rgba(56,189,248,.15);border:2px solid #38bdf8;color:#7dd3fc}
</style>
</head>
<body>
<h2>🔒 تست امنیت Trigger</h2>
<p>لطفاً با <strong>اکانت کاربر عادی</strong> (نه ادمین) وارد شوید.</p>
<div id="user-info" style="color:#94a3b8;margin:16px 0"></div>
<button id="btn1" disabled>تست ۱: تلاش برای ادمین شدن</button>
<button id="btn2" disabled>تست ۲: تلاش برای تغییر موجودی</button>
<div id="result" class="result"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdmirror.com/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = "https://ujyenmqdgivuxvxptwyl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const resultEl = document.getElementById('result');
const userInfoEl = document.getElementById('user-info');

function showResult(type, html) {
  resultEl.className = 'result show ' + type;
  resultEl.innerHTML = html;
}

const { data: { session } } = await supabase.auth.getSession();
if (!session) {
  showResult('info', 'شما وارد حساب نشده‌اید. ابتدا در index.html وارد شوید و بعد به این صفحه برگردید.');
} else {
  const user = session.user;
  userInfoEl.innerHTML = `✅ وارد شده با: <strong>${user.email}</strong>`;
  document.getElementById('btn1').disabled = false;
  document.getElementById('btn2').disabled = false;

  document.getElementById('btn1').addEventListener('click', async () => {
    document.getElementById('btn1').disabled = true;
    const { error } = await supabase.from('users').update({ is_admin: true }).eq('id', user.id);
    if (error && error.message.includes('Access denied')) {
      showResult('pass', '✅ <strong>امن است!</strong><br>سیستم اجازه نداد خودتان را ادمین کنید.<br><small>پیام خطا: ' + error.message + '</small>');
    } else if (error) {
      showResult('info', '🟡 خطای دیگری رخ داد (شاید RLS):<br>' + error.message);
    } else {
      showResult('fail', '❌ <strong>خطر!</strong><br>موفق شدید خودتان را ادمین کنید! این یک حفره امنیتی جدی است.');
    }
    document.getElementById('btn1').disabled = false;
  });

  document.getElementById('btn2').addEventListener('click', async () => {
    document.getElementById('btn2').disabled = true;
    const { error } = await supabase.from('users').update({ balance: 999999 }).eq('id', user.id);
    if (error && error.message.includes('Access denied')) {
      showResult('pass', '✅ <strong>امن است!</strong><br>سیستم اجازه نداد موجودی خودتان را تغییر دهید.<br><small>پیام خطا: ' + error.message + '</small>');
    } else if (error) {
      showResult('info', '🟡 خطای دیگری رخ داد (شاید RLS):<br>' + error.message);
    } else {
      showResult('fail', '❌ <strong>خطر!</strong><br>موفق شدید موجودی خودتان را به ۹۹۹,۹۹۹ تغییر دهید!');
    }
    document.getElementById('btn2').disabled = false;
  });
}
</script>
</body>
</html>
