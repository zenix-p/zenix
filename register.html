nfirmPass:'Confirmer',confirmPassP:'Confirmer',ref:'Code de parrainage',refP:'Code',cap:'Code de sécurité',capP:'Entrez le code',btn:'S\'inscrire',back:'Retour',succ:'Inscription réussie !',err:'Code invalide !',refErr:'L\'inscription nécessite un lien de parrainage valide !',passErr:'Mots de passe différents !',lenErr:'Le mot de passe doit contenir au moins 6 caractères !',existErr:'E-mail déjà enregistré !',supTitle:'Support',langTitle:'Changer de langue'},de:{dir:'ltr',wel:'Konto erstellen',email:'E-Mail',emailP:'E-Mail',name:'Vollständiger Name',nameP:'Vollständiger Name',pass:'Passwort',passP:'Passwort',confirmPass:'Passwort bestätigen',confirmPassP:'Passwort bestätigen',ref:'Empfehlungscode',refP:'Empfehlungscode',cap:'Sicherheitscode',capP:'Code eingeben',btn:'Registrieren',back:'Zurück',succ:'Erfolgreich!',err:'Ungültiger Code!',refErr:'Anmeldung erfordert einen gültigen Empfehlungslink!',passErr:'Passwörter stimmen nicht überein!',lenErr:'Das Passwort muss mindestens 6 Zeichen lang sein!',existErr:'E-Mail bereits ثبت نام شده!',supTitle:'Support',langTitle:'Sprache ändern'}};

        function drawCap(){
            if (!cv) return;
            const ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
            code = '';
            const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
            for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));

            ctx.clearRect(0, 0, w, h);
            const bgGrad = ctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, '#030712'); bgGrad.addColorStop(0.5, '#0b1329'); bgGrad.addColorStop(1, '#02050e');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(56,189,248,0.12)'; ctx.lineWidth = 1;
            for (let i = 0; i < 2; i++) {
                ctx.beginPath(); ctx.moveTo(Math.random() * w, Math.random() * h);
                ctx.lineTo(Math.random() * w, Math.random() * h); ctx.stroke();
            }

            const neonColors = ['#38bdf8', '#c084fc', '#34d399', '#f43f5e', '#fbbf24'];
            const cw = w / 5;

            for (let i = 0; i < 5; i++) {

                ctx.fillStyle = color;
                ctx.fillText(code[i], 0, 0);
                ctx.restore();
            }
        }

                        capIn.value = '';
                        drawCap();
                        chk();
                        return;
                    }

                    const { data: refUsers, error: refError } = await supabase
                        .from('users')
                        .select('referralCode')
                        .eq('referralCode', refCodeValue);

                    if (refError || !refUsers || refUsers.length === 0) {
                        btn.disabled = false;
                        msg.textContent = t.refErr;
                        msg.className = 'err';
                        capIn.value = '';
                        drawCap();
                        chk();
                        return;
                    }
                }

                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: emailValue,
                    password: passIn.value,
                    options: { data: { fullname: fullNameValue } }
                });

                if (authError) throw authError;

                const user = authData.user;
                if (!user) throw new Error("Registration failed.");

                const userOwnRefCode = Math.random().toString(36).substring(2,8).toUpperCase();

                const { error: dbError } = await supabase
                    .from('users')
                    .insert([{
                        id: user.id,
                        fullname: fullNameValue,
                        email: emailValue,
                        referredBy: refCodeValue || null,
                        referralCode: userOwnRefCode,
                        balance: 0
                    }]);

                if (dbError) throw dbError;

                msg.textContent = t.succ;
                msg.className = 'succ';
                setTimeout(() => window.location.href = 'index.html', 1500);

            } catch (error) {
                btn.disabled = false;
                if (error.message && (error.message.includes('already registered') || error.code === 'user_already_exists')) {
                    msg.textContent = t.existErr;
                } else {
                    msg.textContent = error.message;
                }
                msg.className = 'err';
                capIn.value = '';
                drawCap();
                chk();
            }
        };
        
        setLang(currentLang);
        drawCap();
        chk();
    </script>
</body>
</html>
