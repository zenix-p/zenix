<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENIX - ثبت‌نام حساب کاربر جدید</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-primary: #0b0e14;
            --bg-card: rgba(22, 27, 38, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-gold: #f3ba2f;
            --accent-gold-hover: #ffca3a;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --text-main: #f0f4f8;
            --text-muted: #848e9c;
            --input-bg: rgba(13, 16, 23, 0.8);
            --shadow-glow: 0 0 25px rgba(243, 186, 47, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(243, 186, 47, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(14, 203, 129, 0.05) 0%, transparent 40%);
            padding: 20px 10px;
            overflow-x: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), var(--shadow-glow);
            position: relative;
            z-index: 1;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            right: 14px;
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 13px 42px 13px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(243, 186, 47, 0.2);
        }

        .form-input:focus + .input-icon {
            color: var(--accent-gold);
        }

        .toggle-password {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color 0.3s ease;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        .password-input {
            padding-left: 42px !important;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #e0a800 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--accent-gold-hover) 0%, var(--accent-gold) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 186, 47, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .auth-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 700;
            margin-right: 4px;
            transition: color 0.3s ease;
        }

        .auth-link:hover {
            color: var(--accent-gold-hover);
            text-decoration: underline;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .alert-error {
            background: rgba(246, 70, 93, 0.15);
            border: 1px solid rgba(246, 70, 93, 0.4);
            color: #ff6b81;
        }

        .alert-success {
            background: rgba(14, 203, 129, 0.15);
            border: 1px solid rgba(14, 203, 129, 0.4);
            color: var(--accent-green);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #000;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ref-badge {
            display: inline-block;
            background: rgba(243, 186, 47, 0.1);
            color: var(--accent-gold);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-top: 4px;
            border: 1px dashed rgba(243, 186, 47, 0.3);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-header">
            <div class="brand-logo">ZENIX</div>
            <p class="brand-subtitle">ایجاد حساب کاربری در پلتفرم سرمایه‌گذاری</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label class="form-label" for="fullName">نام و نام خانوادگی</label>
                <div class="input-wrapper">
                    <input type="text" id="fullName" class="form-input" placeholder="مثال: علی محمدی" required autocomplete="name">
                    <i class="fa-regular fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">آدرس ایمیل</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-input" dir="ltr" placeholder="name@example.com" required autocomplete="email">
                    <i class="fa-regular fa-envelope input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">کلمه عبور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input password-input" dir="ltr" placeholder="حداقل ۶ کاراکتر" required minlength="6" autocomplete="new-password">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('password', this)"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">تکرار کلمه عبور</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" class="form-input password-input" dir="ltr" placeholder="بازتکرار کلمه عبور" required autocomplete="new-password">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="referralCode">
                    کد دعوت (اختیاری)
                </label>
                <div class="input-wrapper">
                    <input type="text" id="referralCode" class="form-input" dir="ltr" placeholder="مثال: REF123456" style="text-transform: uppercase;">
                    <i class="fa-solid fa-user-plus input-icon"></i>
                </div>
                <div id="refAppliedBadge" style="display: none;" class="ref-badge">
                    <i class="fa-solid fa-check-circle"></i> کد معرف شناسایی شد
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span>ثبت‌نام و ایجاد حساب</span>
            </button>
        </form>

        <div class="auth-footer">
            قبلاً ثبت‌نام کرده‌اید؟ 
            <a href="login.html" class="auth-link">وارد شوید</a>
        </div>
    </div>

    <script>
        // --- پیکربندی Supabase ---
        const SUPABASE_URL = 'https://kslypmnrphzfxpxrswpt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzbHlwbW5ycGh6ZnhweHJzd3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzODU4ODIsImV4cCI6MjA1NTk2MTg4Mn0.O2m8G2A-fIft1G9G_F9eD1R6WfG4Vf30-OIn7y-u1pI';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- بررسی و دریافت کد معرف از URL ---
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref') || urlParams.get('referral');
            
            if (refParam) {
                const refInput = document.getElementById('referralCode');
                refInput.value = refParam.trim().toUpperCase();
                document.getElementById('refAppliedBadge').style.display = 'inline-block';
            }
        });

        // --- نمایش / مخفی‌سازی رمز عبور ---
        function togglePasswordVisibility(inputId, iconEl) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconEl.classList.remove('fa-eye');
                iconEl.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                iconEl.classList.remove('fa-eye-slash');
                iconEl.classList.add('fa-eye');
            }
        }

        // --- نمایش پیام‌های هشدار ---
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert-box alert-${type}`;
            
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check';
            alertBox.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        // --- تولید کد معرف اختصاصی برای کاربر جدید ---
        function generateRandomReferralCode(length = 6) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = 'ZX';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // --- مدیریت فرایند ثبت‌نام ---
        async function handleRegister(event) {
            event.preventDefault();
            hideAlert();

            const fullNameValue = document.getElementById('fullName').value.trim();
            const emailValue = document.getElementById('email').value.trim().toLowerCase();
            const passwordValue = document.getElementById('password').value;
            const confirmPasswordValue = document.getElementById('confirmPassword').value;
            const referralCodeValue = document.getElementById('referralCode').value.trim().toUpperCase();

            // اعتبارسنجی ورودی‌ها
            if (!fullNameValue) {
                showAlert('لطفا نام و نام خانوادگی خود را وارد کنید.');
                return;
            }

            if (passwordValue.length < 6) {
                showAlert('کلمه عبور باید حداقل ۶ کاراکتر باشد.');
                return;
            }

            if (passwordValue !== confirmPasswordValue) {
                showAlert('کلمه عبور و تکرار آن با یکدیگر مطابقت ندارند.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner"></span> <span>در حال ثبت‌نام...</span>`;

            try {
                // ۱. ثبت‌نام کاربر در سیستم Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: emailValue,
                    password: passwordValue,
                    options: {
                        data: {
                            full_name: fullNameValue,
                            fullname: fullNameValue
                        }
                    }
                });

                if (authError) {
                    throw authError;
                }

                if (!authData.user) {
                    throw new Error('خطا در ثبت‌نام کاربر. لطفا مجددا تلاش کنید.');
                }

                // ۲. پردازش کد معرف ورودی (در صورت وجود)
                let referrerFinalValue = null;
                if (referralCodeValue) {
                    const { data: referrerUser } = await supabaseClient
                        .from('users')
                        .select('id, referral_code')
                        .eq('referral_code', referralCodeValue)
                        .maybeSingle();

                    if (referrerUser) {
                        referrerFinalValue = referrerUser.referral_code;
                    }
                }

                // ۳. ایجاد کد معرف اختصاصی کاربر
                const userOwnRefCode = generateRandomReferralCode(6);

                // ۴. درج اطلاعات کاربر در جدول عمومی users
                const userPayload = {
                    id: authData.user.id,
                    email: emailValue,
                    full_name: fullNameValue, // اضافه شدن نام و نام خانوادگی به دیتابیس
                    referred_by: referrerFinalValue,
                    referral_code: userOwnRefCode,
                    balance: 0,
                    created_at: new Date().toISOString()
                };

                const { error: dbError } = await supabaseClient
                    .from('users')
                    .insert([userPayload]);

                if (dbError) {
                    console.warn('DB Insert Warning:', dbError.message);
                }

                showAlert('ثبت‌نام با موفقیت انجام شد! در حال انتقال...', 'success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (err) {
                console.error('Register Error:', err);
                let msg = err.message || 'خطایی در ثبت‌نام رخ داد.';
                if (msg.includes('already registered')) {
                    msg = 'این ایمیل قبلاً ثبت شده است. لطفا وارد شوید.';
                }
                showAlert(msg, 'error');
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>ثبت‌نام و ایجاد حساب</span>`;
            }
        }
    </script>
</body>
</html>
