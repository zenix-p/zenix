<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Zenix - Register</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',system-ui,sans-serif}
        body{background:#030712;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#f8fafc;padding:15px}
        .card{width:100%;max-width:400px;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.6);position:relative;overflow:visible}
        .header-actions{position:relative;z-index:20;display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:12px}
        .wrap{position:relative}
        .lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;width:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#38bdf8;text-decoration:none;transition:.2s}
        .lb:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
        .menu{display:none;position:absolute;top:42px;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:8px;width:max-content;padding:5px;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.8)}
        [dir="rtl"] .wrap .menu{left:0}
        [dir="ltr"] .wrap .menu{right:0}
        .menu.show{display:block!important}
        .mi{padding:6px 12px;font-size:12px;color:#cbd5e1;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;transition:.2s}
        .mi:hover,.mi.active{background:rgba(56,189,248,.15);color:#38bdf8!important;font-weight:700}
        
        .logo{text-align:center;margin-bottom:20px}
        .logo-header{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
        .logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#0ea5e9,#9333ea);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;font-style:italic;transform:skewX(-6deg);box-shadow:0 0 18px rgba(14,165,233,.45)}
        .logo-text{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;letter-spacing:3px;font-style:italic;transform:skewX(-6deg);background:linear-gradient(135deg,#38bdf8,#c084fc,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(56,189,248,.4)}
        .logo p{color:#94a3b8;font-size:12px;margin-top:4px}
        
        .group{margin-bottom:12px}
        .group label{display:block;margin-bottom:5px;font-size:12px;color:#cbd5e1}
        .req{color:#ef4444}
        .wrap-input{position:relative;display:flex;align-items:center}
        .wrap-input i:not(.eye-icon){position:absolute;color:#64748b;font-size:13px}
        [dir="rtl"] .wrap-input i:not(.eye-icon){right:12px}
        [dir="ltr"] .wrap-input i:not(.eye-icon){left:12px}
        .eye-btn{position:absolute;background:none;border:none;color:#64748b;cursor:pointer;font-size:13px;padding:4px}
        [dir="rtl"] .eye-btn{left:10px}
        [dir="ltr"] .eye-btn{right:10px}
        input{width:100%;padding:10px 12px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#fff;font-size:13px;outline:none;transition:all .2s}
        [dir="rtl"] input{padding-right:36px;padding-left:36px}
        [dir="ltr"] input{padding-left:36px;padding-right:36px}
        input:focus{border-color:#38bdf8}

        input[readonly]{background:rgba(15,23,42,.6)!important;color:#94a3b8!important;border-color:rgba(255,255,255,.08)!important;cursor:not-allowed!important}

        .cap-box{background:rgba(10,15,30,.5);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;margin-bottom:14px}
        .cap-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
        #c-canvas{border-radius:12px;background:#050811;border:1px solid rgba(56,189,248,.3);cursor:pointer;box-shadow:0 6px 25px rgba(0,0,0,.7),inset 0 0 15px rgba(56,189,248,.05)}
        .ref-btn{background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.4);border-radius:10px;color:#38bdf8;width:42px;height:42px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .ref-btn:hover{background:rgba(56,189,248,.25);transform:rotate(180deg)}
        .cap-input{text-align:center;letter-spacing:6px;font-weight:700;padding:8px!important;font-family:'Orbitron',sans-serif!important}

        .btn{width:100%;padding:12px;background:linear-gradient(135deg,#0284c7,#9333ea);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:bold;cursor:pointer}
        .btn:disabled{background:rgba(255,255,255,.1);color:#64748b;cursor:not-allowed}
        .footer{text-align:center;margin-top:14px;font-size:12px;color:#94a3b8}
        .footer a{color:#38bdf8;text-decoration:none}
        #msg{margin-top:8px;font-size:12px;text-align:center;font-weight:bold;padding:6px;border-radius:6px}
        .err{color:#ef4444;background:rgba(239,68,68,.1)}
        .succ{color:#22c55e;background:rgba(34,197,94,.1)}
    </style>
</head>
<body>
    <div class="card">
        <div class="header-actions">
            <a href="support.html" class="lb" id="btn-support"><i class="fas fa-headset" style="color:#a855f7"></i></a>
            <div class="wrap">
                <button type="button" class="lb" id="lang-btn"><i class="fas fa-globe" style="color:#22c55e"></i></button>
                <div class="menu" id="lang-menu">
                    <div class="mi" data-lang="en">English</div>
                    <div class="mi" data-lang="fa">فارسی</div>
                    <div class="mi" data-lang="ar">العربية</div>
                    <div class="mi" data-lang="tr">Türkçe</div>
                    <div class="mi" data-lang="ru">Русский</div>
                    <div class="mi" data-lang="es">Español</div>
                    <div class="mi" data-lang="fr">Français</div>
                    <div class="mi" data-lang="de">Deutsch</div>
                </div>
            </div>
        </div>

        <div class="logo">
            <div class="logo-header">
                <div class="logo-icon">Z</div>
                <div class="logo-text">ZENIX</div>
            </div>
            <p id="t-wel">Register New Account</p>
        </div>

        <form id="form">
            <div class="group">
                <label id="l-email"><i class="fas fa-envelope"></i> Email <span class="req">*</span></label>
                <div class="wrap-input">
                    <i class="fas fa-at"></i>
                    <input type="email" id="email" placeholder="Email" required>
                </div>
            </div>
            <div class="group">
                <label id="l-name"><i class="fas fa-id-card"></i> Full Name <span class="req">*</span></label>
                <div class="wrap-input">
                    <i class="fas fa-user"></i>
                    <input type="text" id="fullname" placeholder="Full Name" required>
                </div>
            </div>
            <div class="group">
                <label id="l-pass"><i class="fas fa-lock"></i> Password <span class="req">*</span></label>
                <div class="wrap-input">
                    <i class="fas fa-key"></i>
                    <input type="password" id="pass" placeholder="Password" required>
                    <button type="button" class="eye-btn" onclick="togglePassword('pass',this)"><i class="fas fa-eye eye-icon"></i></button>
                </div>
            </div>
            <div class="group">
                <label id="l-confirm-pass"><i class="fas fa-lock"></i> Confirm Password <span class="req">*</span></label>
                <div class="wrap-input">
                    <i class="fas fa-key"></i>
                    <input type="password" id="confirm-pass" placeholder="Confirm Password" required>
                    <button type="button" class="eye-btn" onclick="togglePassword('confirm-pass',this)"><i class="fas fa-eye eye-icon"></i></button>
                </div>
            </div>
            <div class="group">
                <label id="l-ref"><i class="fas fa-ticket"></i> Referral Code</label>
                <div class="wrap-input">
                    <i class="fas fa-ticket-alt" id="ref-icon"></i>
                    <input type="text" id="ref-in" placeholder="Referral Code">
                </div>
            </div>
            <div class="group">
                <label id="l-cap"><i class="fas fa-shield-alt"></i> Security Code <span class="req">*</span></label>
                <div class="cap-box">
                    <div class="cap-row">
                        <canvas id="c-canvas" width="165" height="44"></canvas>
                        <button type="button" class="ref-btn" id="ref-btn"><i class="fas fa-sync-alt"></i></button>
                    </div>
                    <input type="text" id="cap-in" class="cap-input" placeholder="Enter code" maxlength="5" autocomplete="off" required>
                </div>
            </div>
            <button type="submit" id="t-btn" class="btn" disabled>Sign Up</button>
            <div id="msg"></div>
        </form>

        <div class="footer">
            <p><a href="login.html" id="t-back"><i class="fas fa-arrow-left"></i> Back to Login Page</a></p>
        </div>
    </div>

    <script>
        function togglePassword(id,btn){
            const input=document.getElementById(id);
            if(input.type==='password'){input.type='text';btn.innerHTML='<i class="fas fa-eye-slash eye-icon"></i>';}
            else{input.type='password';btn.innerHTML='<i class="fas fa-eye eye-icon"></i>';}
        }
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // مطمئن شوید کلید ANON KEY به فرمت استاندارد eyJ... باشد
        const SUPABASE_URL = "https://ujyenmqdgivuxvxptwyl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO";
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const langData = {
            fa:{dir:'rtl',wel:'ثبت‌نام حساب کاربری جدید',email:'ایمیل',emailP:'ایمیل',name:'نام و نام خانوادگی',nameP:'نام و نام خانوادگی',pass:'رمز عبور',passP:'رمز عبور',confirmPass:'تکرار رمز عبور',confirmPassP:'تکرار رمز عبور',ref:'کد معرف (اختیاری)',refP:'کد معرف',cap:'کد امنیتی',capP:'کد را وارد کنید',btn:'ثبت‌نام در زنیکس',back:'ورود به حساب کاربری',succ:'ثبت‌نام با موفقیت انجام شد! در حال انتقال به صفحه ورود...',err:'کد امنیتی اشتباه است!',refErr:'کد معرف معتبر نیست!',passErr:'رمز عبور و تکرار آن مطابقت ندارند!',lenErr:'رمز عبور باید حداقل ۶ کاراکتر باشد!',existErr:'این ایمیل قبلاً ثبت شده است!',supTitle:'پشتیبانی',langTitle:'تغییر زبان'},
            en:{dir:'ltr',wel:'Register New Account',email:'Email',emailP:'Email',name:'Full Name',nameP:'Full Name',pass:'Password',passP:'Password',confirmPass:'Confirm Password',confirmPassP:'Confirm Password',ref:'Referral Code (Optional)',refP:'Referral Code',cap:'Security Code',capP:'Enter code',btn:'Sign Up',back:'Back to Login Page',succ:'Successfully registered! Redirecting to login...',err:'Invalid security code!',refErr:'Invalid referral code!',passErr:'Passwords do not match!',lenErr:'Password must be at least 6 characters!',existErr:'Email already registered!',supTitle:'Support',langTitle:'Change Language'}
        };
        
        let currentLang = localStorage.getItem('zenix_lang') || 'en', code = '';
        const langBtn = document.getElementById('lang-btn'), langMenu = document.getElementById('lang-menu');
        
        langBtn.onclick = e => { e.stopPropagation(); langMenu.classList.toggle('show'); };
        document.onclick = e => { if (!e.target.closest('.menu') && !e.target.closest('#lang-btn')) langMenu.classList.remove('show'); };
        
        function setLang(l) {
            currentLang = l;
            localStorage.setItem('zenix_lang', l);
            langMenu?.classList.remove('show');
            const t = langData[l] || langData.en;
            document.documentElement.setAttribute('dir', t.dir);
            document.documentElement.setAttribute('lang', l);
            document.getElementById('t-wel').textContent = t.wel;
            document.getElementById('l-email').innerHTML = `<i class="fas fa-envelope"></i> ${t.email} <span class="req">*</span>`;
            document.getElementById('email').placeholder = t.emailP;
            document.getElementById('l-name').innerHTML = `<i class="fas fa-id-card"></i> ${t.name} <span class="req">*</span>`;
            document.getElementById('fullname').placeholder = t.nameP;
            document.getElementById('l-pass').innerHTML = `<i class="fas fa-lock"></i> ${t.pass} <span class="req">*</span>`;
            document.getElementById('pass').placeholder = t.passP;
            document.getElementById('l-confirm-pass').innerHTML = `<i class="fas fa-lock"></i> ${t.confirmPass} <span class="req">*</span>`;
            document.getElementById('confirm-pass').placeholder = t.confirmPassP;
            document.getElementById('l-ref').innerHTML = `<i class="fas fa-ticket-alt"></i> ${t.ref}`;
            document.getElementById('ref-in').placeholder = t.refP;
            document.getElementById('l-cap').innerHTML = `<i class="fas fa-shield-alt"></i> ${t.cap} <span class="req">*</span>`;
            document.getElementById('cap-in').placeholder = t.capP;
            document.getElementById('t-btn').textContent = t.btn;
            const arrowIcon = t.dir === 'rtl' ? 'fa-arrow-right' : 'fa-arrow-left';
            document.getElementById('t-back').innerHTML = `<i class="fas ${arrowIcon}"></i> ${t.back}`;
        }
        
        document.querySelectorAll('#lang-menu .mi').forEach(i => i.onclick = () => setLang(i.dataset.lang));
        
        const cv = document.getElementById('c-canvas'), emailIn = document.getElementById('email'), nameIn = document.getElementById('fullname'), passIn = document.getElementById('pass'), confirmPassIn = document.getElementById('confirm-pass'), refIn = document.getElementById('ref-in'), capIn = document.getElementById('cap-in'), btn = document.getElementById('t-btn'), msg = document.getElementById('msg'), form = document.getElementById('form'), urlParams = new URLSearchParams(window.location.search), refParam = urlParams.get('ref');
        
        if (refParam) {
            refIn.value = refParam;
            refIn.readOnly = true;
        }

        function chk() {
            btn.disabled = !(emailIn.value.trim() && nameIn.value.trim() && passIn.value.trim() && confirmPassIn.value.trim() && capIn.value.length === 5);
        }
        [emailIn, nameIn, passIn, confirmPassIn, refIn, capIn].forEach(i => i.oninput = chk);
        
        function drawCap() {
            if (!cv) return;
            const ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
            code = '';
            const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
            for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));

            ctx.clearRect(0, 0, w, h);
            const bgGrad = ctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, '#030712'); bgGrad.addColorStop(0.5, '#0b1329'); bgGrad.addColorStop(1, '#02050e');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, w, h);

            const neonColors = ['#38bdf8', '#c084fc', '#34d399', '#f43f5e', '#fbbf24'];
            const cw = w / 5;

            for (let i = 0; i < 5; i++) {
                const x = i * cw + cw / 2, y = h / 2, color = neonColors[i % neonColors.length];
                ctx.save();
                ctx.translate(x, y);
                ctx.font = '700 24px "Vazirmatn", system-ui, sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = color;
                ctx.fillText(code[i], 0, 0);
                ctx.restore();
            }
        }
        
        document.getElementById('ref-btn').onclick = () => { capIn.value = ''; drawCap(); chk(); };
        cv.onclick = () => { drawCap(); chk(); };
        
        form.onsubmit = async (e) => {
            e.preventDefault();
            const t = langData[currentLang] || langData.en;
            if (passIn.value.length < 6) { msg.textContent = t.lenErr; msg.className = 'err'; return; }
            if (passIn.value !== confirmPassIn.value) { msg.textContent = t.passErr; msg.className = 'err'; return; }
            if (capIn.value.toUpperCase() !== code) { msg.textContent = t.err; msg.className = 'err'; capIn.value = ''; drawCap(); chk(); return; }

            btn.disabled = true;
            msg.textContent = '';
            msg.className = '';

            const emailValue = emailIn.value.trim().toLowerCase();
            const fullNameValue = nameIn.value.trim();
            const refCodeValue = refIn.value.trim().toUpperCase() || 'SYSTEM';
            const userOwnRefCode = Math.random().toString(36).substring(2, 8).toUpperCase();

            try {
                // ثبت‌نام در Supabase Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: emailValue,
                    password: passIn.value,
                    options: {
                        data: {
                            fullname: fullNameValue,
                            referred_by: refCodeValue,
                            referral_code: userOwnRefCode
                        }
                    }
                });

                if (authError) throw authError;

                // ثبت کاربر در جدول users دیتابیس
                if (authData?.user) {
                    const userPayload = {
                        id: authData.user.id,
                        email: emailValue,
                        referred_by: refCodeValue,
                        referral_code: userOwnRefCode,
                        balance: 0,
                        created_at: new Date().toISOString()
                    };

                    const { error: dbError } = await supabaseClient
                        .from('users')
                        .upsert(userPayload, { onConflict: 'id' });

                    if (dbError) console.warn('Database Sync Warning:', dbError.message);
                }

                await supabaseClient.auth.signOut();
                msg.textContent = t.succ;
                msg.className = 'succ';

                setTimeout(() => { window.location.href = 'login.html'; }, 1500);

            } catch (error) {
                btn.disabled = false;
                if (error.message?.toLowerCase().includes('already registered')) {
                    msg.textContent = t.existErr;
                } else {
                    msg.textContent = error.message || 'خطایی رخ داده است';
                }
                msg.className = 'err';
                capIn.value = '';
                drawCap();
                chk();
            }
        };
        
        setLang(currentLang);
        drawCap();
        chk();
    </script>
</body>
</html>
