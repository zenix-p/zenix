    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans','Vazirmatn',sans-serif}

        /* ── Fix: کل صفحه دقیقاً اندازه‌ی گوشی ── */
        html{
            background:#030712;
            height:100vh;
            height:100dvh;
            overflow:hidden;
        }
        body{
            background:#030712;
            height:100vh;
            height:100dvh;
            color:#f8fafc;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            box-sizing:border-box;
            -webkit-text-size-adjust:100%;
            -moz-text-size-adjust:100%;
            text-size-adjust:100%;
        }

        .toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;width:90%;max-width:420px}
        .toast{padding:14px 18px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:flex-start;gap:12px;box-shadow:0 12px 35px rgba(0,0,0,0.7);backdrop-filter:blur(14px);opacity:0;transform:translateY(-20px);transition:all 0.35s cubic-bezier(0.68,-0.55,0.27,1.55);pointer-events:auto;direction:rtl;line-height:1.5}
        .toast.show{opacity:1;transform:translateY(0)}
        .toast-success{background:rgba(16,185,129,0.22);border:1px solid rgba(16,185,129,0.6);color:#34d399}
        .toast-error{background:rgba(239,68,68,0.22);border:1px solid rgba(239,68,68,0.6);color:#f87171}
        .toast-info{background:rgba(15,23,42,0.92);border:1px solid rgba(56,189,248,0.5);color:#38bdf8;box-shadow:0 0 25px rgba(56,189,248,0.25)}

        /* ═══════════════════════════════════════════════════════
           هدر
           ═══════════════════════════════════════════════════════ */
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:100;backdrop-filter:blur(10px);flex-shrink:0}
        .hr{display:flex;align-items:center;gap:8px}
        .wrap{position:relative}
        .lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;width:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#38bdf8;text-decoration:none}
        .menu{display:none;position:absolute;top:42px;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:8px;width:max-content;min-width:max-content;white-space:nowrap;padding:6px;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.8)}
        [dir="rtl"] .wrap .menu{left:0}
        [dir="ltr"] .wrap .menu{right:0}
        .menu.show{display:block}
        .mi{padding:7px 12px;font-size:12px;color:#cbd5e1;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;transition:all 0.2s ease}
        .mi:hover,.mi.active{background:rgba(56,189,248,.15);color:#38bdf8!important;font-weight:700}

        /* ═══════════════════════════════════════════════════════
           ★ لوگوی طلایی هدر — نسخه‌ی افقی کوچیک‌شده
           ═══════════════════════════════════════════════════════ */
        .logo{
            display:flex;
            align-items:center;
            gap:6px;
        }
        .logo-mark{
            position:relative;
            width:38px;
            height:38px;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-shrink:0;
        }
        .logo-glow{
            position:absolute;
            inset:-6px;
            border-radius:50%;
            background:radial-gradient(circle,rgba(251,191,36,.5),transparent 65%);
            filter:blur(8px);
            animation:logoGlowPulse 3s ease-in-out infinite;
            pointer-events:none;
        }
        @keyframes logoGlowPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}

        .logo-crown{
            position:relative;
            width:38px;
            height:38px;
            display:flex;
            align-items:center;
            justify-content:center;
            filter:drop-shadow(0 4px 10px rgba(251,191,36,.5)) drop-shadow(0 2px 4px rgba(245,158,11,.35));
            z-index:2;
        }
        .logo-crown svg{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            display:block;
        }
        .logo-z{
            position:relative;
            z-index:2;
            font-family:'Cinzel',serif;
            font-weight:900;
            font-size:16px;
            line-height:1;
            padding-top:7px;
            background:linear-gradient(180deg,#fef9c3 0%,#fbbf24 30%,#f59e0b 55%,#ffffff 60%,#d97706 70%,#b45309 100%);
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
            filter:
                drop-shadow(0 1px 0 #78350f)
                drop-shadow(0 0 6px rgba(251,191,36,.5));
        }
        .logo-orbit{
            position:absolute;
            top:50%;
            left:50%;
            border-radius:50%;
            border:1px solid transparent;
            pointer-events:none;
            z-index:3;
        }
        .logo-orbit.orbit-a{
            width:48px;height:48px;margin:-24px 0 0 -24px;
            border-top-color:rgba(251,191,36,.85);
            border-right-color:rgba(251,191,36,.2);
            animation:logoOrbitA 3.5s linear infinite;
        }
        .logo-orbit.orbit-b{
            width:54px;height:54px;margin:-27px 0 0 -27px;
            border-bottom-color:rgba(245,158,11,.65);
            border-left-color:rgba(245,158,11,.15);
            animation:logoOrbitB 4.5s linear infinite reverse;
        }
        @keyframes logoOrbitA{to{transform:rotate(360deg)}}
        @keyframes logoOrbitB{to{transform:rotate(-360deg)}}

        .logo-text{
            font-family:'Italianno',cursive;
            font-weight:700;
            font-size:44px;
            line-height:.8;
            margin-top:-10px;
            background:linear-gradient(180deg,
                #fef9c3 0%,
                #fde68a 20%,
                #fbbf24 40%,
                #ffffff 50%,
                #f59e0b 62%,
                #b45309 85%,
                #78350f 100%);
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
            filter:
                drop-shadow(0 1px 0 rgba(120,53,15,.9))
                drop-shadow(0 2px 10px rgba(251,191,36,.45));
            padding-inline-start:2px;
        }

        /* ── Wrapper اصلی ── */
        .c{
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px 15px;
            width:100%;
            overflow-y:auto;
            -webkit-overflow-scrolling:touch;
        }

        .card{
            width:100%;
            max-width:440px;
            background:rgba(30,41,59,0.8);
            border:1px solid rgba(56,189,248,0.3);
            border-radius:12px;
            padding:24px;
            box-shadow:0 10px 30px rgba(0,0,0,0.5);
            max-height:100%;
            overflow-y:auto;
            scrollbar-width:thin;
            scrollbar-color:rgba(56,189,248,.3) transparent;
        }
        .card::-webkit-scrollbar{width:4px}
        .card::-webkit-scrollbar-track{background:transparent}
        .card::-webkit-scrollbar-thumb{background:rgba(56,189,248,.3);border-radius:2px}

        .card-title{text-align:center;margin-bottom:20px;color:#38bdf8;font-size:18px;font-weight:800}
        .card-title i{margin-left:8px}

        .fg{margin-bottom:15px}
        .fl{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
        .fi{width:100%;padding:12px 14px;background:rgba(15,23,42,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#f8fafc;font-size:13px;outline:none;transition:0.2s;direction:ltr;text-align:left}
        .fi:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,0.2)}

        .bs{display:block;width:100%;background:#38bdf8;color:#0f172a;border:none;padding:12px;font-weight:bold;border-radius:8px;cursor:pointer;font-size:14px;text-align:center;transition:0.2s}
        .bs:hover{background:#0ea5e9}
        .bs:disabled{opacity:0.6;cursor:not-allowed;background:#64748b;color:#cbd5e1}
        .bs-purple{background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.4);color:#c084fc;}
        .bs-purple:hover{background:rgba(168,85,247,.25);color:#e0c7ff}

        .hint-box{padding:12px 14px;border-radius:8px;font-size:12px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;line-height:1.6;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8}
        .hint-box i{font-size:16px;margin-top:2px;flex-shrink:0}

        .otp-row{display:flex;gap:8px;align-items:flex-start}
        .otp-row .bs{width:auto;flex-shrink:0;padding:12px 14px;font-size:12px;white-space:nowrap}

        .footer{text-align:center;margin-top:20px;font-size:12px;color:#94a3b8}
        .footer a{color:#38bdf8;text-decoration:none;font-weight:700}
        .footer a:hover{text-decoration:underline}

        /* ═══════════════════════════════════════════════
           موبایل: کارت تمام‌صفحه
           ═══════════════════════════════════════════════ */
        @media (max-width: 480px) {
            header{
                background:#0b1120;
                border-bottom:none;
                padding:max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
            }
            .c{
                padding: 0;
                overflow: hidden;
            }
            .card{
                max-width: 100%;
                width: 100%;
                height: 100%;
                border-radius: 0;
                border: none;
                box-shadow: none;
                background: #0b1120;
                padding: max(20px, env(safe-area-inset-bottom)) 18px 20px 18px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                overflow-y: auto;
            }
            .card-title { font-size: 16px; margin-bottom: 16px; }
            .otp-row { flex-wrap: wrap; }
            .otp-row .bs { flex: 1 1 100%; width: 100%; }

            /* لوگو کوچیک‌تر در موبایل */
            .logo-mark{width:34px;height:34px}
            .logo-crown{width:34px;height:34px}
            .logo-z{font-size:14px;padding-top:6px}
            .logo-orbit.orbit-a{width:42px;height:42px;margin:-21px 0 0 -21px}
            .logo-orbit.orbit-b{width:48px;height:48px;margin:-24px 0 0 -24px}
            .logo-text{font-size:38px;margin-top:-8px}
        }
    </style>
</head>
<body>

    <script>
        window.showToast = function(message, type = 'success', duration = 5000) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            let iconClass = 'fa-check-circle';
            if (type === 'error') iconClass = 'fa-exclamation-circle';
            if (type === 'info') iconClass = 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${iconClass}"></i><div style="flex:1;">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('show'); }, 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => { toast.remove(); }, 350); }, duration);
        };
    </script>

    <script type="module">

        function setLang(l) {
            if (!SUPPORTED_LANGUAGES.includes(l)) l = 'fa';
            currLang = l;
            localStorage.setItem('zenix_lang', l);
            document.documentElement.setAttribute('lang', l);
            document.documentElement.setAttribute('dir', (l === 'fa' || l === 'ar') ? 'rtl' : 'ltr');

            const t = langData[l] || langData.fa;
            document.getElementById('t-title').innerHTML = `<i class="fas fa-key"></i> ${t.title}`;
            document.getElementById('t-email-lbl').textContent = t.email;
            document.getElementById('t-hint').textContent = t.hint;
            document.getElementById('t-btn-support').textContent = t.btnSup;
            document.getElementById('t-otp-lbl').textContent = t.otp;
            document.getElementById('t-pass1-lbl').textContent = t.pass1;
            document.getElementById('t-pass2-lbl').textContent = t.pass2;
            document.getElementById('t-btn-submit').textContent = t.btnSub;
            document.getElementById('t-footer').innerHTML = `${t.foot} <a href="index.html">${t.login}</a>`;

            document.querySelectorAll('#lang-menu .mi').forEach(item => {
                item.classList.toggle('active', item.dataset.lang === l);
            });
        }

        document.getElementById('lang-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('lang-menu').classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.wrap')) {
                document.getElementById('lang-menu').classList.remove('show');
            }
        });

        document.querySelectorAll('#lang-menu .mi').forEach(item => {
            item.addEventListener('click', () => {
                setLang(item.dataset.lang);
                document.getElementById('lang-menu').classList.remove('show');
            });
        });

        const emailIn = document.getElementById('email');
        const otpIn = document.getElementById('otp');
        const pass1 = document.getElementById('pass1');
        const pass2 = document.getElementById('pass2');
        const btnSubmit = document.getElementById('btn-submit');
        const form = document.getElementById('reset-form');

        function checkInputs() {
            const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailIn.value.trim());
            const isOtpValid = otpIn.value.trim().length === 6;
            const isPassValid = pass1.value.length >= 8;
            const isMatch = pass1.value === pass2.value;

            btnSubmit.disabled = !(isEmailValid && isOtpValid && isPassValid && isMatch);
        }

        [emailIn, otpIn, pass1, pass2].forEach(input => {
            input.addEventListener('input', checkInputs);
        });

        const savedEmail = sessionStorage.getItem('zenix_reset_email');
        if (savedEmail) {
            emailIn.value = savedEmail;
            checkInputs();
        }

        window.goToSupport = async function() {
            const email = emailIn.value.trim();
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                window.showToast('لطفاً ابتدا یک ایمیل معتبر وارد کنید.', 'error');
                return;
            }

            const btn = document.querySelector('.bs-purple');
            const origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال بررسی...';

            try {
                const { data, error } = await supabaseClient.rpc('generate_password_reset_otp', { user_email: email });

                if (error) {
                    if (error.message && error.message.includes('یافت نشد')) {
                        window.showToast(
                            'این ایمیل در سیستم ثبت‌نام نشده است. لطفاً ابتدا ثبت‌نام کنید یا ایمیل صحیح را وارد کنید.',
                            'error',
                            6000
                        );
                    } else {
                        window.showToast('خطا: ' + (error.message || 'خطا در دریافت کد'), 'error');
                    }
                    btn.disabled = false;
                    btn.innerHTML = origHtml;
                    return;
                }

                sessionStorage.setItem('zenix_reset_email', email);
                sessionStorage.setItem('zenix_support_email', email);
                sessionStorage.setItem('zenix_return_page', 'forgot-password.html');
                sessionStorage.setItem('zenix_return_focus', 'otp');

                window.location.href = 'support.html?otp=1';

            } catch (e) {
                window.showToast('خطا: ' + (e.message || 'خطا در دریافت کد'), 'error');
                btn.disabled = false;
                btn.innerHTML = origHtml;
            }
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailIn.value.trim().toLowerCase();
            const otp = otpIn.value.trim();
            const newPass = pass1.value;

            if (newPass.length < 8) {
                window.showToast('رمز عبور باید حداقل ۸ کاراکتر باشد.', 'error');
                return;
            }
            if (newPass !== pass2.value) {
                window.showToast('رمز عبور و تکرار آن یکسان نیستند.', 'error');
                return;
            }

            const origHtml = btnSubmit.innerHTML;
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال بررسی...';

            try {
                const { data, error } = await supabaseClient.rpc('reset_password_with_otp', {
                    user_email: email,
                    input_otp: otp,
                    new_password: newPass
                });

                if (error) throw error;

                try {
                    if (window.ZenixDevice) {
                        await window.ZenixDevice.logActivity(supabaseClient, email, 'password_reset');
                    } else {
                        console.warn('[Device] ZenixDevice not loaded — device.js missing?');
                    }
                } catch (devErr) {
                    console.warn('[Device] log failed (non-blocking):', devErr);
                }

                window.showToast('✅ رمز عبور شما با موفقیت تغییر کرد! در حال انتقال به صفحه ورود...', 'success', 3000);
                sessionStorage.removeItem('zenix_reset_email');
                sessionStorage.removeItem('zenix_support_email');
                sessionStorage.removeItem('zenix_return_page');
                sessionStorage.removeItem('zenix_return_focus');
                setTimeout(() => { window.location.href = 'index.html'; }, 2500);

            } catch (error) {
                console.error(error);
                let errorMsg = error.message || 'خطا در تغییر رمز عبور. لطفاً دوباره تلاش کنید.';
                if (errorMsg.includes('کد وارد شده نامعتبر است')) errorMsg = 'کد وارد شده نامعتبر است.';
                if (errorMsg.includes('کد وارد شده منقضی شده است')) errorMsg = 'کد وارد شده منقضی شده است.';
                if (errorMsg.includes('کاربری با این ایمیل یافت نشد')) errorMsg = 'کاربری با این ایمیل یافت نشد.';

                window.showToast(errorMsg, 'error', 5000);
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = origHtml;
            }
        });

        setLang(currLang);
        checkInputs();
    </script>

    <!-- ── Zenix Service Worker Registration ── -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js?v=2').then(function (reg) {
                    setInterval(function () {
                        reg.update().catch(function () {});
                    }, 60000);
                    document.addEventListener('visibilitychange', function () {
                        if (document.visibilityState === 'visible') {
                            reg.update().catch(function () {});
                        }
                    });
                }).catch(function (e) {
                    console.warn('[Zenix SW] register failed:', e);
                });
            });
        }
    </script>
</body>
</html>
