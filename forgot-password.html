    <script>
        function togglePassword(id, btn){
            const input = document.getElementById(id);
            if(input.disabled) return;
            if(input.type === 'password'){
                input.type = 'text';
                btn.innerHTML = '<i class="fas fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="fas fa-eye"></i>';
            }
        }
    </script>

            document.getElementById('btn-support').setAttribute('title', t.supTitle); 
            langBtn.setAttribute('title', t.langTitle);
            document.querySelectorAll('#lang-menu .mi').forEach(i => i.classList.toggle('active', i.dataset.lang === l));
        }

        document.querySelectorAll('#lang-menu .mi').forEach(i => i.addEventListener('click', () => { setLang(i.dataset.lang); clearError(); }));
        function clearError() { if (msg) { msg.innerHTML = ''; msg.className = ''; } }
        
        function updatePassState() {
            const isOtpValid = otpIn.value.trim().length === 6;
            pass1In.disabled = !isOtpValid;
            pass2In.disabled = !isOtpValid;
            
            pass1In.parentElement.querySelector('.eye-btn').disabled = !isOtpValid;
            pass2In.parentElement.querySelector('.eye-btn').disabled = !isOtpValid;
        }

        function updateSendOtpBtnState() {
            if (sendOtpBtn && countdown <= 0) {
                sendOtpBtn.disabled = !(userIn.value.trim().length > 0);
            }
        }

        function checkInputs() { 
            updateSendOtpBtnState();
            submitBtn.disabled = !(
                userIn.value.trim().length > 0 && 
                otpIn.value.trim().length === 6 && 
                pass1In.value.length >= 6 && 
                pass2In.value.length >= 6 && 
                capIn.value.trim().length === 5
            ); 
        }

        /* ارسال واقعی ایمیل با EmailJS */
        sendOtpBtn.addEventListener('click', async () => {
            const t = langData[currentLang] || langData.fa;
            const userEmail = userIn.value.trim();

            if (!userEmail) {
                msg.innerHTML = `<div>${t.errUserReq}</div>`;
                msg.className = 'err show';
                return;
            }

            // تولید کد ۶ رقمی تصادفی
            generatedOtpCode = Math.floor(100000 + Math.random() * 900000).toString();

            // تغییر وضعیت دکمه در زمان ارسال
            sendOtpBtn.disabled = true;
            document.getElementById('txt-send-otp').textContent = "...";

            try {
                // ارسال درخواست به EmailJS
                await emailjs.send('service_61bzf1a', 'template_jyzgfs8', {
                    to_email: userEmail,
                    email: userEmail,
                    user_email: userEmail,
                    otp_code: generatedOtpCode,
                    code: generatedOtpCode,
                    pass_code: generatedOtpCode
                });

                msg.innerHTML = `<div>${t.succOtp}</div>`;
                msg.className = 'succ show';

                // شروع تایمر معکوس ۶۰ ثانیه‌ای
                countdown = 60;
                document.getElementById('txt-send-otp').textContent = `${countdown}s`;

                clearInterval(otpTimer);
                otpTimer = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        document.getElementById('txt-send-otp').textContent = `${countdown}s`;
                    } else {
                        clearInterval(otpTimer);
                        document.getElementById('txt-send-otp').textContent = t.sendOtp;
                        updateSendOtpBtnState();
                    }
                }, 1000);

            } catch (error) {
                console.error('EmailJS Error:', error);
                msg.innerHTML = `<div>خطا در ارسال ایمیل! لطفاً از درست بودن ایمیل اطمینان حاصل کنید.</div>`;
                msg.className = 'err show';
                document.getElementById('txt-send-otp').textContent = t.sendOtp;
                updateSendOtpBtnState();
            }
        });

        otpIn.addEventListener('input', () => {
            updatePassState();
            checkInputs();
        });

        [userIn, pass1In, pass2In, capIn].forEach(i => {
            i.addEventListener('focus', clearError);
            i.addEventListener('input', checkInputs);
        });

        function drawCap() {
            if (!cv) return;
            const ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
            code = '';
            const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
            for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));

            ctx.clearRect(0, 0, w, h);
            const bgGrad = ctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, '#030712'); bgGrad.addColorStop(0.5, '#0b1329'); bgGrad.addColorStop(1, '#02050e');
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(56,189,248,0.12)'; ctx.lineWidth = 1;
            for (let i = 0; i < 2; i++) {
                ctx.beginPath(); ctx.moveTo(Math.random() * w, Math.random() * h);
                ctx.lineTo(Math.random() * w, Math.random() * h); ctx.stroke();
            }

            const neonColors = ['#38bdf8', '#c084fc', '#34d399', '#f43f5e', '#fbbf24'];
            const cw = w / 5;

            for (let i = 0; i < 5; i++) {
                const x = i * cw + cw / 2, y = h / 2 + (Math.random() - 0.5) * 4, color = neonColors[i % neonColors.length];
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate((Math.random() - 0.5) * 0.2);

                ctx.font = '700 24px "Vazirmatn", system-ui, sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.shadowColor = color; ctx.shadowBlur = 4;
                ctx.strokeStyle = '#020617'; ctx.lineWidth = 2;
                ctx.strokeText(code[i], 0, 0);
                ctx.fillStyle = color;
                ctx.fillText(code[i], 0, 0);
                ctx.restore();
            }
        }

        document.getElementById('ref-btn').addEventListener('click', () => { capIn.value = ''; drawCap(); checkInputs(); });
        cv.addEventListener('click', () => { drawCap(); checkInputs(); });

        /* ثبت نهایی فرم و بررسی صحت اطلاعات */
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const t = langData[currentLang] || langData.fa;
            
            // ۱. بررسی کد کپچا
            if (capIn.value.toUpperCase() !== code) {
                msg.innerHTML = `<div>${t.errCap}</div>`; 
                msg.className = 'err show';
                capIn.value = ''; drawCap(); checkInputs();
                return;
            }

            // ۲. بررسی صحت کد ۶ رقمی ایمیل
            if (!generatedOtpCode || otpIn.value.trim() !== generatedOtpCode) {
                msg.innerHTML = `<div>کد ۶ رقمی وارد شده نادرست است!</div>`; 
                msg.className = 'err show';
                return;
            }

            // ۳. بررسی طول رمز عبور
            if (pass1In.value.length < 6) {
                msg.innerHTML = `<div>${t.errPassLen}</div>`; 
                msg.className = 'err show';
                return;
            }

            // ۴. بررسی یکسان بودن رمزهای عبور
            if (pass1In.value !== pass2In.value) {
                msg.innerHTML = `<div>${t.errPassMatch}</div>`; 
                msg.className = 'err show';
                return;
            }

            msg.innerHTML = `<div>${t.succ}</div>`; 
            msg.className = 'succ show';
            setTimeout(() => window.location.href = 'index.html', 1800);
        });

        setLang(currentLang); drawCap(); updatePassState(); checkInputs();
    </script>
</body>
</html>
