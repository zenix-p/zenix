<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Zenix - بازیابی رمز عبور</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.cn">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Orbitron:wght@700;900&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.loli.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',system-ui,sans-serif}
        body{background:#030712;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#f8fafc;padding:15px;position:relative}
        .glow-1,.glow-2{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none;z-index:1}
        .glow-1{width:250px;height:250px;background:#0ea5e9;top:10%;left:10%}
        .glow-2{width:250px;height:250px;background:#a855f7;bottom:10%;right:10%}
        .auth-card{width:100%;max-width:400px;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px 22px;box-shadow:0 20px 50px rgba(0,0,0,.7);position:relative;z-index:10}
        .logo{text-align:center;margin-bottom:20px}
        .logo-header{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
        .logo-icon{width:46px;height:46px;background:linear-gradient(135deg,#0ea5e9,#9333ea);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Orbitron',sans-serif;font-size:24px;font-weight:900;font-style:italic;transform:skewX(-6deg);box-shadow:0 0 18px rgba(14,165,233,.45)}
        .logo-text{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;letter-spacing:3px;font-style:italic;transform:skewX(-6deg);background:linear-gradient(135deg,#38bdf8,#c084fc,#f43f5e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(56,189,248,.4)}
        .logo p{color:#94a3b8;font-size:12px;margin-top:4px}
        
        .group{margin-bottom:14px}
        .group label{display:block;margin-bottom:6px;font-size:12px;color:#cbd5e1}
        .wrap-input{position:relative;display:flex;align-items:center}
        .wrap-input i.f-icon{position:absolute;color:#64748b;font-size:14px;z-index:2;right:14px}
        .group input{width:100%;padding:12px 14px;padding-right:40px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:13px;outline:0;direction:ltr}
        .group input:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.2)}
        .group input[type="text"] { text-align: center; letter-spacing: 5px; font-weight: bold; font-size: 16px; }
        
        /* دکمه پشتیبانی */
        .support-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.4);color:#c084fc;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;margin-bottom:14px;transition:.3s}
        .support-btn:hover{background:rgba(168,85,247,.25);border-color:#a855f7}

        .btn{width:100%;padding:12px;background:linear-gradient(135deg,#0284c7,#9333ea);color:#fff;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;transition:all .3s ease;margin-top:8px}
        .btn:disabled{background:rgba(255,255,255,.1);color:#64748b;cursor:not-allowed}
        .footer{text-align:center;margin-top:16px;font-size:12px;color:#94a3b8}
        .footer a{color:#38bdf8;text-decoration:none;font-weight:700}
        #msg{margin-top:12px;font-size:12px;text-align:center;font-weight:500;padding:12px;border-radius:12px;display:none}
        #msg.show{display:block}
        .err{color:#f87171;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3)}
        .succ{color:#4ade80;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3)}
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="auth-card">
        <div class="logo">
            <div class="logo-header">
                <div class="logo-icon">Z</div>
                <div class="logo-text">ZENIX</div>
            </div>
            <p>بازیابی رمز عبور</p>
        </div>
        
        <form id="form">
            <!-- فیلد ایمیل -->
            <div class="group">
                <label><i class="fas fa-envelope"></i> ایمیل حساب *</label>
                <div class="wrap-input">
                    <i class="fas fa-envelope f-icon"></i>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
            </div>

            <!-- دکمه ارتباط با پشتیبانی برای دریافت کد -->
            <a href="support.html" class="support-btn" target="_blank">
                <i class="fas fa-headset"></i>
                دریافت کد ۶ رقمی از پشتیبانی
            </a>

            <!-- فیلد کد ۶ رقمی -->
            <div class="group">
                <label><i class="fas fa-shield-alt"></i> کد ۶ رقمی *</label>
                <div class="wrap-input">
                    <i class="fas fa-key f-icon"></i>
                    <input type="text" id="otp" placeholder="------" maxlength="6" required>
                </div>
            </div>

            <!-- رمز عبور جدید -->
            <div class="group">
                <label><i class="fas fa-lock"></i> رمز عبور جدید *</label>
                <div class="wrap-input">
                    <i class="fas fa-lock f-icon"></i>
                    <input type="password" id="pass1" placeholder="حداقل ۸ کاراکتر" required>
                </div>
            </div>

            <!-- تکرار رمز عبور جدید -->
            <div class="group">
                <label><i class="fas fa-check-circle"></i> تکرار رمز عبور *</label>
                <div class="wrap-input">
                    <i class="fas fa-check f-icon"></i>
                    <input type="password" id="pass2" placeholder="تکرار رمز عبور" required>
                </div>
            </div>

            <button type="submit" id="btn" class="btn" disabled>تایید و تغییر رمز</button>
        </form>
        <div id="msg"></div>
        <div class="footer">
            <p>رمزت رو یادت اومده؟ <a href="index.html">ورود</a></p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdmirror.com/npm/@supabase/supabase-js@2/+esm';

        const supabaseClient = createClient(
            "https://ujyenmqdgivuxvxptwyl.supabase.co",
            "sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO"
        );

        const emailIn = document.getElementById('email');
        const otpIn = document.getElementById('otp');
        const pass1 = document.getElementById('pass1');
        const pass2 = document.getElementById('pass2');
        const btn = document.getElementById('btn');
        const form = document.getElementById('form');
        const msg = document.getElementById('msg');

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function checkInputs() {
            btn.disabled = !(
                isValidEmail(emailIn.value.trim()) && 
                otpIn.value.trim().length === 6 && 
                pass1.value.length >= 8 && 
                pass1.value === pass2.value
            );
            msg.className = '';
        }

        [emailIn, otpIn, pass1, pass2].forEach(input => {
            input.addEventListener('input', checkInputs);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailIn.value.trim().toLowerCase();
            const otp = otpIn.value.trim();
            const newPass = pass1.value;

            if (newPass.length < 8) {
                msg.textContent = 'رمز عبور باید حداقل ۸ کاراکتر باشد.';
                msg.className = 'err show';
                return;
            }
            if (newPass !== pass2.value) {
                msg.textContent = 'رمز عبور و تکرار آن یکسان نیستند.';
                msg.className = 'err show';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'در حال بررسی...';
            msg.className = '';

            try {
                // فراخوانی تابع امن دیتابیس
                const { data, error } = await supabaseClient.rpc('reset_password_with_otp', {
                    user_email: email,
                    input_otp: otp,
                    new_password: newPass
                });

                if (error) throw error;

                // موفقیت
                msg.textContent = 'رمز عبور شما با موفقیت تغییر کرد! در حال انتقال به صفحه ورود...';
                msg.className = 'succ show';
                setTimeout(() => { window.location.href = 'index.html'; }, 2500);

            } catch (error) {
                console.error(error);
                // پیام خطای سرور (مثلاً کد نامعتبر است یا منقضی شده)
                msg.textContent = error.message || 'خطا در تغییر رمز عبور. لطفاً دوباره تلاش کنید.';
                msg.className = 'err show';
                btn.disabled = false;
                btn.textContent = 'تایید و تغییر رمز';
            }
        });
    </script>
</body>
</html>
