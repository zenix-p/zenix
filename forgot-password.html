<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Zenix - New Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Apply the site's saved language before the page is rendered.
        (function () {
            var supported = ['en', 'fa', 'ar', 'tr', 'ru', 'es', 'fr', 'de'];
            var lang = 'en';
            try {
                var saved = localStorage.getItem('zenix_lang');
                if (supported.indexOf(saved) !== -1) lang = saved;
            } catch (_) {
                // Keep English as the safe default if localStorage is unavailable.
            }
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', (lang === 'fa' || lang === 'ar') ? 'rtl' : 'ltr');
        })();
    </script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,-apple-system,BlinkMacSystemFont,Tahoma,sans-serif;background-color:#030712;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#f8fafc;padding:15px;position:relative;overflow-x:hidden}
        .glow-1,.glow-2{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none}
        .glow-1{width:250px;height:250px;background:#0ea5e9;top:10%;left:10%}
        .glow-2{width:250px;height:250px;background:#a855f7;bottom:10%;right:10%}
        .auth-card{width:100%;max-width:400px;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.7);position:relative;z-index:10}
        .logo{text-align:center;margin-bottom:22px}
        .logo-icon{width:56px;height:56px;margin:0 auto 10px;background:rgba(56,189,248,.15);border:1px solid #38bdf8;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#38bdf8}
        .logo h2{font-size:26px;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .logo p{color:#94a3b8;font-size:12px;margin-top:4px}
        .group{margin-bottom:14px}
        .group label{display:block;margin-bottom:6px;font-size:12px;color:#cbd5e1}
        .req{color:#ef4444;font-weight:700;margin-inline-start:3px}
        .wrap{position:relative;display:flex;align-items:center}
        .wrap i.f-icon{position:absolute;color:#64748b;font-size:14px}
        html[dir="rtl"] .wrap i.f-icon{right:14px}
        html[dir="ltr"] .wrap i.f-icon{left:14px}
        .group input{width:100%;padding:12px 14px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:13px;outline:0}
        html[dir="rtl"] .group input{padding-right:40px;padding-left:14px}
        html[dir="ltr"] .group input{padding-left:40px;padding-right:14px}
        .group input:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.2)}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,#0284c7,#9333ea);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .3s ease;margin-top:10px}
        .btn:disabled{background:rgba(255,255,255,.1);color:#64748b;cursor:not-allowed;box-shadow:none}
        .footer{text-align:center;margin-top:16px;font-size:12px;color:#94a3b8}
        .footer a{color:#38bdf8;text-decoration:none;font-weight:700}
        #msg{margin-top:10px;font-size:12px;text-align:center;font-weight:700;padding:8px;border-radius:8px}
        .err{color:#ef4444;background:rgba(239,68,68,.1)}
        .succ{color:#22c55e;background:rgba(34,197,94,.1)}
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="auth-card">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-lock" aria-hidden="true"></i></div>
            <h2>ZENIX</h2>
            <p id="t-wel">Set a New Password</p>
        </div>
        <form id="form">
            <div class="group">
                <label for="pass1"><i class="fas fa-key" aria-hidden="true"></i> <span id="t-pass1-label">New Password</span> <span class="req">*</span></label>
                <div class="wrap">
                    <i class="fas fa-lock f-icon" aria-hidden="true"></i>
                    <input type="password" id="pass1" placeholder="At least 6 characters" autocomplete="new-password" required>
                </div>
            </div>
            <div class="group">
                <label for="pass2"><i class="fas fa-check-circle" aria-hidden="true"></i> <span id="t-pass2-label">Confirm New Password</span> <span class="req">*</span></label>
                <div class="wrap">
                    <i class="fas fa-lock f-icon" aria-hidden="true"></i>
                    <input type="password" id="pass2" placeholder="Repeat new password" autocomplete="new-password" required>
                </div>
            </div>
            <button type="submit" id="t-btn" class="btn" disabled>Change Password</button>
            <div id="msg" role="status" aria-live="polite"></div>
        </form>
        <div class="footer">
            <p><a href="index.html" id="t-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> Cancel and return to login</a></p>
        </div>
    </div>
    <script>
        (function () {
            'use strict';
            const translations = {
                en: {
                    dir: 'ltr', pageTitle: 'Zenix - New Password', heading: 'Set a New Password',
                    pass1: 'New Password', pass1Placeholder: 'At least 6 characters',
                    pass2: 'Confirm New Password', pass2Placeholder: 'Repeat new password',
                    submit: 'Change Password', back: 'Cancel and return to login',
                    passLength: 'Password must be at least 6 characters.',
                    passMatch: 'Passwords do not match!', success: 'Password changed successfully! Redirecting to login...'
                },
                fa: {
                    dir: 'rtl', pageTitle: 'Zenix - تغییر رمز عبور', heading: 'تعیین رمز عبور جدید',
                    pass1: 'رمز عبور جدید', pass1Placeholder: 'حداقل ۶ کاراکتر',
                    pass2: 'تکرار رمز عبور جدید', pass2Placeholder: 'تکرار رمز عبور',
                    submit: 'تغییر رمز عبور', back: 'انصراف و بازگشت به ورود',
                    passLength: 'رمز عبور باید حداقل ۶ کاراکتر باشد.',
                    passMatch: 'رمز عبور و تکرار آن یکسان نیستند!', success: 'رمز عبور با موفقیت تغییر کرد! انتقال به ورود...'
                },
                ar: {
                    dir: 'rtl', pageTitle: 'Zenix - تغيير كلمة المرور', heading: 'تعيين كلمة مرور جديدة',
                    pass1: 'كلمة المرور الجديدة', pass1Placeholder: '6 أحرف على الأقل',
                    pass2: 'تأكيد كلمة المرور الجديدة', pass2Placeholder: 'أعد إدخال كلمة المرور',
                    submit: 'تغيير كلمة المرور', back: 'إلغاء والعودة إلى تسجيل الدخول',
                    passLength: 'يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.',
                    passMatch: 'كلمتا المرور غير متطابقتين!', success: 'تم تغيير كلمة المرور بنجاح! جارٍ العودة لتسجيل الدخول...'
                },
                tr: {
                    dir: 'ltr', pageTitle: 'Zenix - Şifreyi Değiştir', heading: 'Yeni Bir Şifre Belirle',
                    pass1: 'Yeni Şifre', pass1Placeholder: 'En az 6 karakter',
                    pass2: 'Yeni Şifreyi Onayla', pass2Placeholder: 'Yeni şifreyi tekrar girin',
                    submit: 'Şifreyi Değiştir', back: 'İptal et ve girişe dön',
                    passLength: 'Şifre en az 6 karakter olmalıdır.',
                    passMatch: 'Şifreler eşleşmiyor!', success: 'Şifre başarıyla değiştirildi! Giriş sayfasına yönlendiriliyorsunuz...'
                },
                ru: {
                    dir: 'ltr', pageTitle: 'Zenix - Новый пароль', heading: 'Установить новый пароль',
                    pass1: 'Новый пароль', pass1Placeholder: 'Не менее 6 символов',
                    pass2: 'Подтвердите новый пароль', pass2Placeholder: 'Повторите новый пароль',
                    submit: 'Изменить пароль', back: 'Отмена и возврат ко входу',
                    passLength: 'Пароль должен содержать не менее 6 символов.',
                    passMatch: 'Пароли не совпадают!', success: 'Пароль успешно изменён! Переход ко входу...'
                },
                es: {
                    dir: 'ltr', pageTitle: 'Zenix - Nueva contraseña', heading: 'Establecer una nueva contraseña',
                    pass1: 'Nueva contraseña', pass1Placeholder: 'Al menos 6 caracteres',
                    pass2: 'Confirmar nueva contraseña', pass2Placeholder: 'Repita la nueva contraseña',
                    submit: 'Cambiar contraseña', back: 'Cancelar y volver al inicio de sesión',
                    passLength: 'La contraseña debe tener al menos 6 caracteres.',
                    passMatch: '¡Las contraseñas no coinciden!', success: '¡Contraseña cambiada correctamente! Volviendo al inicio de sesión...'
                },
                fr: {
                    dir: 'ltr', pageTitle: 'Zenix - Nouveau mot de passe', heading: 'Définir un nouveau mot de passe',
                    pass1: 'Nouveau mot de passe', pass1Placeholder: 'Au moins 6 caractères',
                    pass2: 'Confirmer le nouveau mot de passe', pass2Placeholder: 'Répétez le nouveau mot de passe',
                    submit: 'Changer le mot de passe', back: 'Annuler et revenir à la connexion',
                    passLength: 'Le mot de passe doit contenir au moins 6 caractères.',
                    passMatch: 'Les mots de passe ne correspondent pas !', success: 'Mot de passe modifié avec succès ! Retour à la connexion...'
                },
                de: {
                    dir: 'ltr', pageTitle: 'Zenix - Neues Passwort', heading: 'Neues Passwort festlegen',
                    pass1: 'Neues Passwort', pass1Placeholder: 'Mindestens 6 Zeichen',
                    pass2: 'Neues Passwort bestätigen', pass2Placeholder: 'Neues Passwort wiederholen',
                    submit: 'Passwort ändern', back: 'Abbrechen und zur Anmeldung zurückkehren',
                    passLength: 'Das Passwort muss mindestens 6 Zeichen lang sein.',
                    passMatch: 'Die Passwörter stimmen nicht überein!', success: 'Passwort erfolgreich geändert! Weiter zur Anmeldung...'
                }
            };

            const supported = Object.keys(translations);
            let lang = 'en';
            try {
                const saved = localStorage.getItem('zenix_lang');
                if (supported.includes(saved)) lang = saved;
            } catch (_) {
                // Continue in English when storage is unavailable.
            }

            const pass1 = document.getElementById('pass1');
            const pass2 = document.getElementById('pass2');
            const button = document.getElementById('t-btn');
            const message = document.getElementById('msg');
            const form = document.getElementById('form');

            function applyLanguage(language) {
                const selected = translations[language] ? language : 'en';
                const t = translations[selected];
                lang = selected;
                document.documentElement.lang = selected;
                document.documentElement.dir = t.dir;
                document.title = t.pageTitle;
                document.getElementById('t-wel').textContent = t.heading;
                document.getElementById('t-pass1-label').textContent = t.pass1;
                document.getElementById('t-pass2-label').textContent = t.pass2;
                pass1.placeholder = t.pass1Placeholder;
                pass2.placeholder = t.pass2Placeholder;
                button.textContent = t.submit;
                const back = document.getElementById('t-back');
                back.innerHTML = '<i class="fas ' + (t.dir === 'rtl' ? 'fa-arrow-right' : 'fa-arrow-left') + '" aria-hidden="true"></i> ' + t.back;
                try { localStorage.setItem('zenix_lang', selected); } catch (_) {}
                return t;
            }

            function checkInputs() {
                button.disabled = !(pass1.value.length > 0 && pass2.value.length > 0);
            }

            pass1.addEventListener('input', checkInputs);
            pass2.addEventListener('input', checkInputs);
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                const t = translations[lang] || translations.en;
                if (pass1.value.length < 6) {
                    message.textContent = t.passLength;
                    message.className = 'err';
                    return;
                }
                if (pass1.value !== pass2.value) {
                    message.textContent = t.passMatch;
                    message.className = 'err';
                    return;
                }
                message.textContent = t.success;
                message.className = 'succ';
                setTimeout(function () { window.location.href = 'login.html'; }, 2000);
            });

            applyLanguage(lang);
            checkInputs();
        })();
    </script>
</body>
</html>
