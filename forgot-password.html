<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Zenix - New Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Set the page language from the language selected elsewhere in Zenix.
        // A fresh visitor uses English. This does not change the saved preference.
        (function () {
            var supported = ['en', 'fa', 'ar', 'tr', 'ru', 'es', 'fr', 'de'];
            var language = 'en';
            try {
                var saved = localStorage.getItem('zenix_lang');
                if (supported.indexOf(saved) !== -1) language = saved;
            } catch (_) {}
            document.documentElement.setAttribute('lang', language);
            document.documentElement.setAttribute('dir', (language === 'fa' || language === 'ar') ? 'rtl' : 'ltr');
        })();
    </script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:system-ui,-apple-system,BlinkMacSystemFont,Tahoma,sans-serif;background-color:#030712;min-height:100vh;display:flex;justify-content:center;align-items:center;color:#f8fafc;padding:15px;position:relative;overflow-x:hidden}
        .glow-1,.glow-2{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;pointer-events:none}
        .glow-1{width:250px;height:250px;background:#0ea5e9;top:10%;left:10%}
        .glow-2{width:250px;height:250px;background:#a855f7;bottom:10%;right:10%}
        .auth-card{width:100%;max-width:400px;background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.7);position:relative;z-index:10}
        .logo{text-align:center;margin-bottom:22px}
        .logo-icon{width:56px;height:56px;margin:0 auto 10px;background:rgba(56,189,248,.15);border:1px solid #38bdf8;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#38bdf8}
        .logo h2{font-size:26px;font-weight:800;letter-spacing:4px;background:linear-gradient(135deg,#38bdf8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .logo p{color:#94a3b8;font-size:12px;margin-top:4px}
        .group{margin-bottom:14px}
        .group label{display:block;margin-bottom:6px;font-size:12px;color:#cbd5e1}
        .req{color:#ef4444;font-weight:700;margin-inline-start:3px}
        .wrap{position:relative;display:flex;align-items:center}
        .wrap i.f-icon{position:absolute;color:#64748b;font-size:14px}
        html[dir="rtl"] .wrap i.f-icon{right:14px}
        html[dir="ltr"] .wrap i.f-icon{left:14px}
        .group input{width:100%;padding:12px 14px;background:rgba(10,15,30,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;font-size:13px;outline:0}
        html[dir="rtl"] .group input{padding-right:40px;padding-left:14px}
        html[dir="ltr"] .group input{padding-left:40px;padding-right:14px}
        .group input:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.2)}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,#0284c7,#9333ea);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .3s ease;margin-top:10px}
        .btn:disabled{background:rgba(255,255,255,.1);color:#64748b;cursor:not-allowed;box-shadow:none}
        .footer{text-align:center;margin-top:16px;font-size:12px;color:#94a3b8}
        .footer a{color:#38bdf8;text-decoration:none;font-weight:700}
        #msg{margin-top:10px;font-size:12px;text-align:center;font-weight:700;padding:8px;border-radius:8px}
        .err{color:#ef4444;background:rgba(239,68,68,.1)}
        .succ{color:#22c55e;background:rgba(34,197,94,.1)}
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="auth-card">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-lock" aria-hidden="true"></i></div>
            <h2>ZENIX</h2>
            <p id="reset-heading">Set a New Password</p>
        </div>
        <form id="form">
            <div class="group">
                <label for="pass1"><i class="fas fa-key" aria-hidden="true"></i> <span id="pass1-label">New Password</span> <span class="req">*</span></label>
                <div class="wrap">
                    <i class="fas fa-lock f-icon" aria-hidden="true"></i>
                    <input type="password" id="pass1" placeholder="At least 6 characters" required>
                </div>
            </div>
            <div class="group">
                <label for="pass2"><i class="fas fa-check-circle" aria-hidden="true"></i> <span id="pass2-label">Confirm New Password</span> <span class="req">*</span></label>
                <div class="wrap">
                    <i class="fas fa-lock f-icon" aria-hidden="true"></i>
                    <input type="password" id="pass2" placeholder="Repeat new password" required>
                </div>
            </div>
            <button type="submit" id="t-btn" class="btn" disabled>Change Password</button>
            <div id="msg" role="status" aria-live="polite"></div>
        </form>
        <div class="footer">
            <p><a href="login.html" id="t-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> Cancel and return to login</a></p>
        </div>
    </div>
    <script>
        (function () {
            'use strict';
            const translations = {
                en: {dir:'ltr',title:'Zenix - New Password',heading:'Set a New Password',p1:'New Password',p1p:'At least 6 characters',p2:'Confirm New Password',p2p:'Repeat new password',submit:'Change Password',back:'Cancel and return to login',short:'Password must be at least 6 characters.',match:'Passwords do not match!',success:'Password changed successfully! Redirecting to login...'},
                fa: {dir:'rtl',title:'Zenix - تغییر رمز عبور',heading:'تعیین رمز عبور جدید',p1:'رمز عبور جدید',p1p:'حداقل ۶ کاراکتر',p2:'تکرار رمز عبور جدید',p2p:'تکرار رمز عبور',submit:'تغییر رمز عبور',back:'انصراف و بازگشت به ورود',short:'رمز عبور باید حداقل ۶ کاراکتر باشد.',match:'رمز عبور و تکرار آن یکسان نیستند!',success:'رمز عبور با موفقیت تغییر کرد! انتقال به ورود...'},
                ar: {dir:'rtl',title:'Zenix - تغيير كلمة المرور',heading:'تعيين كلمة مرور جديدة',p1:'كلمة المرور الجديدة',p1p:'6 أحرف على الأقل',p2:'تأكيد كلمة المرور الجديدة',p2p:'أعد إدخال كلمة المرور',submit:'تغيير كلمة المرور',back:'إلغاء والعودة إلى تسجيل الدخول',short:'يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.',match:'كلمتا المرور غير متطابقتين!',success:'تم تغيير كلمة المرور بنجاح! جارٍ الانتقال إلى تسجيل الدخول...'},
                tr: {dir:'ltr',title:'Zenix - Şifreyi Değiştir',heading:'Yeni Bir Şifre Belirle',p1:'Yeni Şifre',p1p:'En az 6 karakter',p2:'Yeni Şifreyi Onayla',p2p:'Yeni şifreyi tekrar girin',submit:'Şifreyi Değiştir',back:'İptal et ve girişe dön',short:'Şifre en az 6 karakter olmalıdır.',match:'Şifreler eşleşmiyor!',success:'Şifre başarıyla değiştirildi! Giriş sayfasına yönlendiriliyorsunuz...'},
                ru: {dir:'ltr',title:'Zenix - Новый пароль',heading:'Установить новый пароль',p1:'Новый пароль',p1p:'Не менее 6 символов',p2:'Подтвердите новый пароль',p2p:'Повторите новый пароль',submit:'Изменить пароль',back:'Отмена и возврат ко входу',short:'Пароль должен содержать не менее 6 символов.',match:'Пароли не совпадают!',success:'Пароль успешно изменён! Переход ко входу...'},
                es: {dir:'ltr',title:'Zenix - Nueva contraseña',heading:'Establecer una nueva contraseña',p1:'Nueva contraseña',p1p:'Al menos 6 caracteres',p2:'Confirmar nueva contraseña',p2p:'Repita la nueva contraseña',submit:'Cambiar contraseña',back:'Cancelar y volver al inicio de sesión',short:'La contraseña debe tener al menos 6 caracteres.',match:'¡Las contraseñas no coinciden!',success:'¡Contraseña cambiada correctamente! Volviendo al inicio de sesión...'},
                fr: {dir:'ltr',title:'Zenix - Nouveau mot de passe',heading:'Définir un nouveau mot de passe',p1:'Nouveau mot de passe',p1p:'Au moins 6 caractères',p2:'Confirmer le nouveau mot de passe',p2p:'Répétez le nouveau mot de passe',submit:'Changer le mot de passe',back:'Annuler et revenir à la connexion',short:'Le mot de passe doit contenir au moins 6 caractères.',match:'Les mots de passe ne correspondent pas !',success:'Mot de passe modifié avec succès ! Retour à la connexion...'},
                de: {dir:'ltr',title:'Zenix - Neues Passwort',heading:'Neues Passwort festlegen',p1:'Neues Passwort',p1p:'Mindestens 6 Zeichen',p2:'Neues Passwort bestätigen',p2p:'Neues Passwort wiederholen',submit:'Passwort ändern',back:'Abbrechen und zur Anmeldung zurückkehren',short:'Das Passwort muss mindestens 6 Zeichen lang sein.',match:'Die Passwörter stimmen nicht überein!',success:'Passwort erfolgreich geändert! Weiter zur Anmeldung...'}
            };
            const supported = Object.keys(translations);
            let language = 'en';
            try {
                const saved = localStorage.getItem('zenix_lang');
                if (supported.includes(saved)) language = saved;
            } catch (_) {}
            const pass1 = document.getElementById('pass1');
            const pass2 = document.getElementById('pass2');
            const button = document.getElementById('t-btn');
            const message = document.getElementById('msg');
            const form = document.getElementById('form');
            function applyLanguage(selected) {
                const t = translations[selected] || translations.en;
                language = translations[selected] ? selected : 'en';
                document.documentElement.lang = language;
                document.documentElement.dir = t.dir;
                document.title = t.title;
                document.getElementById('reset-heading').textContent = t.heading;
                document.getElementById('pass1-label').textContent = t.p1;
                document.getElementById('pass2-label').textContent = t.p2;
                pass1.placeholder = t.p1p;
                pass2.placeholder = t.p2p;
                button.textContent = t.submit;
                document.getElementById('t-back').innerHTML = '<i class="fas ' + (t.dir === 'rtl' ? 'fa-arrow-right' : 'fa-arrow-left') + '" aria-hidden="true"></i> ' + t.back;
            }
            function checkInputs() {
                button.disabled = !(pass1.value.length > 0 && pass2.value.length > 0);
            }
            pass1.addEventListener('input', checkInputs);
            pass2.addEventListener('input', checkInputs);
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                const t = translations[language] || translations.en;
                if (pass1.value.length < 6) {
                    message.textContent = t.short;
                    message.className = 'err';
                    return;
                }
                if (pass1.value !== pass2.value) {
                    message.textContent = t.match;
                    message.className = 'err';
                    return;
                }
                message.textContent = t.success;
                message.className = 'succ';
                setTimeout(function () { window.location.href = 'login.html'; }, 2000);
            });
            applyLanguage(language);
            checkInputs();
        })();
    </script>
</body>
</html>
