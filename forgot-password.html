<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - بازیابی رمز عبور</title>
    <link rel="icon" href="data:image/x-icon;base64,=">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans','Vazirmatn',sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        
        /* Toast Notifications */
        .toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;width:90%;max-width:420px}
        .toast{padding:14px 18px;border-radius:14px;font-size:13px;font-weight:600;display:flex;align-items:flex-start;gap:12px;box-shadow:0 12px 35px rgba(0,0,0,0.7);backdrop-filter:blur(14px);opacity:0;transform:translateY(-20px);transition:all 0.35s cubic-bezier(0.68,-0.55,0.27,1.55);pointer-events:auto;direction:rtl;line-height:1.5}
        .toast.show{opacity:1;transform:translateY(0)}
        .toast-success{background:rgba(16,185,129,0.22);border:1px solid rgba(16,185,129,0.6);color:#34d399}
        .toast-error{background:rgba(239,68,68,0.22);border:1px solid rgba(239,68,68,0.6);color:#f87171}
        .toast-info{background:rgba(15,23,42,0.92);border:1px solid rgba(56,189,248,0.5);color:#38bdf8;box-shadow:0 0 25px rgba(56,189,248,0.25)}

        /* Header */
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo{display:flex;align-items:center;gap:10px}
        .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#0ea5e9,#9333ea);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;transform:skewX(-6deg);box-shadow:0 0 15px rgba(14,165,233,.4)}
        .logo-text{font-family:'Orbitron',sans-serif;font-size:19px;font-weight:900;letter-spacing:2px;transform:skewX(-6deg);background:linear-gradient(135deg,#38bdf8,#c084fc,#f43f5e);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(56,189,248,0.4)}
        .hr{display:flex;align-items:center;gap:8px}
        .wrap{position:relative}
        .lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;width:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#38bdf8;text-decoration:none}
        .menu{display:none;position:absolute;top:42px;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:8px;width:max-content;min-width:max-content;white-space:nowrap;padding:6px;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.8)}
        [dir="rtl"] .wrap .menu{left:0}
        [dir="ltr"] .wrap .menu{right:0}
        .menu.show{display:block}
        .mi{padding:7px 12px;font-size:12px;color:#cbd5e1;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap;transition:all 0.2s ease}
        .mi:hover,.mi.active{background:rgba(56,189,248,.15);color:#38bdf8!important;font-weight:700}

        /* Main Content */
        .c{max-width:440px;width:100%;margin:40px auto;padding:0 15px;flex:1;display:flex;flex-direction:column;justify-content:center}
        .card{background:rgba(30,41,59,0.8);border:1px solid rgba(56,189,248,0.3);border-radius:12px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
        .card-title{text-align:center;margin-bottom:20px;color:#38bdf8;font-size:18px;font-weight:800}
        .card-title i{margin-left:8px}

        .fg{margin-bottom:15px}
        .fl{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
        .fi{width:100%;padding:12px 14px;background:rgba(15,23,42,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#f8fafc;font-size:13px;outline:none;transition:0.2s;direction:ltr;text-align:left}
        .fi:focus{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,0.2)}
        
        .bs{display:block;width:100%;background:#38bdf8;color:#0f172a;border:none;padding:12px;font-weight:bold;border-radius:8px;cursor:pointer;font-size:14px;text-align:center;transition:0.2s}
        .bs:hover{background:#0ea5e9}
        .bs:disabled{opacity:0.6;cursor:not-allowed;background:#64748b;color:#cbd5e1}
        .bs-purple{background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.4);color:#c084fc;}
        .bs-purple:hover{background:rgba(168,85,247,.25);color:#e0c7ff}

        .hint-box{padding:12px 14px;border-radius:8px;font-size:12px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;line-height:1.6;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8}
        .hint-box i{font-size:16px;margin-top:2px;flex-shrink:0}
        
        .otp-row{display:flex;gap:8px;align-items:flex-start}
        .otp-row .bs{width:auto;flex-shrink:0;padding:12px 14px;font-size:12px;white-space:nowrap}
        
        .footer{text-align:center;margin-top:20px;font-size:12px;color:#94a3b8}
        .footer a{color:#38bdf8;text-decoration:none;font-weight:700}
        .footer a:hover{text-decoration:underline}

        @media (max-width: 480px) {
            .c { margin: 20px auto; }
            .card { padding: 18px; }
            .card-title { font-size: 16px; }
            .otp-row { flex-wrap: wrap; }
            .otp-row .bs { flex: 1 1 100%; width: 100%; }
        }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <header>
        <div class="logo"><div class="logo-icon">Z</div><div class="logo-text">ZENIX</div></div>
        <div class="hr">
            <a href="support.html" class="lb" title="پشتیبانی"><i class="fas fa-headset" style="color:#a855f7"></i></a>
            <div class="wrap">
                <button type="button" class="lb" id="lang-btn"><i class="fas fa-globe" style="color:#22c55e"></i></button>
                <div class="menu" id="lang-menu">
                    <div class="mi" data-lang="fa">فارسی</div>
                    <div class="mi" data-lang="en">English</div>
                    <div class="mi" data-lang="ar">العربية</div>
                    <div class="mi" data-lang="tr">Türkçe</div>
                    <div class="mi" data-lang="ru">Русский</div>
                    <div class="mi" data-lang="es">Español</div>
                    <div class="mi" data-lang="fr">Français</div>
                    <div class="mi" data-lang="de">Deutsch</div>
                </div>
            </div>
        </div>
    </header>

    <div class="c">
        <div class="card">
            <div class="card-title" id="t-title"><i class="fas fa-key"></i> بازیابی رمز عبور</div>
            
            <form id="reset-form">
                <div class="fg">
                    <label class="fl" id="t-email-lbl">ایمیل حساب کاربری</label>
                    <input type="email" class="fi" id="email" placeholder="name@example.com" required>
                </div>

                <div class="hint-box">
                    <i class="fas fa-shield-alt"></i>
                    <div id="t-hint">برای دریافت کد ۶ رقمی، ابتدا ایمیل خود را وارد کرده و روی دکمه زیر کلیک کنید.</div>
                </div>

                <div class="fg">
                    <div class="otp-row">
                        <button type="button" class="bs bs-purple" onclick="window.goToSupport()">
                            <i class="fas fa-headset"></i> <span id="t-btn-support">دریافت کد از پشتیبانی</span>
                        </button>
                    </div>
                </div>

                <div class="fg">
                    <label class="fl" id="t-otp-lbl">کد ۶ رقمی پشتیبانی</label>
                    <input type="text" class="fi" id="otp" maxlength="6" placeholder="------" inputmode="numeric" style="text-align:center;letter-spacing:5px;font-weight:bold;font-size:16px;" required>
                </div>

                <div class="fg">
                    <label class="fl" id="t-pass1-lbl">رمز عبور جدید</label>
                    <input type="password" class="fi" id="pass1" placeholder="حداقل ۸ کاراکتر" required>
                </div>

                <div class="fg">
                    <label class="fl" id="t-pass2-lbl">تکرار رمز عبور جدید</label>
                    <input type="password" class="fi" id="pass2" placeholder="تکرار رمز عبور" required>
                </div>

                <button type="submit" id="btn-submit" class="bs" disabled>
                    <i class="fas fa-check"></i> <span id="t-btn-submit">تغییر رمز عبور</span>
                </button>
            </form>

            <div class="footer">
                <p id="t-footer">رمزت رو یادت اومده؟ <a href="index.html" id="t-login-link">ورود به حساب</a></p>
            </div>
        </div>
    </div>

    <script>
        window.showToast = function(message, type = 'success', duration = 5000) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            let iconClass = 'fa-check-circle';
            if (type === 'error') iconClass = 'fa-exclamation-circle';
            if (type === 'info') iconClass = 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${iconClass}"></i><div style="flex:1;">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('show'); }, 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => { toast.remove(); }, 350); }, duration);
        };
    </script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdmirror.com/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = "https://ujyenmqdgivuxvxptwyl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO";
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabaseClient;

        // --- Language System ---
        const SUPPORTED_LANGUAGES = ['fa', 'en', 'ar', 'tr', 'ru', 'es', 'fr', 'de'];
        const savedLang = localStorage.getItem('zenix_lang');
        let currLang = SUPPORTED_LANGUAGES.includes(savedLang) ? savedLang : 'fa';

        const langData = {
            fa: { title: 'بازیابی رمز عبور', email: 'ایمیل حساب کاربری', hint: 'برای دریافت کد ۶ رقمی، ابتدا ایمیل خود را وارد کرده و روی دکمه زیر کلیک کنید.', btnSup: 'دریافت کد از پشتیبانی', otp: 'کد ۶ رقمی پشتیبانی', pass1: 'رمز عبور جدید', pass2: 'تکرار رمز عبور جدید', btnSub: 'تغییر رمز عبور', foot: 'رمزت رو یادت اومده؟', login: 'ورود به حساب' },
            en: { title: 'Reset Password', email: 'Account Email', hint: 'To receive a 6-digit code, enter your email and click the button below.', btnSup: 'Get Code from Support', otp: '6-Digit Support Code', pass1: 'New Password', pass2: 'Confirm New Password', btnSub: 'Change Password', foot: 'Remember your password?', login: 'Login' },
            ar: { title: 'استعادة كلمة المرور', email: 'البريد الإلكتروني', hint: 'للحصول على رمز مكون من 6 أرقام، أدخل بريدك الإلكتروني وانقر على الزر أدناه.', btnSup: 'الحصول على رمز من الدعم', otp: 'رمز الدعم 6 أرقام', pass1: 'كلمة المرور الجديدة', pass2: 'تأكيد كلمة المرور', btnSub: 'تغيير كلمة المرور', foot: 'هل تذكرت كلمة المرور؟', login: 'تسجيل الدخول' },
            tr: { title: 'Şifre Sıfırlama', email: 'Hesap E-postası', hint: '6 haneli kod almak için e-postanızı girin ve aşağıdaki butona tıklayın.', btnSup: 'Destekten Kod Al', otp: '6 Haneli Destek Kodu', pass1: 'Yeni Şifre', pass2: 'Yeni Şifre Tekrarı', btnSub: 'Şifreyi Değiştir', foot: 'Şifrenizi hatırladınız mı?', login: 'Giriş Yap' },
            ru: { title: 'Сброс пароля', email: 'Email аккаунта', hint: 'Чтобы получить 6-значный код, введите свой email и нажмите кнопку ниже.', btnSup: 'Получить код в поддержке', otp: '6-значный код поддержки', pass1: 'Новый пароль', pass2: 'Подтвердите пароль', btnSub: 'Изменить пароль', foot: 'Вспомнили пароль?', login: 'Войти' },
            es: { title: 'Restablecer Contraseña', email: 'Correo de la cuenta', hint: 'Para recibir un código de 6 dígitos, ingrese su correo y haga clic en el botón de abajo.', btnSup: 'Obtener Código de Soporte', otp: 'Código de Soporte de 6 dígitos', pass1: 'Nueva Contraseña', pass2: 'Confirmar Contraseña', btnSub: 'Cambiar Contraseña', foot: '¿Recordaste tu contraseña?', login: 'Iniciar sesión' },
            fr: { title: 'Réinitialiser le mot de passe', email: 'Email du compte', hint: 'Pour recevoir un code à 6 chiffres, entrez votre email et cliquez sur le bouton ci-dessous.', btnSup: 'Obtenir le code du support', otp: 'Code de support à 6 chiffres', pass1: 'Nouveau mot de passe', pass2: 'Confirmer le mot de passe', btnSub: 'Changer le mot de passe', foot: 'Mot de passe retrouvé ?', login: 'Connexion' },
            de: { title: 'Passwort zurücksetzen', email: 'Konto-E-Mail', hint: 'Um einen 6-stelligen Code zu erhalten, geben Sie Ihre E-Mail ein und klicken Sie unten.', btnSup: 'Code vom Support erhalten', otp: '6-stelliger Support-Code', pass1: 'Neues Passwort', pass2: 'Passwort bestätigen', btnSub: 'Passwort ändern', foot: 'Passwort vergessen?', login: 'Anmelden' }
        };

        function setLang(l) {
            if (!SUPPORTED_LANGUAGES.includes(l)) l = 'fa';
            currLang = l;
            localStorage.setItem('zenix_lang', l);
            document.documentElement.setAttribute('lang', l);
            document.documentElement.setAttribute('dir', (l === 'fa' || l === 'ar') ? 'rtl' : 'ltr');

            const t = langData[l] || langData.fa;
            document.getElementById('t-title').innerHTML = `<i class="fas fa-key"></i> ${t.title}`;
            document.getElementById('t-email-lbl').textContent = t.email;
            document.getElementById('t-hint').textContent = t.hint;
            document.getElementById('t-btn-support').textContent = t.btnSup;
            document.getElementById('t-otp-lbl').textContent = t.otp;
            document.getElementById('t-pass1-lbl').textContent = t.pass1;
            document.getElementById('t-pass2-lbl').textContent = t.pass2;
            document.getElementById('t-btn-submit').textContent = t.btnSub;
            document.getElementById('t-footer').innerHTML = `${t.foot} <a href="index.html">${t.login}</a>`;

            document.querySelectorAll('#lang-menu .mi').forEach(item => {
                item.classList.toggle('active', item.dataset.lang === l);
            });
        }

        document.getElementById('lang-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('lang-menu').classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.wrap')) {
                document.getElementById('lang-menu').classList.remove('show');
            }
        });

        document.querySelectorAll('#lang-menu .mi').forEach(item => {
            item.addEventListener('click', () => {
                setLang(item.dataset.lang);
                document.getElementById('lang-menu').classList.remove('show');
            });
        });

        // --- Form Logic ---
        const emailIn = document.getElementById('email');
        const otpIn = document.getElementById('otp');
        const pass1 = document.getElementById('pass1');
        const pass2 = document.getElementById('pass2');
        const btnSubmit = document.getElementById('btn-submit');
        const form = document.getElementById('reset-form');

        function checkInputs() {
            const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailIn.value.trim());
            const isOtpValid = otpIn.value.trim().length === 6;
            const isPassValid = pass1.value.length >= 8;
            const isMatch = pass1.value === pass2.value;

            btnSubmit.disabled = !(isEmailValid && isOtpValid && isPassValid && isMatch);
        }

        [emailIn, otpIn, pass1, pass2].forEach(input => {
            input.addEventListener('input', checkInputs);
        });

        // بازیابی ایمیل از sessionStorage
        const savedEmail = sessionStorage.getItem('zenix_reset_email');
        if (savedEmail) {
            emailIn.value = savedEmail;
            checkInputs();
        }

        // ★ دریافت کد از پشتیبانی
        window.goToSupport = async function() {
            const email = emailIn.value.trim();
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                window.showToast('لطفاً ابتدا یک ایمیل معتبر وارد کنید.', 'error');
                return;
            }

            const btn = document.querySelector('.bs-purple');
            const origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال بررسی...';

            try {
                // تابع دیتابیس خودش چک می‌کند کاربر وجود دارد یا نه
                const { data, error } = await supabaseClient.rpc('generate_password_reset_otp', { user_email: email });

                if (error) {
                    // خطای «کاربر یافت نشد» از دیتابیس
                    if (error.message && error.message.includes('یافت نشد')) {
                        window.showToast(
                            'این ایمیل در سیستم ثبت‌نام نشده است. لطفاً ابتدا ثبت‌نام کنید یا ایمیل صحیح را وارد کنید.',
                            'error',
                            6000
                        );
                    } else {
                        window.showToast('خطا: ' + (error.message || 'خطا در دریافت کد'), 'error');
                    }
                    btn.disabled = false;
                    btn.innerHTML = origHtml;
                    return;
                }

                // ✅ کاربر تأیید شد → رفتن به صفحه پشتیبانی
                sessionStorage.setItem('zenix_reset_email', email);
                sessionStorage.setItem('zenix_support_email', email);
                sessionStorage.setItem('zenix_return_page', 'forgot-password.html');
                sessionStorage.setItem('zenix_return_focus', 'otp');
                // ⛔ دیگر کد OTP در sessionStorage ذخیره نمی‌شود (امنیت)

                window.location.href = 'support.html?otp=1';

            } catch (e) {
                window.showToast('خطا: ' + (e.message || 'خطا در دریافت کد'), 'error');
                btn.disabled = false;
                btn.innerHTML = origHtml;
            }
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailIn.value.trim().toLowerCase();
            const otp = otpIn.value.trim();
            const newPass = pass1.value;

            if (newPass.length < 8) {
                window.showToast('رمز عبور باید حداقل ۸ کاراکتر باشد.', 'error');
                return;
            }
            if (newPass !== pass2.value) {
                window.showToast('رمز عبور و تکرار آن یکسان نیستند.', 'error');
                return;
            }

            const origHtml = btnSubmit.innerHTML;
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال بررسی...';

            try {
                const { data, error } = await supabaseClient.rpc('reset_password_with_otp', {
                    user_email: email,
                    input_otp: otp,
                    new_password: newPass
                });

                if (error) throw error;

                window.showToast('✅ رمز عبور شما با موفقیت تغییر کرد! در حال انتقال به صفحه ورود...', 'success', 3000);
                sessionStorage.removeItem('zenix_reset_email');
                sessionStorage.removeItem('zenix_support_email');
                sessionStorage.removeItem('zenix_return_page');
                sessionStorage.removeItem('zenix_return_focus');
                setTimeout(() => { window.location.href = 'index.html'; }, 2500);

            } catch (error) {
                console.error(error);
                let errorMsg = error.message || 'خطا در تغییر رمز عبور. لطفاً دوباره تلاش کنید.';
                if (errorMsg.includes('کد وارد شده نامعتبر است')) errorMsg = 'کد وارد شده نامعتبر است.';
                if (errorMsg.includes('کد وارد شده منقضی شده است')) errorMsg = 'کد وارد شده منقضی شده است.';
                if (errorMsg.includes('کاربری با این ایمیل یافت نشد')) errorMsg = 'کاربری با این ایمیل یافت نشد.';
                
                window.showToast(errorMsg, 'error', 5000);
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = origHtml;
            }
        });

        setLang(currLang);
        checkInputs();
    </script>
</body>
</html>
