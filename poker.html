<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - پوکر زنده با دیلر انسان (Live Dealer Poker)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans','Vazirmatn',sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo{display:flex;align-items:center;gap:10px}
        .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#0ea5e9,#9333ea);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;font-style:italic;transform:skewX(-6deg)}
        .logo-text{font-family:'Orbitron',sans-serif;font-size:19px;font-weight:900;letter-spacing:2px;font-style:italic;transform:skewX(-6deg);background:linear-gradient(135deg,#38bdf8,#c084fc,#f43f5e);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        
        .c{max-width:1150px;width:100%;margin:15px auto;padding:0 12px;flex:1}
        
        /* کانتینر اصلی استریم زنده دیلر */
        .live-casino-container{position:relative;width:100%;height:520px;background:#000;border-radius:20px;overflow:hidden;border:2px solid rgba(255,255,255,0.15);box-shadow:0 20px 50px rgba(0,0,0,0.8);margin-bottom:15px}
        
        /* ویدیو زنده دیلر انسان */
        .dealer-video{width:100%;height:100%;object-fit:cover;filter:brightness(0.9)}
        
        /* نشانگر زنده بودن (LIVE Badge) */
        .live-badge{position:absolute;top:15px;right:15px;background:rgba(239,68,68,0.9);color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:bold;display:flex;align-items:center;gap:6px;box-shadow:0 0 10px rgba(239,68,68,0.6)}
        .live-dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:blink 1s infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

        /* لایه گرافیکی روی تصویر زنده (Overlay) */
        .casino-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:15px;pointer-events:none}
        .casino-overlay * {pointer-events:auto}

        /* پات زنده روی تصویر */
        .live-pot{align-self:center;background:rgba(15,23,42,0.85);border:1px solid rgba(250,204,21,0.5);backdrop-filter:blur(8px);border-radius:30px;padding:6px 20px;text-align:center;box-shadow:0 0 20px rgba(0,0,0,0.6)}
        .live-pot-title{font-size:10px;color:#facc15;text-transform:uppercase}
        .live-pot-val{font-size:20px;font-weight:900;color:#fff;font-family:'Orbitron',sans-serif}

        /* کارت‌های مشترک اسکن شده توسط دیلر */
        .scanned-cards-bar{align-self:center;display:flex;gap:8px;background:rgba(0,0,0,0.6);padding:8px 16px;border-radius:12px;backdrop-filter:blur(5px)}
        .card{width:42px;height:60px;background:#fff;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:3px;font-weight:bold;font-size:12px;box-shadow:0 4px 8px rgba(0,0,0,0.5)}
        .card.red{color:#ef4444}
        .card.black{color:#0f172a}
        .card.scanned-placeholder{background:rgba(255,255,255,0.1);border:1px dashed rgba(255,255,255,0.3);color:#94a3b8;justify-content:center;align-items:center;font-size:16px}

        /* پنل اکشن در پایین استریم */
        .action-panel{background:rgba(15,23,42,.95);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
        .action-grid{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:10px;align-items:center}
        .btn-action{padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;color:#fff;transition:0.2s}
        .btn-fold{background:#ef4444}
        .btn-call{background:#0ea5e9}
        .btn-raise{background:#22c55e}

        .raise-slider-group{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.05);padding:8px;border-radius:10px}
        .raise-slider-group input[type=range]{flex:1;accent-color:#22c55e}
    </style>
</head>
<body>
    <header>
        <div class="logo"><div class="logo-icon">Z</div><div class="logo-text">ZENIX LIVE</div></div>
        <div style="font-size:12px;color:#22c55e;font-weight:bold;">
            موجودی شما: <span id="user-balance">$0.00</span>
        </div>
    </header>

    <div class="c">
        <!-- کانتینر لایو استریم دیلر -->
        <div class="live-casino-container">
            <!-- استریم زنده (می‌تواند از طریق WebRTC یا HLS بارگذاری شود) -->
            <video class="dealer-video" id="live-dealer-stream" autoplay muted playsinline poster="https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=1200&q=80">
                <!-- آدرس استریم زنده استودیو -->
                <source src="" type="application/x-mpegURL">
            </video>

            <div class="live-badge">
                <div class="live-dot"></div>
                <span>پخش زنده - میز شماره ۱</span>
            </div>

            <!-- لایه تعاملی روی ویدیو -->
            <div class="casino-overlay">
                <!-- پات -->
                <div class="live-pot">
                    <div class="live-pot-title">مجموع پات زنده</div>
                    <div class="live-pot-val" id="total-pot">$150.00</div>
                </div>

                <!-- کارت‌های رو شده توسط دیلر انسان روی میز -->
                <div class="scanned-cards-bar" id="community-cards">
                    <div class="card red"><span>A</span><span style="text-align:center">♥</span></div>
                    <div class="card black"><span>K</span><span style="text-align:center">♠</span></div>
                    <div class="card red"><span>10</span><span style="text-align:center">♦</span></div>
                    <div class="card scanned-placeholder"><i class="fas fa-lock"></i></div>
                    <div class="card scanned-placeholder"><i class="fas fa-lock"></i></div>
                </div>
            </div>
        </div>

        <!-- پنل شرط‌بندی زنده -->
        <div class="action-panel">
            <div class="action-grid">
                <button class="btn-action btn-fold" onclick="sendAction('fold')">انصراف (Fold)</button>
                <button class="btn-action btn-call" onclick="sendAction('call')">کال ($20)</button>
                
                <div class="raise-slider-group">
                    <input type="range" id="raise-range" min="20" max="500" value="40" oninput="document.getElementById('rv').textContent='$'+this.value">
                    <span id="rv" style="font-family:'Orbitron';color:#22c55e;font-weight:bold">$40</span>
                    <button class="btn-action btn-raise" onclick="sendAction('raise')">افزایش (Raise)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // کدهای مربوط به اتصال استریم زنده و ثبت شرط در دیتابیس Supabase
    </script>
</body>
</html>
