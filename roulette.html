<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Zenix - Roulette Game</title>
    <link rel="icon" href="data:image/x-icon;base64,=">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans','Vazirmatn',sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo{display:flex;align-items:center;gap:10px}
        .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#0ea5e9,#9333ea);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;font-style:italic;transform:skewX(-6deg);box-shadow:0 0 15px rgba(14,165,233,.4)}
        .logo-text{font-family:'Orbitron',sans-serif;font-size:19px;font-weight:900;letter-spacing:2px;font-style:italic;transform:skewX(-6deg);background:linear-gradient(135deg,#38bdf8,#c084fc,#f43f5e);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(56,189,248,0.4)}
        .hr{display:flex;align-items:center;gap:8px}
        .wrap{position:relative}
        .lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;width:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#38bdf8;text-decoration:none}
        .menu{display:none;position:absolute;top:42px;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:8px;min-width:max-content;padding:6px;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.8)}
        [dir="rtl"] .wrap .menu{left:0}[dir="ltr"] .wrap .menu{right:0}
        .menu.show{display:block}
        .mi{padding:7px 10px;font-size:12px;color:#cbd5e1;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
        .mi:hover,.mi.active{background:rgba(56,189,248,.15);color:#38bdf8!important;font-weight:700}
        .c{max-width:900px;width:100%;margin:15px auto;padding:0 12px;flex:1}
        .wel{background:linear-gradient(135deg,rgba(236,72,153,.15),rgba(147,51,234,.15));border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
        .wel h1{font-size:16px;margin-bottom:3px;color:#ec4899}
        .wel p{color:#94a3b8;font-size:11px}
        .game-card{background:rgba(15,23,42,.85);border:1px solid rgba(56,189,248,.3);border-radius:16px;padding:20px;margin-bottom:15px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
        .wheel-container{position:relative;width:220px;height:220px;margin:0 auto 15px;border-radius:50%;border:6px solid #38bdf8;box-shadow:0 0 25px rgba(56,189,248,.5);display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1e293b,#0f172a);transition:transform 4s cubic-bezier(0.15, 0.9, 0.2, 1)}
        .wheel-center{width:60px;height:60px;background:linear-gradient(135deg,#f43f5e,#9333ea);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;color:#fff;box-shadow:0 0 15px rgba(244,63,94,0.6);z-index:2}
        .pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid #fbbf24;z-index:3}
        .bet-section{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
        .bet-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:12px;color:#fff;cursor:pointer;font-weight:700;font-size:13px;transition:0.2s}
        .bet-btn:hover{border-color:#38bdf8;background:rgba(56,189,248,.1)}
        .bet-btn.selected{border-color:#fbbf24;background:rgba(251,191,36,.2);color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.3)}
        .input-group{margin-bottom:12px;text-align:right}
        .input-group label{font-size:12px;color:#94a3b8;display:block;margin-bottom:5px}
        .input-group input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px;color:#fff;font-size:14px;outline:none}
        .spin-btn{width:100%;background:linear-gradient(135deg,#0ea5e9,#9333ea);border:none;border-radius:12px;padding:12px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 5px 20px rgba(14,165,233,.4);transition:0.2s}
        .spin-btn:hover{opacity:.9;transform:translateY(-1px)}
        .result-box{margin-top:12px;font-size:14px;font-weight:bold;min-height:24px}
        footer{text-align:center;padding:10px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto;width:100%;padding-left:12px;padding-right:12px}
    </style>
</head>
<body>
    <header>
        <div class="logo"><div class="logo-icon">Z</div><div class="logo-text">ZENIX</div></div>
        <div class="hr">
            <a href="dashboard.html" class="lb"><i class="fas fa-home" style="color:#38bdf8"></i></a>
            <div class="wrap">
                <button type="button" class="lb" id="menu-btn"><i class="fas fa-bars" style="color:#f43f5e"></i></button>
                <div class="menu" id="nav-menu">
                    <a href="dashboard.html" class="mi"><i class="fas fa-home" style="color:#38bdf8"></i><span>صفحه اصلی</span></a>
                    <a href="quantification.html" class="mi"><i class="fas fa-robot" style="color:#a855f7"></i><span>کوانتیفیکیشن</span></a>
                    <a href="roulette.html" class="mi active"><i class="fas fa-dice" style="color:#ec4899"></i><span>بازی رولت</span></a>
                    <a href="deposit.html" class="mi"><i class="fas fa-arrow-down" style="color:#22c55e"></i><span>واریز</span></a>
                    <a href="receive.html" class="mi"><i class="fas fa-arrow-up" style="color:#fbbf24"></i><span>برداشت</span></a>
                    <a href="transactions.html" class="mi"><i class="fas fa-history" style="color:#06b6d4"></i><span>تراکنش</span></a>
                    <a href="profile.html" class="mi"><i class="fas fa-user-cog" style="color:#ec4899"></i><span>پروفایل</span></a>
                    <a href="index.html" class="mi" style="color:#ef4444"><i class="fas fa-power-off"></i><span>خروج</span></a>
                </div>
            </div>
        </div>
    </header>

    <div class="c">
        <div class="wel">
            <div>
                <h1>بازی رولت هوشمند (Zenix Roulette)</h1>
                <p>شانس خود را امتحان کنید و موجودی حساب خود را افزایش دهید</p>
            </div>
            <div style="font-size:12px;background:rgba(236,72,153,.15);border:1px solid #ec4899;padding:6px 12px;border-radius:8px;color:#ec4899;font-weight:bold;">
                موجودی: <span id="user-balance">$0.00</span>
            </div>
        </div>

        <div class="game-card">
            <div class="pointer"></div>
            <div class="wheel-container" id="roulette-wheel">
                <div class="wheel-center" id="wheel-text">Z</div>
            </div>

            <div class="input-group">
                <label>مبلغ شرط (دلار)</label>
                <input type="number" id="bet-amount" min="1" value="10" placeholder="10">
            </div>

            <label style="font-size:12px;color:#94a3b8;display:block;margin-bottom:8px;text-align:right">انتخاب نوع شرط</label>
            <div class="bet-section">
                <button type="button" class="bet-btn" onclick="selectBet('red', this)" style="border-color:#ef4444;color:#ef4444">قرمز (ضریب ۲x)</button>
                <button type="button" class="bet-btn" onclick="selectBet('black', this)" style="border-color:#64748b;color:#cbd5e1">مشکی (ضریب ۲x)</button>
                <button type="button" class="bet-btn" onclick="selectBet('green', this)" style="border-color:#22c55e;color:#22c55e">سبز - صفر (ضریب ۱۴x)</button>
            </div>

            <button type="button" class="spin-btn" id="spin-btn" onclick="spinWheel()">چرخش چرخ رولت</button>
            <div class="result-box" id="game-result"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Zenix. All rights reserved.</p>
        <p style="color:#22c55e;"><i class="fas fa-circle" style="font-size:6px;"></i> سرور فعال (US-East)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ujyenmqdgivuxvxptwyl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserId = null;
        let userBalance = 0;
        let selectedBetType = null;
        let isSpinning = false;

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session || !session.user) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            await fetchUserData();

            const menuBtn = document.getElementById('menu-btn');
            const navMenu = document.getElementById('nav-menu');
            if (menuBtn && navMenu) {
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navMenu.classList.toggle('show');
                });
                document.addEventListener('click', () => navMenu.classList.remove('show'));
            }
        });

        async function fetchUserData() {
            const { data, error } = await supabase
                .from('users')
                .select('balance')
                .eq('id', currentUserId)
                .maybeSingle();

            if (data && data.balance !== undefined) {
                userBalance = Number(data.balance);
                document.getElementById('user-balance').textContent = `$${userBalance.toFixed(2)}`;
            }
        }

        window.selectBet = function(type, btn) {
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedBetType = type;
        };

        window.spinWheel = async function() {
            if (isSpinning) return;
            if (!selectedBetType) {
                alert('لطفاً نوع شرط (قرمز، مشکی یا سبز) را انتخاب کنید.');
                return;
            }

            const betInput = document.getElementById('bet-amount');
            const betAmount = parseFloat(betInput.value);

            if (isNaN(betAmount) || betAmount <= 0) {
                alert('لطفاً مبلغ معتبری برای شرط‌بندی وارد کنید.');
                return;
            }

            if (betAmount > userBalance) {
                alert('موجودی حساب شما برای این شرط کافی نیست.');
                return;
            }

            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;

            // کسر مبلغ شرط از موجودی کاربر در Supabase
            const newBalance = userBalance - betAmount;
            await supabase.from('users').update({ balance: newBalance }).eq('id', currentUserId);
            
            // ثبت تراکنش در جدول تراکنش‌ها
            await supabase.from('transactions').insert([{
                user_id: currentUserId,
                type: 'roulette_bet',
                amount: -betAmount,
                status: 'completed',
                created_at: new Date().toISOString()
            }]);

            userBalance = newBalance;
            document.getElementById('user-balance').textContent = `$${userBalance.toFixed(2)}`;

            const wheel = document.getElementById('roulette-wheel');
            const resultBox = document.getElementById('game-result');
            resultBox.textContent = 'در حال چرخش...';
            resultBox.style.color = '#38bdf8';

            const randomDeg = 1440 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            setTimeout(async () => {
                // تعیین نتیجه رولت (قرمز: 48%, مشکی: 48%, سبز: 4%)
                const rand = Math.random();
                let outcome = 'black';
                if (rand < 0.04) outcome = 'green';
                else if (rand < 0.52) outcome = 'red';

                const wheelText = document.getElementById('wheel-text');
                wheelText.textContent = outcome === 'red' ? 'R' : outcome === 'black' ? 'B' : '0';
                wheelText.style.background = outcome === 'red' ? '#ef4444' : outcome === 'black' ? '#1e293b' : '#22c55e';

                let winAmount = 0;
                if (selectedBetType === outcome) {
                    if (outcome === 'green') winAmount = betAmount * 14;
                    else winAmount = betAmount * 2;
                }

                if (winAmount > 0) {
                    userBalance += winAmount;
                    await supabase.from('users').update({ balance: userBalance }).eq('id', currentUserId);
                    await supabase.from('transactions').insert([{
                        user_id: currentUserId,
                        type: 'roulette_win',
                        amount: winAmount,
                        status: 'completed',
                        created_at: new Date().toISOString()
                    }]);
                    resultBox.innerHTML = `تبریک! شما برنده شدید: <span style="color:#22c55e">+$${winAmount.toFixed(2)}</span>`;
                    resultBox.style.color = '#22c55e';
                } else {
                    resultBox.innerHTML = `متاسفانه باختید! <span style="color:#ef4444">-$${betAmount.toFixed(2)}</span>`;
                    resultBox.style.color = '#ef4444';
                }

                document.getElementById('user-balance').textContent = `$${userBalance.toFixed(2)}`;
                document.getElementById('spin-btn').disabled = false;
                isSpinning = false;
            }, 4000);
        };
    </script>
</body>
</html>
