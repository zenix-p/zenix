<!-- مودال صندوق پیام‌ها و اعلان‌ها (هماهنگ شده با کوانتیفیکیشن) -->
    <div class="modal" id="m-msg">
        <div class="modal-content">
            <div class="modal-header">
                <span id="t-modal-title"><i class="fas fa-bell"></i> صندوق پیام‌ها و اعلان‌ها</span>
                <button class="modal-close" onclick="window.closeMessageModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="notif-tabs" id="notif-tabs">
                <button type="button" class="notif-tab active" onclick="window.setNotifFilter('all', this)"><i class="fas fa-list"></i> <span id="t-tab-all">همه</span></button>
                <button type="button" class="notif-tab" onclick="window.setNotifFilter('approved', this)"><i class="fas fa-check-circle" style="color:#22c55e"></i> <span id="t-tab-approved">تایید درخواست</span></button>
                <button type="button" class="notif-tab" onclick="window.setNotifFilter('rejected', this)"><i class="fas fa-times-circle" style="color:#ef4444"></i> <span id="t-tab-rejected">لغو درخواست</span></button>
                <button type="button" class="notif-tab" onclick="window.setNotifFilter('admin_message', this)"><i class="fas fa-bullhorn" style="color:#38bdf8"></i> <span id="t-tab-admin">پیام مدیریت</span></button>
            </div>
            <div id="modal-msg-container"><div style="text-align:center;padding:20px;color:#94a3b8">هیچ پیام جدیدی وجود ندارد.</div></div>
        </div>
    </div>
