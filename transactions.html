        let currLang = localStorage.getItem('zenix_lang') || 'fa';

        const ld = {

            tNode: 'سرور فعال (US-East)', modalTitle: 'صندوق پیام‌های مدیریت', noMsg: 'هیچ پیام جدیدی از طرف مدیریت وجود ندارد.',
            backMsg: 'بازگشت به لیست پیام‌ها', newBadge: 'جدید',

            helpTitle: 'راهنمای صفحه تراکنش‌ها', helpBtnTitle: 'راهنمای صفحه تراکنش‌ها',
            hpT1: 'کاربرد این صفحه چیست؟', hpD1: 'در این صفحه می‌توانید تاریخچه تراکنش‌های حساب خود شامل واریزها، برداشت‌ها و کمیسیون‌های دریافتی را مشاهده و پیگیری کنید.',
            hpT2: 'فیلتر تراکنش‌ها', hpD2: 'با استفاده از دکمه‌های فیلتر (همه، واریز، برداشت، کمیسیون، تراکنش ناموفق) می‌توانید تراکنش‌های مورد نظر خود را به تفکیک دسته‌بندی و بررسی نمایید.',
            hpT3: 'کارت کل موجودی', hpD3: 'در بالای صفحه، مجموع کل موجودی کیف پول دلاری شما به صورت زنده نمایش داده می‌شود.',
            hpT4: 'نمایش تراکنش‌ها', hpD4: 'تراکنش‌های تاییدشده در بخش‌های مربوطه و تراکنش‌های ردشده توسط مدیریت در بخش «تراکنش ناموفق» قابل مشاهده هستند.'
          },
          en: {
            txTitle: 'Transactions History', txSub: 'View and review all financial transactions and rewards',
            totBal: 'Total Balance:', listTitle: 'Transaction List',
            fAll: 'All', fDep: 'Deposit', fWith: 'Withdraw', fComm: 'Commission', fFailed: 'Failed Transactions',
            m1: 'Home', m2: 'Quantification', m3: 'Deposit', m4: 'Withdraw', mTeam: 'My Team', m5: 'Transactions', m6: 'Profile', m7: 'Support', m8: 'Logout',
            tNode: 'Node Active (US-East)', modalTitle: 'Admin Messages', noMsg: 'No new messages from admin.',
            backMsg: 'Back to Messages List', newBadge: 'NEW',
            typeDeposit: 'Tether Deposit (USDT)', typeWithdraw: 'Withdrawal', typeCommission: 'Commission',
            stSuccess: 'Approved', stFailed: 'Rejected',
            noTx: 'No transactions found.', loading: 'Loading transactions...',
            helpTitle: 'Transactions Guide', helpBtnTitle: 'Transactions Page Guide',
            hpT1: 'What is the purpose of this page?', hpD1: 'On this page you can view and track a complete history of all financial transactions including deposits, withdrawals, and commissions.',
            hpT2: 'Filter Transactions', hpD2: 'Use the filter buttons (All, Deposit, Withdraw, Commission, Failed) to easily categorize and inspect transactions.',
            hpT3: 'Total Balance Card', hpD3: 'At the top of the page, your total live USD wallet balance is displayed in real time.',

        // دریافت تراکنش‌های کاربر از دیتابیس Supabase
        async function fetchUserTransactions(uid) {
          try {
            const { data, error } = await supabase.from('transactions').select('*').eq('user_id', uid);
            if (error || !data) return [];

            let list = [...data];
            list.sort((a, b) => new Date(b.created_at || b.createdAt || 0) - new Date(a.created_at || a.createdAt || 0));
            return list;
          } catch (e) {
            console.error("خطا در دریافت تراکنش‌ها:", e);
            return [];
          }
        }

        // رندر تراکنش‌ها روی صفحه
        function renderTransactions() {
          let container = document.getElementById('tx-list');
          let t = ld[currLang] || ld.fa;
          if (!container) return;

          let filtered = userTransactions.filter(item => {
            let rawSt = String(item.status || '').toLowerCase().trim();
            let isApproved = rawSt === 'success' || rawSt === 'approved' || rawSt === 'completed' || rawSt === 'done' || rawSt === 'موفق' || rawSt === 'تایید شده';
            let isFailed = rawSt.includes('fail') || rawSt.includes('reject') || rawSt.includes('cancel') || rawSt === 'ناموفق' || rawSt === 'رد شده';

            if (currentFilter === 'failed') {
              return isFailed;
            }

            if (!isApproved) return false;
            if (currentFilter === 'all') return true;

            let itemType = String(item.type || '').toLowerCase();
            if (currentFilter === 'commission') {
              return itemType.includes('comm') || itemType.includes('ref') || itemType === 'commission';
            }
            return itemType === currentFilter;
          });

          if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center;padding:35px 15px;color:#94a3b8;font-size:13px;"><i class="fas fa-receipt" style="font-size:24px;color:#64748b;margin-bottom:10px;display:block;"></i>${t.noTx}</div>`;
            return;
          }

          let html = '';
          filtered.forEach(tx => {
            let rawType = String(tx.type || 'deposit').toLowerCase();
            let isDeposit = rawType.includes('dep') || rawType === 'deposit';
            let isWithdraw = rawType.includes('with') || rawType === 'withdraw' || rawType === 'receive';
            let isComm = rawType.includes('comm') || rawType === 'commission' || rawType.includes('ref');

            let typeClass = isWithdraw ? 'withdraw' : (isComm ? 'commission' : 'deposit');
            let iconClass = isWithdraw ? 'fa-arrow-up' : (isComm ? 'fa-users' : 'fa-arrow-down');

            let titleText = tx.title || tx.description;
            if (!titleText) {
              if (isWithdraw) titleText = t.typeWithdraw;
              else if (isComm) titleText = t.typeCommission;
              else titleText = t.typeDeposit;
            }

            let timeVal = tx.created_at || tx.createdAt || tx.timestamp || tx.time;
            let dateStr = '';
            if (timeVal) {
              let d = new Date(timeVal);
              dateStr = isNaN(d.getTime()) ? String(timeVal) : d.toLocaleString(currLang === 'fa' ? 'fa-IR' : 'en-US');
            } else {
              dateStr = '---';
            }

            let numAmt = parseFloat(tx.amount || 0);
            let sign = isWithdraw ? '-' : '+';
            let amtClass = isWithdraw ? 'negative' : 'positive';
            let formattedAmt = `${sign}${Math.abs(numAmt).toFixed(2)} ${tx.currency || 'USDT'}`;

            let rawSt = String(tx.status || '').toLowerCase().trim();
            let isFailed = rawSt.includes('fail') || rawSt.includes('reject') || rawSt.includes('cancel') || rawSt === 'ناموفق' || rawSt === 'رد شده';
            let stText = isFailed ? t.stFailed : t.stSuccess;
            let stClass = isFailed ? 'status-failed' : 'status-success';

            html += `
            <div class="tx-item" data-type="${typeClass}">
                <div class="tx-left">
                    <div class="tx-icon ${typeClass}"><i class="fas ${iconClass}"></i></div>
                    <div>
                        <div class="tx-title">${titleText}</div>
                        <div class="tx-date" dir="ltr" style="text-align:right;">${dateStr}</div>
                    </div>
                </div>
                <div class="tx-right">
                    <div class="tx-amount ${amtClass}">${formattedAmt}</div>
                    <div class="tx-status ${stClass}">${stText}</div>
                </div>
            </div>`;
          });

          container.innerHTML = html;
        }

        async function fetchUserMessages(uid) {
          try {
            const { data, error } = await supabase.from('notifications').select('*').eq('user_id', uid);
            if (error || !data) return [];

            let messages = data.map(d => ({
              id: d.id,
              subject: d.title || d.subject || 'Announcement',
              body: d.message || d.text || d.body || '',
              time: d.created_at || d.createdAt || new Date().toISOString(),
              read: d.read === true || d.isRead === true
            }));

            messages.sort((a, b) => new Date(b.time) - new Date(a.time));
            return messages;
          } catch (e) {
            console.error(e);
            return [];
          }
        }

        window.openMessageModal = async () => {
          let c = document.getElementById('modal-msg-container'), t = ld[currLang] || ld.fa;
          if (currentUserId) {
            allMessages = await fetchUserMessages(currentUserId);
            let unread = allMessages.filter(m => !m.read).length, b = document.getElementById('bell-badge');
            if (b) { b.textContent = unread; b.classList.toggle('show', unread > 0); }
          }
          if (allMessages.length > 0) renderMessageList();
          else c.innerHTML = `<div style="text-align:center;padding:20px;color:#94a3b8">${t.noMsg}</div>`;
          document.getElementById('m-msg')?.classList.add('show');
        };

        function renderMessageList() {
          let c = document.getElementById('modal-msg-container'), t = ld[currLang] || ld.fa, html = '<div style="display:flex;flex-direction:column;gap:10px;">';
          allMessages.forEach((m, idx) => {
            let dTime = '';
            if (m.time) {
              let d = new Date(m.time);
              dTime = isNaN(d.getTime()) ? String(m.time) : d.toUTCString();
            }
            let unread = !m.read;
            html += `<div class="msg-body-box" style="cursor:pointer;border-right:${unread ? '3px solid #38bdf8' : '1px solid rgba(255,255,255,.08)'};" onclick="window.readAdminMessage(${idx})">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div class="msg-title-text" style="${unread ? 'color:#fff;font-weight:800;' : ''}"><i class="fas fa-envelope${unread ? '' : '-open'}-text" style="color:#38bdf8;margin-left:5px;"></i> ${m.subject}</div>
                ${unread ? `<span style="font-size:9px;background:#38bdf8;color:#0f172a;padding:2px 6px;border-radius:4px;font-weight:700;">${t.newBadge}</span>` : ''}
              </div>
              <div class="msg-desc-text" style="margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${m.body}</div>
              <div style="font-size:10px;color:#64748b;margin-top:6px;text-align:left" dir="ltr">${dTime}</div>
            </div>`;
          });
          c.innerHTML = html + '</div>';
        }

        window.readAdminMessage = async idx => {
          let m = allMessages[idx]; if (!m) return;
          if (!m.read && currentUserId && m.id) {
            allMessages[idx].read = true;
            try {
              await supabase.from("notifications").update({ read: true, isRead: true }).eq('id', m.id);
              let unread = allMessages.filter(i => !i.read).length, b = document.getElementById('bell-badge');
              if (b) { b.textContent = unread; b.classList.toggle('show', unread > 0); }
            } catch (e) { console.error(e); }
          }
          let c = document.getElementById('modal-msg-container'), t = ld[currLang] || ld.fa, dTime = '';
          if (m.time) {
            let d = new Date(m.time);
            dTime = isNaN(d.getTime()) ? String(m.time) : d.toUTCString();
          }
          c.innerHTML = `<button onclick="window.openMessageModal()" style="background:none;border:none;color:#38bdf8;cursor:pointer;font-size:12px;margin-bottom:12px;display:flex;align-items:center;gap:5px;padding:0;"><i class="fas fa-arrow-right"></i> ${t.backMsg}</button>
          <div class="msg-body-box" style="padding:16px;">
            <div class="msg-title-text" style="font-size:15px;margin-bottom:8px;"><i class="fas fa-envelope-open-text" style="color:#38bdf8;"></i> ${m.subject}</div>
            <div class="msg-desc-text" style="font-size:13px;line-height:1.8;color:#f8fafc;white-space:pre-wrap;">${m.body}</div>
            <div style="font-size:11px;color:#64748b;margin-top:14px;text-align:left;border-top:1px solid rgba(255,255,255,.05);padding-top:8px;" dir="ltr">${dTime}</div>
          </div>`;
        };

        window.closeMessageModal = () => {
          document.getElementById('m-msg')?.classList.remove('show');
        };

        window.openHelpModal = () => document.getElementById('m-help')?.classList.add('show');
        window.closeHelpModal = () => document.getElementById('m-help')?.classList.remove('show');

        window.filterTx = (type, btn) => {
          currentFilter = type;
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          if (btn) btn.classList.add('active');
          renderTransactions();
        };

        document.getElementById('bell-btn')?.addEventListener('click', e => { e.stopPropagation(); window.openMessageModal(); });
        document.getElementById('help-btn')?.addEventListener('click', e => { e.stopPropagation(); window.openHelpModal(); });

        async function loadUserData(user) {
          currentUserId = user.id;
          try {
            // استفاده از maybeSingle جهت جلوگیری از بروز خطای REST 406
            const { data: userData, error } = await supabase.from('users').select('*').eq('id', user.id).maybeSingle();
            if (error) console.error("خطا در درخواست اطلاعات کاربر:", error);

            if (userData) {
              let rawBalance = userData.balance ?? userData.depositAmount ?? userData.wallet ?? userData.amount ?? 0;
              let numericBalance = parseFloat(rawBalance);
              if (isNaN(numericBalance)) numericBalance = 0;
              
              let elBal = document.getElementById('total-balance');
              if (elBal) elBal.textContent = `$${numericBalance.toFixed(2)}`;

              allMessages = await fetchUserMessages(user.id);
              let unread = allMessages.filter(m => !m.read).length, b = document.getElementById('bell-badge');
              if (b && unread > 0) { b.textContent = unread; b.classList.add('show'); }
            }

            userTransactions = await fetchUserTransactions(user.id);
            renderTransactions();

          } catch (e) {
            console.error("خطا در دریافت اطلاعات کاربر:", e);
            renderTransactions();
          }
        }

        // بررسی هوشمند وضعیت لاگین بدون هدایت اشتباه
        supabase.auth.onAuthStateChange((event, session) => {
          if (session && session.user) {
            loadUserData(session.user);
          } else {
            window.location.href = 'index.html';
          }
        });

        const mBtn = document.getElementById('menu-btn'), nMenu = document.getElementById('nav-menu'), lBtn = document.getElementById('lang-btn'), lMenu = document.getElementById('lang-menu');
        function toggleM(m, e) { e?.stopPropagation(); [nMenu, lMenu].forEach(x => { if (x && x !== m) x.classList.remove('show'); }); m?.classList.toggle('show'); }
        mBtn?.addEventListener('click', e => toggleM(nMenu, e));
        lBtn?.addEventListener('click', e => toggleM(lMenu, e));
        document.addEventListener('click', e => {
          if (!e.target.closest('.menu') && !e.target.closest('#menu-btn') && !e.target.closest('#lang-btn')) {
            [nMenu, lMenu].forEach(x => x?.classList.remove('show'));
          }
        });
        window.addEventListener('scroll', () => [nMenu, lMenu].forEach(x => x?.classList.remove('show')));

        function setLang(l) {
          currLang = l;
          localStorage.setItem('zenix_lang', l);
          [nMenu, lMenu].forEach(x => x?.classList.remove('show'));
          let t = ld[l] || ld.fa;
          let r = l === 'fa' || l === 'ar';
          
          document.documentElement.setAttribute('dir', r ? 'rtl' : 'ltr');
          document.documentElement.setAttribute('lang', l);

          let map = {
            't-tx-title': t.txTitle, 't-tx-sub': t.txSub, 't-tot-bal': t.totBal,
            't-list-title': t.listTitle, 'f-all': t.fAll, 'f-deposit': t.fDep,
            'f-withdraw': t.fWith, 'f-commission': t.fComm, 'f-failed': t.fFailed,
            'm1': t.m1, 'm2': t.m2, 'm3': t.m3, 'm4': t.m4, 'm-team': t.mTeam,
            'm5': t.m5, 'm6': t.m6, 'm7': t.m7, 'm8': t.m8, 't-node': t.tNode,
            't-modal-title': t.modalTitle, 't-help-title': t.helpTitle
          };

          Object.keys(map).forEach(id => {
            let el = document.getElementById(id);
            if (el && map[id]) el.textContent = map[id];
          });

          let helpBtn = document.getElementById('help-btn');
          if (helpBtn) helpBtn.setAttribute('title', t.helpBtnTitle || '');

          for (let i = 1; i <= 4; i++) {
            let ht = document.getElementById('t-hp-t' + i);
            let hd = document.getElementById('t-hp-d' + i);
            if (ht) {
              const icons = ['fa-history', 'fa-filter', 'fa-wallet', 'fa-check-circle'];
              const colors = ['#38bdf8', '#38bdf8', '#a855f7', '#22c55e'];
              ht.innerHTML = `<i class="fas ${icons[i-1]}" style="color:${colors[i-1]}"></i> ` + (t['hpT' + i] || '');
            }
            if (hd) hd.textContent = t['hpD' + i] || '';
          }

          renderTransactions();
        }

        document.querySelectorAll('#lang-menu .mi').forEach(i => i.addEventListener('click', () => setLang(i.dataset.lang)));

        document.getElementById('logout-btn')?.addEventListener('click', async e => {
          e.preventDefault();
          await supabase.auth.signOut();
          localStorage.clear();
          window.location.href = 'index.html';
        });

        setLang(currLang);
    </script>
