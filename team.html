<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت تیم - ZENIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 30px; }

        /* هدر */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(15, 23, 42, 0.9); border-bottom: 1px solid var(--border-color); sticky: top; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .header-title { font-size: 16px; font-weight: bold; color: var(--accent-color); }
        .wrap { display: flex; align-items: center; gap: 10px; }
        
        /* دکمه زنگوله و مدال‌ها */
        .lb { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 10px; color: #fff; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; }
        .badge { position: absolute; top: -5px; right: -5px; background: #ef4444; color: #fff; font-size: 10px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; }
        .badge.show { display: flex; }

        .container { padding: 15px; max-width: 600px; margin: 0 auto; }

        /* کارت‌ها */
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 15px; margin-bottom: 15px; backdrop-filter: blur(8px); }
        .card-title { font-size: 14px; font-weight: 600; color: var(--accent-color); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }

        /* لینک دعوت */
        .ref-box { display: flex; gap: 8px; margin-top: 10px; }
        .ref-input { flex: 1; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; direction: ltr; }
        .btn-copy { background: var(--accent-color); color: #0f172a; border: none; padding: 0 15px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

        /* خلاصه آمار */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; text-align: center; }
        .stat-val { font-size: 15px; font-weight: bold; color: #fff; margin-top: 4px; }
        .stat-lbl { font-size: 11px; color: var(--text-secondary); }

        /* تب‌های نسل‌ها */
        .gen-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .gen-tab { flex: 1; padding: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-secondary); font-size: 12px; text-align: center; cursor: pointer; }
        .gen-tab.active { background: var(--accent-color); color: #0f172a; font-weight: bold; border-color: var(--accent-color); }

        /* لیست اعضا */
        .member-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 12px; }
        .member-item:last-child { border-bottom: none; }

        /* استایل مودال‌ها */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 15px; backdrop-filter: blur(5px); }
        .modal.show { display: flex; }
        .modal-content { background: #1e293b; border: 1px solid var(--border-color); border-radius: 16px; width: 100%; max-width: 480px; max-height: 85vh; display: flex; flex-direction: column; padding: 18px; position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 12px; }
        .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 16px; cursor: pointer; }

        /* استایل نئونی تب‌های صندوق پیام */
        .notif-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; padding-bottom: 6px; border-bottom: 1px solid rgba(255, 255, 255, .08); flex-shrink: 0; }
        .notif-tab { background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); color: #94a3b8; padding: 5px 10px; border-radius: 20px; font-size: 11px; cursor: pointer; white-space: nowrap; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; flex: 1 1 auto; }
        .notif-tab:hover { background: rgba(56, 189, 248, .15); color: #38bdf8; }
        .notif-tab.active { background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, .3); }
        .tab-badge { background: rgba(255, 255, 255, .15); color: inherit; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 700; line-height: 1.2; min-width: 16px; text-align: center; display: inline-block; }
        .notif-tab.active .tab-badge { background: rgba(15, 23, 42, .3); color: #0f172a; }

        #modal-msg-container { overflow-y: auto; padding-right: 6px; flex: 1; min-height: 0; }
        #modal-msg-container::-webkit-scrollbar { width: 5px; }
        #modal-msg-container::-webkit-scrollbar-track { background: rgba(15, 23, 42, .6); border-radius: 10px; }
        #modal-msg-container::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, .35); border-radius: 10px; }
        #modal-msg-container::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, .7); }
        #modal-msg-container { scrollbar-width: thin; scrollbar-color: rgba(56, 189, 248, .35) rgba(15, 23, 42, .6); }
    </style>
</head>
<body>

    <!-- هدر با دکمه زنگوله -->
    <header>
        <button class="lb" onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-right"></i></button>
        <span class="header-title" id="t-header-title">مدیریت تیم و ارجاع</span>
        <div class="wrap">
            <button type="button" class="lb" id="bell-btn">
                <i class="fas fa-bell" style="color:#fbbf24"></i>
                <span class="badge" id="bell-badge">0</span>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- کارت لینک دعوت -->
        <div class="card">
            <div class="card-title"><i class="fas fa-link"></i> <span id="t-ref-title">لینک اختصاصی دعوت</span></div>
            <p style="font-size: 11px; color: var(--text-secondary);" id="t-ref-desc">با اشتراک‌گذاری این لینک، از کمیسیون معامله‌های تیم خود در ۳ نسل بهره‌مند شوید.</p>
            <div class="ref-box">
                <input type="text" id="ref-url" class="ref-input" readonly value="در حال دریافت...">
                <button class="btn-copy" onclick="copyRefLink()" id="t-copy-btn">کپی</button>
            </div>
        </div>

        <!-- خلاصه آمار -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-lbl" id="t-total-members">کل اعضا</div>
                <div class="stat-val" id="val-total-members">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-lbl" id="t-total-volume">حجم تیم</div>
                <div class="stat-val" id="val-total-volume">$0.00</div>
            </div>
            <div class="stat-box">
                <div class="stat-lbl" id="t-total-comm">پاداش دریافتی</div>
                <div class="stat-val" id="val-total-comm" style="color: #22c55e;">$0.00</div>
            </div>
        </div>

        <!-- لیست اعضای نسل‌ها -->
        <div class="card">
            <div class="gen-tabs">
                <div class="gen-tab active" onclick="switchGen(1, this)" id="t-gen1">نسل اول (10%)</div>
                <div class="gen-tab" onclick="switchGen(2, this)" id="t-gen2">نسل دوم (5%)</div>
                <div class="gen-tab" onclick="switchGen(3, this)" id="t-gen3">نسل سوم (2%)</div>
            </div>
            <div id="members-list">
                <div style="text-align: center; padding: 20px; color: var(--text-secondary); font-size: 12px;">در حال بارگذاری لیست اعضا...</div>
            </div>
        </div>
    </div>

    <!-- مودال صندوق پیام‌ها و اعلان‌ها با تب‌بندی و شمارنده -->
    <div class="modal" id="m-msg">
        <div class="modal-content">
            <div class="modal-header">
                <span id="t-modal-title"><i class="fas fa-bell"></i> صندوق پیام‌ها و اعلان‌ها</span>
                <button class="modal-close" onclick="window.closeMessageModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="notif-tabs" id="notif-tabs">
                <button type="button" class="notif-tab active" onclick="window.setNotifFilter('all', this)"><i class="fas fa-list"></i> <span id="t-tab-all">همه</span> <span class="tab-badge" id="cnt-tab-all">0</span></button>
                <button type="button" class="notif-tab" onclick="window.setNotifFilter('approved', this)"><i class="fas fa-check-circle" style="color:#22c55e"></i> <span id="t-tab-approved">تایید درخواست</span> <span class="tab-badge" id="cnt-tab-approved">0</span></button>
                <button type="button" class="notif-tab" onclick="window.setNotifFilter('rejected', this)"><i class="fas fa-times-circle" style="color:#ef4444"></i> <span id="t-tab-rejected">لغو درخواست</span> <span class="tab-badge" id="cnt-tab-rejected">0</span></button>
                <button type="button" class="notif-tab" onclick="window.setNotifFilter('admin_message', this)"><i class="fas fa-bullhorn" style="color:#38bdf8"></i> <span id="t-tab-admin">پیام مدیریت</span> <span class="tab-badge" id="cnt-tab-admin">0</span></button>
            </div>
            <div id="modal-msg-container"><div style="text-align:center;padding:20px;color:#94a3b8">هیچ پیام جدیدی وجود ندارد.</div></div>
        </div>
    </div>

    <!-- مودال مشاهده جزئیات پیام -->
    <div class="modal" id="m-msg-detail" style="z-index:1050;">
        <div class="modal-content">
            <div class="modal-header">
                <span id="detail-msg-title"><i class="fas fa-envelope-open"></i> مشاهده پیام</span>
                <button class="modal-close" onclick="window.closeMsgDetailModal()"><i class="fas fa-times"></i></button>
            </div>
            <div style="overflow-y:auto;padding-right:6px">
                <div id="detail-msg-date" style="font-size:11px;color:#94a3b8;direction:ltr;text-align:left;margin-bottom:10px;display:none;"></div>
                <div id="detail-msg-body" style="font-size:13px;color:#cbd5e1;line-height:1.7;white-space:pre-wrap;margin-bottom:12px;"></div>
                <div id="detail-msg-support"></div>
            </div>
        </div>
    </div>

    <!-- اسکریپت‌های عمومی و کنترل‌های UI -->
    <script>
        // کنترل مودال اعلان‌ها
        window.openMessageModal = () => document.getElementById('m-msg')?.classList.add('show');
        window.closeMessageModal = () => document.getElementById('m-msg')?.classList.remove('show');

        const bellBtn = document.getElementById('bell-btn');
        if (bellBtn) bellBtn.onclick = (e) => { e.stopPropagation(); window.openMessageModal(); };

        // دیکشنری چند زبانه
        const LD = {
            fa: {
                headerTitle: 'مدیریت تیم و ارجاع',
                refTitle: 'لینک اختصاصی دعوت',
                refDesc: 'با اشتراک‌گذاری این لینک، از کمیسیون معامله‌های تیم خود در ۳ نسل بهره‌مند شوید.',
                copyBtn: 'کپی',
                totalMembers: 'کل اعضا',
                totalVolume: 'حجم تیم',
                totalComm: 'پاداش دریافتی',
                gen1: 'نسل اول (10%)',
                gen2: 'نسل دوم (5%)',
                gen3: 'نسل سوم (2%)',
                modalTitle: 'صندوق پیام‌ها و اعلان‌ها',
                tabAll: 'همه',
                tabApproved: 'تایید درخواست',
                tabRejected: 'لغو درخواست',
                tabAdmin: 'پیام مدیریت',
                noMsg: 'هیچ پیام جدیدی وجود ندارد.'
            }
        };

        function setLang(lang = 'fa') {
            const t = LD[lang] || LD.fa;
            document.getElementById('t-header-title').innerText = t.headerTitle;
            document.getElementById('t-ref-title').innerText = t.refTitle;
            document.getElementById('t-ref-desc').innerText = t.refDesc;
            document.getElementById('t-copy-btn').innerText = t.copyBtn;
            document.getElementById('t-total-members').innerText = t.totalMembers;
            document.getElementById('t-total-volume').innerText = t.totalVolume;
            document.getElementById('t-total-comm').innerText = t.totalComm;
            document.getElementById('t-gen1').innerText = t.gen1;
            document.getElementById('t-gen2').innerText = t.gen2;
            document.getElementById('t-gen3').innerText = t.gen3;

            let elModalTitle = document.getElementById('t-modal-title');
            if (elModalTitle && t.modalTitle) elModalTitle.innerHTML = `<i class="fas fa-bell"></i> ${t.modalTitle}`;

            const tabMap = {
                't-tab-all': t.tabAll,
                't-tab-approved': t.tabApproved,
                't-tab-rejected': t.tabRejected,
                't-tab-admin': t.tabAdmin
            };
            Object.keys(tabMap).forEach(id => {
                const el = document.getElementById(id);
                if (el && tabMap[id]) el.textContent = tabMap[id];
            });
        }

        function copyRefLink() {
            const copyText = document.getElementById("ref-url");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("لینک دعوت با موفقیت کپی شد.");
        }

        let currentActiveGen = 1;
        function switchGen(gen, el) {
            currentActiveGen = gen;
            document.querySelectorAll('.gen-tab').forEach(t => t.classList.remove('active'));
            if (el) el.classList.add('active');
            if (window.renderTeamMembers) window.renderTeamMembers(gen);
        }

        document.addEventListener('DOMContentLoaded', () => setLang('fa'));
    </script>

    <!-- اسکریپت اصلی Supabase و مدیریت اعلان‌ها/تیم -->
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // متغیرها و توابع مدیریت اعلان‌ها (کاملاً عیناً هماهنگ‌شده با کوانتیفیکیشن)
        // ==========================================
        window.cachedNotifications = [];
        window.currentFilteredNotifs = [];
        window.activeNotifFilter = 'all';
        window.actualUserKeys = [];

        window.formatGregorianDate = function(rawDate) {
            if (!rawDate) return '';
            const d = new Date(rawDate);
            if (isNaN(d.getTime())) return '';
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        };

        window.getNotifCategory = function(n) {
            const type = (n.type || '').toLowerCase();
            const title = (n.title || '').toLowerCase();

            if (type.includes('approved') || type.includes('confirm') || title.includes('تایید') || title.includes('موفق') || title.includes('شارژ شد')) {
                return 'approved';
            }
            if (type.includes('rejected') || type.includes('canceled') || type.includes('cancel') || title.includes('رد') || title.includes('لغو') || title.includes('ناموفق')) {
                return 'rejected';
            }
            return 'admin_message';
        };

        window.updateTabBadges = function() {
            const notifs = window.cachedNotifications || [];
            const allCount = notifs.length;
            let approvedCount = 0;
            let rejectedCount = 0;
            let adminCount = 0;

            notifs.forEach(n => {
                const cat = window.getNotifCategory(n);
                if (cat === 'approved') approvedCount++;
                else if (cat === 'rejected') rejectedCount++;
                else if (cat === 'admin_message') adminCount++;
            });

            const elAll = document.getElementById('cnt-tab-all');
            const elApproved = document.getElementById('cnt-tab-approved');
            const elRejected = document.getElementById('cnt-tab-rejected');
            const elAdmin = document.getElementById('cnt-tab-admin');

            if (elAll) elAll.innerText = allCount;
            if (elApproved) elApproved.innerText = approvedCount;
            if (elRejected) elRejected.innerText = rejectedCount;
            if (elAdmin) elAdmin.innerText = adminCount;
        };

        window.updateBellBadge = function() {
            const unreadCount = window.cachedNotifications.filter(n => !n.read && !n.isRead && !n.is_read).length;
            const badge = document.getElementById('bell-badge');
            if (badge) {
                badge.innerText = unreadCount;
                if (unreadCount > 0) badge.classList.add('show');
                else badge.classList.remove('show');
            }
            window.updateTabBadges();
        };

        window.setNotifFilter = function(filter, element) {
            window.activeNotifFilter = filter;
            const tabs = document.querySelectorAll('#notif-tabs .notif-tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            if (element) {
                element.classList.add('active');
            }
            
            window.renderNotifications();
        };

        window.closeMsgDetailModal = function() {
            const modal = document.getElementById('m-msg-detail');
            if (modal) modal.classList.remove('show');
        };

        window.openMsgDetail = async function(idx) {
            const n = window.currentFilteredNotifs[idx];
            if (!n) return;

            const isUnread = !n.read && !n.isRead && !n.is_read;

            if (isUnread) {
                n.is_read = true;
                n.read = true;
                n.isRead = true;

                window.updateBellBadge();
                window.renderNotifications();

                try {
                    const { data, error } = await supabase
                        .from('notifications')
                        .update({ is_read: true })
                        .eq('id', n.id)
                        .select();

                    if (error) {
                        console.warn('خطا در ستون is_read، تلاش برای ثبت در ستون read:', error);
                        const res2 = await supabase
                            .from('notifications')
                            .update({ read: true })
                            .eq('id', n.id);
                            
                        if (res2.error) {
                            console.warn('خطا در ستون read، تلاش برای ثبت در ستون isRead:', res2.error);
                            await supabase
                                .from('notifications')
                                .update({ isRead: true })
                                .eq('id', n.id);
                        }
                    }
                } catch (err) {
                    console.error('خطای ارتباط با Supabase در به‌روزرسانی اعلان:', err);
                }
            }

            const title = n.title || 'پیام سیستم';
            const msg = n.message || n.text || n.body || '';
            const category = window.getNotifCategory(n);
            const dateStr = window.formatGregorianDate(n.created_at || n.date || n.created_date);

            const detailTitle = document.getElementById('detail-msg-title');
            const detailDate = document.getElementById('detail-msg-date');
            const detailBody = document.getElementById('detail-msg-body');
            const detailSupport = document.getElementById('detail-msg-support');

            if (detailTitle) detailTitle.innerHTML = `<i class="fas fa-bell" style="color:#38bdf8"></i> ${title}`;
            
            if (detailDate) {
                if (dateStr) {
                    detailDate.innerHTML = `<i class="far fa-clock" style="color:#38bdf8;margin-right:4px;"></i>${dateStr}`;
                    detailDate.style.display = 'block';
                } else {
                    detailDate.style.display = 'none';
                }
            }

            if (detailBody) detailBody.innerText = msg;

            if (detailSupport) {
                if (category === 'rejected') {
                    detailSupport.innerHTML = `
                    <div style="margin-top:15px;padding-top:10px;border-top:1px dashed rgba(239,68,68,0.3);display:flex;justify-content:flex-end;">
                        <a href="support.html" onclick="sessionStorage.setItem('zenix_return_page', window.location.href);" style="display:inline-flex;align-items:center;gap:6px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#f8fafc;padding:6px 12px;border-radius:6px;font-size:12px;text-decoration:none;font-weight:600;transition:0.2s;">
                            <i class="fas fa-headset" style="color:#ef4444;"></i>
                            <span>پیگیری از طریق پشتیبانی</span>
                        </a>
                    </div>`;
                } else {
                    detailSupport.innerHTML = '';
                }
            }

            document.getElementById('m-msg-detail')?.classList.add('show');
        };

        window.renderNotifications = function() {
            window.updateTabBadges();
            const container = document.getElementById('modal-msg-container');
            if (!container) return;

            const filter = window.activeNotifFilter;
            const filtered = window.cachedNotifications.filter(n => {
                if (filter === 'all') return true;
                return window.getNotifCategory(n) === filter;
            });

            window.currentFilteredNotifs = filtered;

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center;padding:25px;color:#94a3b8;font-size:12px;"><i class="fas fa-inbox" style="font-size:24px;margin-bottom:8px;display:block;opacity:0.5;"></i>هیچ پیامی در این دسته‌بندی وجود ندارد.</div>`;
                return;
            }

            let html = '';
            filtered.forEach((n, idx) => {
                const title = n.title || 'پیام سیستم';
                const category = window.getNotifCategory(n);
                const isUnread = !n.read && !n.isRead && !n.is_read;
                const dateStr = window.formatGregorianDate(n.created_at || n.date || n.created_date);

                let borderStyle = "border:1px solid rgba(255,255,255,.08);";
                let bgStyle = "background:rgba(255,255,255,.02);";
                let icon = '<i class="fas fa-bullhorn" style="color:#38bdf8"></i>';
                let tagHtml = '<span style="font-size:10px;background:rgba(56,189,248,0.2);color:#38bdf8;padding:2px 6px;border-radius:4px;font-weight:700;">پیام مدیریت</span>';

                if (category === 'approved') {
                    borderStyle = isUnread ? "border:1px solid rgba(34, 197, 94, 0.6);" : "border:1px solid rgba(34, 197, 94, 0.2);";
                    bgStyle = isUnread ? "background:rgba(34, 197, 94, 0.12);" : "background:rgba(34, 197, 94, 0.03);";
                    icon = '<i class="fas fa-check-circle" style="color:#22c55e"></i>';
                    tagHtml = '<span style="font-size:10px;background:rgba(34,197,94,0.2);color:#22c55e;padding:2px 6px;border-radius:4px;font-weight:700;">تایید درخواست</span>';
                } else if (category === 'rejected') {
                    borderStyle = isUnread ? "border:1px solid rgba(239, 68, 68, 0.6);" : "border:1px solid rgba(239, 68, 68, 0.2);";
                    bgStyle = isUnread ? "background:rgba(239, 68, 68, 0.12);" : "background:rgba(239, 68, 68, 0.03);";
                    icon = '<i class="fas fa-times-circle" style="color:#ef4444"></i>';
                    tagHtml = '<span style="font-size:10px;background:rgba(239,68,68,0.2);color:#ef4444;padding:2px 6px;border-radius:4px;font-weight:700;">لغو درخواست</span>';
                } else {
                    bgStyle = isUnread ? "background:rgba(56, 189, 248, 0.12);" : "background:rgba(255, 255, 255, 0.02);";
                    borderStyle = isUnread ? "border:1px solid rgba(56, 189, 248, 0.5);" : "border:1px solid rgba(255, 255, 255, 0.08);";
                }

                const opacityStyle = isUnread ? "opacity:1;" : "opacity:0.65;";
                const unreadDot = isUnread ? `<span style="width:7px;height:7px;background:#38bdf8;border-radius:50%;display:inline-block;box-shadow:0 0 6px #38bdf8;"></span>` : '';

                html += `<div class="msg-body-box" onclick="window.openMsgDetail(${idx})" style="${borderStyle} ${bgStyle} ${opacityStyle} cursor:pointer;margin-bottom:8px;padding:10px;border-radius:10px;transition:0.2s;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                        <div style="display:flex;align-items:center;gap:6px;">
                            ${icon}
                            <strong style="font-size:12px;color:#f8fafc;">${title}</strong>
                            ${unreadDot}
                        </div>
                        ${tagHtml}
                    </div>
                    ${dateStr ? `<div style="font-size:10px;color:#94a3b8;direction:ltr;text-align:left;margin-bottom:4px;"><i class="far fa-clock" style="margin-right:2px;"></i>${dateStr}</div>` : ''}
                </div>`;
            });

            container.innerHTML = html;
        };

        async function fetchNotifications(userId, userKeys = []) {
            try {
                let query = supabase
                    .from('notifications')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (userKeys && userKeys.length > 0) {
                    const orConditions = userKeys.map(k => `user_id.eq.${k}`).join(',');
                    query = query.or(orConditions);
                } else if (userId) {
                    query = query.eq('user_id', userId);
                }

                const { data, error } = await query;
                if (error) {
                    console.warn('خطا در دریافت اعلان‌ها:', error);
                    return;
                }

                window.cachedNotifications = data || [];
                window.updateBellBadge();
                window.renderNotifications();
            } catch (err) {
                console.error('خطای عدم دسترسی به اعلان‌ها:', err);
            }
        }

        // ==========================================
        // بارگذاری داده‌های تیم و مقداردهی اولیه
        // ==========================================
        let teamData = { gen1: [], gen2: [], gen3: [] };

        window.renderTeamMembers = function(gen) {
            const listEl = document.getElementById('members-list');
            const members = teamData[`gen${gen}`] || [];
            
            if (members.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--text-secondary); font-size: 12px;">عضوی در این نسل یافت نشد.</div>`;
                return;
            }

            let html = '';
            members.forEach(m => {
                html += `
                <div class="member-item">
                    <div>
                        <strong style="color: #fff;">${m.email || m.uid || 'کاربر'}</strong>
                        <div style="font-size: 10px; color: var(--text-secondary);">${m.created_at ? window.formatGregorianDate(m.created_at) : ''}</div>
                    </div>
                    <div style="text-align: left;">
                        <span style="color: var(--accent-color); font-weight: bold;">$${(m.volume || 0).toFixed(2)}</span>
                    </div>
                </div>`;
            });
            listEl.innerHTML = html;
        };

        async function initPage() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session?.user) {
                window.location.href = 'login.html';
                return;
            }

            const userId = session.user.id;
            const uid = session.user.user_metadata?.uid || userId.substring(0, 8);

            // ست کردن لینک دعوت
            const origin = window.location.origin;
            document.getElementById('ref-url').value = `${origin}/register.html?ref=${uid}`;

            // کلیدهای شناسایی کاربر برای اعلان‌ها
            window.actualUserKeys = [userId, uid, session.user.email].filter(Boolean);

            // دریافت اعلان‌ها
            await fetchNotifications(userId, window.actualUserKeys);

            // دریافت اعضای تیم از دیتابیس
            try {
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', userId)
                    .single();

                if (profile) {
                    document.getElementById('val-total-comm').innerText = `$${(profile.total_commission || 0).toFixed(2)}`;
                }

                // فراخوانی نمونه برای اعضا
                const { data: g1 } = await supabase.from('profiles').select('*').eq('referred_by', uid);
                teamData.gen1 = g1 || [];

                const totalM = teamData.gen1.length + teamData.gen2.length + teamData.gen3.length;
                document.getElementById('val-total-members').innerText = totalM;

                window.renderTeamMembers(1);
            } catch (err) {
                console.error('خطا در دریافت اطلاعات تیم:', err);
            }
        }

        initPage();
    </script>
</body>
</html>
