<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#031b16">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>میز باکارات - Zenix Casino</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --felt-green: #064e3b;
            --gold-accent: #facc15;
            --bg-dark: #030712;
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #030712;
            color: #f8fafc;
        }

        body {
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Header & Charging Bar --- */
        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--glass-border);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            height: 45px;
        }

        .game-header-title { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 800; color: #facc15; display: flex; align-items: center; gap: 6px; }
        .live-badge { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; display: flex; align-items: center; gap: 4px; }

        .game-bar {
            background: rgba(15, 23, 42, 0.88);
            border-bottom: 1px solid rgba(250, 204, 21, 0.25);
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99;
            backdrop-filter: blur(8px);
            height: 42px;
        }

        .user-welcome-tag {
            font-size: 11px;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 3px 10px;
            border-radius: 10px;
        }

        .user-stats { display: flex; align-items: center; gap: 8px; }
        .stat-pill { background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); padding: 4px 10px; border-radius: 12px; display: flex; align-items: center; gap: 6px; }
        .stat-val { font-family: 'Orbitron', sans-serif; font-weight: 800; color: var(--gold-accent); font-size: 12px; }
        
        .casino-deposit-btn {
            background: linear-gradient(135deg, #facc15, #f97316);
            color: #0f172a;
            padding: 5px 12px;
            border-radius: 8px;
            border: none;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.4);
        }

        /* --- Casino Stage & Live Dealer --- */
        .main-stage {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: radial-gradient(circle at 50% 30%, #065f46 0%, #031b16 70%, #020d0a 100%);
            overflow: hidden;
        }

        /* بخش سر دیلر دقیقاً زیر بار شارژ */
        .live-dealer-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 2px;
        }

        .dealer-avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--gold-accent);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.5), inset 0 0 15px rgba(0,0,0,0.8);
            overflow: hidden;
            background: #0f172a;
            position: relative;
        }

        .dealer-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center; /* تمرکز کامل روی سر و صورت دیلر */
        }

        .dealer-tag {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--gold-accent);
            color: #fff;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: -10px;
            z-index: 11;
            font-weight: 700;
        }

        /* سینی چیپ و کارت قرار گرفته زیر دیلر */
        .dealer-tray-section {
            background: linear-gradient(180deg, #2a1a08, #0f172a);
            border: 1.5px solid #ca8a04;
            border-radius: 8px;
            padding: 4px 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            z-index: 9;
        }

        .chip-rack { display: flex; gap: 4px; background: rgba(0,0,0,0.6); padding: 3px 6px; border-radius: 6px; }
        .casino-chip { width: 18px; height: 18px; border-radius: 50%; border: 2px dashed #fff; display: inline-block; }
        .chip-red { background: #dc2626; }
        .chip-green { background: #16a34a; }
        .chip-blue { background: #2563eb; }
        .chip-black { background: #111827; }

        /* میزاصلی و کارت‌ها */
        .casino-felt-table {
            width: 95%;
            max-width: 500px;
            margin-top: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(250, 204, 21, 0.3);
            border-radius: 120px 120px 20px 20px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 5;
        }

        .live-status-banner {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold-accent);
            background: rgba(0,0,0,0.6);
            padding: 4px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
        }

        .arena-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .arena-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .arena-box.player-side { border-color: rgba(56,189,248,0.6); }
        .arena-box.banker-side { border-color: rgba(239,68,68,0.6); }

        .arena-title { font-size: 11px; font-weight: 800; color: #facc15; display: flex; justify-content: space-between; width: 100%; }

        .cards-row { display: flex; gap: 4px; min-height: 55px; align-items: center; justify-content: center; }

        .playing-card {
            width: 36px;
            height: 52px;
            background: #ffffff;
            color: #0f172a;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px 4px;
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.8);
        }
        .playing-card.red { color: #dc2626; }
        .card-symbol { font-size: 13px; align-self: center; }

        /* کنترل پنل پایین */
        .control-panel {
            width: 100%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--glass-border);
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .control-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

        .bet-input-box {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 4px 8px;
            flex: 1;
        }
        .bet-input {
            background: transparent;
            border: none;
            color: var(--gold-accent);
            font-family: 'Orbitron';
            font-weight: 800;
            font-size: 13px;
            width: 100%;
            outline: none;
            text-align: center;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            border: none;
            color: #fff;
        }
        .btn-yes { background: linear-gradient(135deg, #22c55e, #16a34a); color: #030712; }
        .btn-no { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-deal { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #030712; width: 100%; }

        /* تنظیمات موبایل برای مشخص بودن کامل سر دیلر */
        @media (max-width: 640px) {
            .dealer-avatar-container {
                width: 75px;
                height: 75px;
            }
            .casino-felt-table {
                margin-top: 5px;
                padding: 10px 8px;
            }
            .playing-card {
                width: 32px;
                height: 48px;
            }
        }
    </style>
</head>
<body>

    <!-- هدر -->
    <header>
        <div class="game-header-title">
            <i class="fa-solid fa-crown"></i> ZENIX CASINO
        </div>
        <div class="live-badge">
            <i class="fa-solid fa-circle-dot"></i> LIVE DEALER
        </div>
    </header>

    <!-- نوار شارژ و مشخصات کاربر -->
    <div class="game-bar">
        <div class="user-welcome-tag">
            <i class="fa-solid fa-user"></i> کاربر آنلاین
        </div>
        <div class="user-stats">
            <div class="stat-pill">
                <span class="stat-val">12,500,000</span>
                <span style="font-size: 9px; color: #94a3b8;">تومان</span>
            </div>
            <button class="casino-deposit-btn">
                <i class="fa-solid fa-plus"></i> شارژ
            </button>
        </div>
    </div>

    <!-- استیج اصلی و میز بازی -->
    <div class="main-stage">

        <!-- سر دیلر دقیقاً زیر شارژ هدر -->
        <div class="live-dealer-wrapper">
            <div class="dealer-avatar-container">
                <!-- تصویر دیلر واقعی -->
                <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=300&q=80" alt="Live Dealer" class="dealer-img">
            </div>
            <div class="dealer-tag">Elena (Dealer)</div>

            <!-- سینی چیپ‌ها زیر سر دیلر -->
            <div class="dealer-tray-section">
                <div class="chip-rack">
                    <span class="casino-chip chip-red"></span>
                    <span class="casino-chip chip-blue"></span>
                    <span class="casino-chip chip-green"></span>
                    <span class="casino-chip chip-black"></span>
                </div>
            </div>
        </div>

        <!-- نمد میز کازینو -->
        <div class="casino-felt-table">
            <div class="live-status-banner">
                زمان شرط‌بندی: <span style="color: #38bdf8;">12 ثانیه</span>
            </div>

            <!-- ناحیه کارت‌ها -->
            <div class="arena-layout">
                <!-- سمت بازیکن -->
                <div class="arena-box player-side">
                    <div class="arena-title">
                        <span>PLAYER</span>
                        <span> امتیاز: 8</span>
                    </div>
                    <div class="cards-row">
                        <div class="playing-card red">
                            <span>8</span>
                            <span class="card-symbol">♦</span>
                            <span style="transform: rotate(180deg);">8</span>
                        </div>
                        <div class="playing-card">
                            <span>K</span>
                            <span class="card-symbol">♠</span>
                            <span style="transform: rotate(180deg);">K</span>
                        </div>
                    </div>
                </div>

                <!-- سمت دیلر/بانکر -->
                <div class="arena-box banker-side">
                    <div class="arena-title">
                        <span>BANKER</span>
                        <span> امتیاز: 5</span>
                    </div>
                    <div class="cards-row">
                        <div class="playing-card red">
                            <span>5</span>
                            <span class="card-symbol">♥</span>
                            <span style="transform: rotate(180deg);">5</span>
                        </div>
                        <div class="playing-card">
                            <span>J</span>
                            <span class="card-symbol">♣</span>
                            <span style="transform: rotate(180deg);">J</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- کنترل پنل شرط‌بندی ثابت در پایین -->
    <div class="control-panel">
        <div class="control-row">
            <div class="bet-input-box">
                <span style="font-size: 10px; color:#94a3b8; margin-left: 5px;">مبلغ:</span>
                <input type="text" class="bet-input" value="500,000">
            </div>
        </div>
        <div class="control-row">
            <button class="btn-action btn-yes">بازیکن (Player)</button>
            <button class="btn-action btn-no">بانکر (Banker)</button>
        </div>
        <button class="btn-action btn-deal">تایید و ثبت شرط</button>
    </div>

</body>
</html>
