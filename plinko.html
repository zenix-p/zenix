<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Zenix - Plinko Game (بازی پلینکو)</title>
    <link rel="icon" href="data:image/x-icon;base64,=">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans','Vazirmatn',sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo{display:flex;align-items:center;gap:10px}
        .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#0ea5e9,#9333ea);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;font-style:italic;transform:skewX(-6deg);box-shadow:0 0 15px rgba(14,165,233,.4)}
        .logo-text{font-family:'Orbitron',sans-serif;font-size:19px;font-weight:900;letter-spacing:2px;font-style:italic;transform:skewX(-6deg);background:linear-gradient(135deg,#38bdf8,#c084fc,#f43f5e);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(56,189,248,0.4)}
        .hr{display:flex;align-items:center;gap:8px}
        .wrap{position:relative}
        .lb{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;width:36px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#38bdf8;text-decoration:none}
        .menu{display:none;position:absolute;top:42px;background:#0f172a;border:1px solid rgba(255,255,255,.2);border-radius:8px;min-width:max-content;padding:6px;z-index:999;box-shadow:0 8px 25px rgba(0,0,0,.8)}
        [dir="rtl"] .wrap .menu{left:0}[dir="ltr"] .wrap .menu{right:0}
        .menu.show{display:block}
        .mi{padding:7px 10px;font-size:12px;color:#cbd5e1;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
        .mi:hover,.mi.active{background:rgba(56,189,248,.15);color:#38bdf8!important;font-weight:700}
        .c{max-width:900px;width:100%;margin:15px auto;padding:0 12px;flex:1}
        .wel{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(147,51,234,.15));border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
        .wel h1{font-size:16px;margin-bottom:3px;color:#38bdf8}
        .wel p{color:#94a3b8;font-size:11px}
        .game-layout{display:grid;grid-template-columns:280px 1fr;gap:15px}
        @media(max-width:768px){.game-layout{grid-template-columns:1fr}}
        .panel{background:rgba(15,23,42,.85);border:1px solid rgba(56,189,248,.3);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px}
        .canvas-container{background:radial-gradient(circle,#1e293b,#030712);border-radius:16px;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:10px}
        canvas{display:block;width:100%;max-width:420px;height:auto}
        .input-group{text-align:right}
        .input-group label{font-size:12px;color:#94a3b8;display:block;margin-bottom:5px}
        .input-group input,.input-group select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px;color:#fff;font-size:14px;outline:none}
        .drop-btn{width:100%;background:linear-gradient(135deg,#38bdf8,#9333ea);border:none;border-radius:12px;padding:14px;color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 5px 20px rgba(56,189,248,.4);transition:0.2s}
        .drop-btn:hover{opacity:.9}
        .drop-btn:disabled{background:#334155;color:#64748b;cursor:not-allowed;box-shadow:none}
        .last-wins{font-size:11px;color:#94a3b8;margin-top:5px;display:flex;gap:6px;overflow-x:auto}
        .win-tag{background:rgba(255,255,255,.05);padding:3px 8px;border-radius:6px;font-family:'Orbitron',sans-serif;color:#38bdf8}
        footer{text-align:center;padding:10px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto;width:100%;padding-left:12px;padding-right:12px}
    </style>
</head>
<body>
    <header>
        <div class="logo"><div class="logo-icon">Z</div><div class="logo-text">ZENIX</div></div>
        <div class="hr">
            <a href="dashboard.html" class="lb"><i class="fas fa-home" style="color:#38bdf8"></i></a>
            <div class="wrap">
                <button type="button" class="lb" id="menu-btn"><i class="fas fa-bars" style="color:#f43f5e"></i></button>
                <div class="menu" id="nav-menu">
                    <a href="dashboard.html" class="mi"><i class="fas fa-home" style="color:#38bdf8"></i><span>صفحه اصلی</span></a>
                    <a href="quantification.html" class="mi"><i class="fas fa-robot" style="color:#a855f7"></i><span>کوانتیفیکیشن</span></a>
                    <a href="plinko.html" class="mi active"><i class="fas fa-circle-dot" style="color:#38bdf8"></i><span>بازی پلینکو (Plinko)</span></a>
                    <a href="deposit.html" class="mi"><i class="fas fa-arrow-down" style="color:#22c55e"></i><span>واریز</span></a>
                    <a href="receive.html" class="mi"><i class="fas fa-arrow-up" style="color:#fbbf24"></i><span>برداشت</span></a>
                    <a href="transactions.html" class="mi"><i class="fas fa-history" style="color:#06b6d4"></i><span>تراکنش</span></a>
                    <a href="profile.html" class="mi"><i class="fas fa-user-cog" style="color:#ec4899"></i><span>پروفایل</span></a>
                    <a href="index.html" class="mi" style="color:#ef4444"><i class="fas fa-power-off"></i><span>خروج</span></a>
                </div>
            </div>
        </div>
    </header>

    <div class="c">
        <div class="wel">
            <div>
                <h1>بازی پلینکو هوشمند (Zenix Plinko)</h1>
                <p>توپ را رها کن و منتظر ضریب شگفت‌انگیز شانس باش!</p>
            </div>
            <div style="font-size:12px;background:rgba(56,189,248,.15);border:1px solid #38bdf8;padding:6px 12px;border-radius:8px;color:#38bdf8;font-weight:bold;">
                موجودی: <span id="user-balance">$0.00</span>
            </div>
        </div>

        <div class="game-layout">
            <div class="panel">
                <div class="input-group">
                    <label>مبلغ شرط (دلار)</label>
                    <input type="number" id="bet-amount" min="1" value="10">
                </div>
                <div class="input-group">
                    <label>سطح ریسک</label>
                    <select id="risk-level">
                        <option value="low">کم (امن‌تر)</option>
                        <option value="medium" selected>متوسط</option>
                        <option value="high">زیاد (ضرایب بالا)</option>
                    </select>
                </div>
                <button type="button" class="drop-btn" id="drop-btn" onclick="dropBall()">رها کردن توپ</button>
                <div>
                    <span style="font-size:11px;color:#94a3b8">آخرین ضریب‌ها:</span>
                    <div class="last-wins" id="last-wins">
                        <span class="win-tag">1.5x</span>
                        <span class="win-tag">2.0x</span>
                        <span class="win-tag">0.5x</span>
                    </div>
                </div>
            </div>

            <div class="canvas-container">
                <canvas id="plinkoCanvas" width="400" height="420"></canvas>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Zenix. All rights reserved.</p>
        <p style="color:#22c55e;"><i class="fas fa-circle" style="font-size:6px;"></i> سرور فعال (US-East)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ujyenmqdgivuxvxptwyl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserId = null;
        let userBalance = 0;
        let isPlaying = false;

        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');

        // چیدمان میخ‌ها (پیرامید)
        const rows = 8;
        const pegs = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c <= r; c++) {
                pegs.push({
                    x: canvas.width / 2 + (c - r / 2) * 36,
                    y: 70 + r * 34,
                    radius: 4
                });
            }
        }

        // ضرایب خانه‌های پایین
        const multipliers = [10, 3, 1.5, 0.5, 0.3, 0.5, 1.5, 3, 10];

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session || !session.user) {
                window.location.href = 'index.html';
                return;
            }
            currentUserId = session.user.id;
            await fetchUserData();
            drawBoard();

            const menuBtn = document.getElementById('menu-btn');
            const navMenu = document.getElementById('nav-menu');
            if (menuBtn && navMenu) {
                menuBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navMenu.classList.toggle('show');
                });
                document.addEventListener('click', () => navMenu.classList.remove('show'));
            }
        });

        async function fetchUserData() {
            const { data } = await supabase.from('users').select('balance').eq('id', currentUserId).maybeSingle();
            if (data && data.balance !== undefined) {
                userBalance = Number(data.balance);
                document.getElementById('user-balance').textContent = `$${userBalance.toFixed(2)}`;
            }
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // رسم میخ‌ها
            ctx.fillStyle = '#38bdf8';
            pegs.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // رسم خانه‌های ضریب پایین صفحه
            const boxWidth = canvas.width / multipliers.length;
            multipliers.forEach((m, i) => {
                ctx.fillStyle = m >= 3 ? 'rgba(34,197,94,0.3)' : 'rgba(56,189,248,0.15)';
                ctx.fillRect(i * boxWidth + 2, canvas.height - 35, boxWidth - 4, 30);
                ctx.fillStyle = '#fff';
                ctx.font = '10px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText(m + 'x', i * boxWidth + boxWidth / 2, canvas.height - 16);
            });
        }

        window.dropBall = async function() {
            if (isPlaying) return;
            const betInput = parseFloat(document.getElementById('bet-amount').value);
            
            if (isNaN(betInput) || betInput <= 0) {
                alert('لطفاً مبلغ معتبری وارد کنید.');
                return;
            }
            if (betInput > userBalance) {
                alert('موجودی کافی نیست.');
                return;
            }

            isPlaying = true;
            document.getElementById('drop-btn').disabled = true;

            // کسر موجودی از Supabase
            userBalance -= betInput;
            await supabase.from('users').update({ balance: userBalance }).eq('id', currentUserId);
            await supabase.from('transactions').insert([{
                user_id: currentUserId, type: 'plinko_bet', amount: -betInput, status: 'completed', created_at: new Date().toISOString()
            }]);
            document.getElementById('user-balance').textContent = `$${userBalance.toFixed(2)}`;

            // انیمیشن رهاسازی توپ و تعیین تصادفی جایگاه فرود
            let bx = canvas.width / 2 + (Math.random() - 0.5) * 10;
            let by = 20;
            let targetSlot = Math.floor(Math.random() * multipliers.length);
            let targetX = targetSlot * (canvas.width / multipliers.length) + (canvas.width / multipliers.length) / 2;
            
            let vx = (targetX - bx) / 40;
            let vy = 2;

            function animateBall() {
                drawBoard();
                by += vy;
                bx += vx + (Math.random() - 0.5) * 1.5;

                // رسم توپ
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.arc(bx, by, 7, 0, Math.PI * 2);
                ctx.fill();

                if (by < canvas.height - 45) {
                    requestAnimationFrame(animateBall);
                } else {
                    finishDrop(betInput, targetSlot);
                }
            }

            animateBall();
        };

        async function finishDrop(bet, slot) {
            const mult = multipliers[slot];
            const winAmount = bet * mult;
            userBalance += winAmount;

            await supabase.from('users').update({ balance: userBalance }).eq('id', currentUserId);
            await supabase.from('transactions').insert([{
                user_id: currentUserId, type: 'plinko_win', amount: winAmount, status: 'completed', created_at: new Date().toISOString()
            }]);

            document.getElementById('user-balance').textContent = `$${userBalance.toFixed(2)}`;
            
            // به‌روزرسانی تاریخچه ضریب‌ها
            const lastWinsBox = document.getElementById('last-wins');
            const tag = document.createElement('span');
            tag.className = 'win-tag';
            tag.textContent = mult + 'x';
            lastWinsBox.prepend(tag);
            if (lastWinsBox.children.length > 5) lastWinsBox.lastChild.remove();

            drawBoard();
            isPlaying = false;
            document.getElementById('drop-btn').disabled = false;
        }
    </script>
</body>
</html>
