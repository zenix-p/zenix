    <style>
        :root {
            --felt-green: #075b42;
            --felt-border: #3a2414;
            --gold-accent: #f8d66d;
            --bg-dark: #07100e;
            --glass-border: rgba(255, 239, 190, .25);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-dark);
            color: #fffdf4;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100svh;
            max-width: 500px; /* استاندارد نمایش موبایلی و وب‌اپ برای ابعاد برابر */
            margin: 0 auto;
            position: relative;
            background: #04150f;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        header {
            background: linear-gradient(90deg, rgba(3,12,10,.95), rgba(13,24,20,.8));
            border-bottom: 1px solid rgba(255,222,130,.28);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            flex-shrink: 0;
            height: 44px;
        }
        .game-header-title { 
            font-family: 'Vazirmatn', sans-serif; 
            font-size: 13px; 
            font-weight: 800; 
            color: #ffe7a2; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            text-shadow: 0 2px 7px #000;
        }
        .live-badge { 
            background: rgba(112,18,18,.55); 
            border: 1px solid rgba(255,88,88,.9); 
            color: #ffd6d6; 
            padding: 2px 6px; 
            border-radius: 6px; 
            font-size: 9px; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            gap: 3px; 
        }

        .game-bar {
            background: rgba(5,18,14,.85);
            border-bottom: 1px solid rgba(255,222,130,.18);
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            height: 38px;
            z-index: 90;
        }

        .user-welcome-tag {
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 2px 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-stats { display: flex; align-items: center; gap: 6px; }
        .stat-pill { 
            background: rgba(0,0,0,.42); 
            border: 1px solid rgba(255,226,149,.26); 
            padding: 3px 8px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
        }
        .stat-val { font-family: 'Orbitron', sans-serif; font-weight: 800; color: #ffdc79; font-size: 11px; }
        
        .casino-deposit-btn {
            background: linear-gradient(135deg, #facc15, #f97316);
            color: #0f172a;
            padding: 4px 10px;
            border-radius: 8px;
            border: none;
            font-size: 9.5px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            box-shadow: 0 3px 10px rgba(0,0,0,.24);
        }

            display: flex;
            flex-direction: column;
