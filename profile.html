<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>پروفایل کاربری | ZENIX</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg-primary:#090d16;--bg-card:rgba(20,26,38,0.75);--border-color:rgba(255,255,255,0.08);--accent-gold:#f3ba2f;--accent-green:#0ecb81;--accent-red:#f6465d;--text-main:#f0f4f8;--text-muted:#848e9c;--input-bg:rgba(12,16,24,0.85);--radius-lg:20px;--radius-md:14px;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background-color:var(--bg-primary);color:var(--text-main);min-height:100vh;display:flex;justify-content:center;padding-bottom:90px;background-image:radial-gradient(circle at 50% 0%,rgba(243,186,47,0.05) 0%,transparent 50%);}
.app-container{width:100%;max-width:480px;padding:20px 16px;display:flex;flex-direction:column;gap:18px;}
.header-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--bg-card);backdrop-filter:blur(16px);border:1px solid var(--border-color);border-radius:var(--radius-lg);}
.header-title{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--text-main);}
.header-title i{color:var(--accent-gold);}
.back-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border-color);color:var(--text-main);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;}
.profile-card{background:var(--bg-card);backdrop-filter:blur(16px);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:22px 18px;text-align:center;position:relative;overflow:hidden;}
.profile-avatar-wrap{position:relative;width:84px;height:84px;margin:0 auto 14px;}
.profile-avatar{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,rgba(243,186,47,0.2),rgba(14,203,129,0.1));border:2px solid var(--accent-gold);display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:var(--accent-gold);box-shadow:0 0 20px rgba(243,186,47,0.15);}
.user-fullname{font-size:1.2rem;font-weight:800;color:var(--text-main);margin-bottom:4px;}
.user-id-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.05);border:1px solid var(--border-color);padding:4px 12px;border-radius:20px;font-size:0.8rem;color:var(--text-muted);margin-bottom:12px;}
.account-status-badge{display:inline-flex;align-items:center;gap:6px;font-size:0.75rem;padding:3px 10px;border-radius:8px;background:rgba(14,203,129,0.1);color:var(--accent-green);border:1px solid rgba(14,203,129,0.2);}
.section-card{background:var(--bg-card);backdrop-filter:blur(16px);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:18px;}
.section-title{font-size:0.95rem;font-weight:700;color:var(--text-main);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-title i{color:var(--accent-gold);font-size:1rem;}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:6px;font-weight:500;}
.input-wrapper{position:relative;display:flex;align-items:center;}
.input-wrapper i{position:absolute;right:14px;color:var(--text-muted);font-size:1rem;pointer-events:none;}
.form-input{width:100%;padding:12px 42px 12px 14px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:var(--radius-md);color:var(--text-main);font-size:0.88rem;outline:none;transition:all 0.3s ease;}
.form-input:focus{border-color:var(--accent-gold);box-shadow:0 0 10px rgba(243,186,47,0.15);}
.form-input:disabled{opacity:0.6;cursor:not-allowed;background:rgba(0,0,0,0.2);}
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent-gold),#d4a017);border:none;border-radius:var(--radius-md);color:#000;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
.btn-primary:hover{opacity:0.95;transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0);}
.btn-outline-danger{width:100%;padding:12px;background:rgba(246,70,93,0.1);border:1px solid rgba(246,70,93,0.3);border-radius:var(--radius-md);color:var(--accent-red);font-size:0.9rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-outline-danger:hover{background:rgba(246,70,93,0.2);}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:rgba(12,16,24,0.92);backdrop-filter:blur(20px);border-top:1px solid var(--border-color);display:flex;justify-content:space-around;align-items:center;z-index:1000;max-width:480px;margin:0 auto;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-muted);text-decoration:none;font-size:0.7rem;font-weight:500;transition:all 0.3s ease;}
.nav-item i{font-size:1.2rem;}
.nav-item.active{color:var(--accent-gold);}
.toast-msg{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(20,26,38,0.95);border:1px solid var(--border-color);color:var(--text-main);padding:12px 20px;border-radius:30px;font-size:0.85rem;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.5);display:flex;align-items:center;gap:8px;z-index:2000;transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);pointer-events:none;}
.toast-msg.show{transform:translateX(-50%) translateY(0);}
.toast-msg.success i{color:var(--accent-green);}
.toast-msg.error i{color:var(--accent-red);}
</style>
</head>
<body>

<div id="toast" class="toast-msg"><i class="fa-solid fa-circle-info"></i><span id="toast-text">پیام سیستم</span></div>

<div class="app-container">
    <div class="header-bar">
        <div class="header-title">
            <i class="fa-solid fa-user-gear"></i>
            <span>تنظیمات پروفایل</span>
        </div>
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    </div>

    <div class="profile-card">
        <div class="profile-avatar-wrap">
            <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
        </div>
        <div class="user-fullname" id="user-fullname">در حال بارگذاری...</div>
        <div class="user-id-badge"><i class="fa-regular fa-id-card"></i><span id="user-id">UID: ---</span></div>
        <div>
            <span class="account-status-badge"><i class="fa-solid fa-shield-check"></i> وضعیت حساب: <strong id="account-status">در حال بررسی...</strong></span>
        </div>
    </div>

    <div class="section-card">
        <div class="section-title"><i class="fa-solid fa-mobile-screen"></i><span>شماره موبایل</span></div>
        <form id="phone-form" onsubmit="handleSavePhone(event)">
            <div class="form-group">
                <label class="form-label">شماره همراه (غیرقابل تغییر پس از ثبت)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phone-in" class="form-input" dir="ltr" placeholder="09123456789" required>
                </div>
            </div>
            <button type="submit" id="phone-btn" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i><span>ثبت شماره موبایل</span></button>
        </form>
    </div>

    <div class="section-card">
        <div class="section-title"><i class="fa-solid fa-wallet"></i><span>آدرس‌های ولت کش‌اوت</span></div>
        <form id="wallet-form" onsubmit="handleSaveWallets(event)">
            <div class="form-group">
                <label class="form-label">آدرس TRC20 (TRX / USDT-TRC20)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-coins"></i>
                    <input type="text" id="trx-in" class="form-input" dir="ltr" placeholder="T...">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">آدرس BEP20 (BNB / USDT-BEP20)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-link"></i>
                    <input type="text" id="bep-in" class="form-input" dir="ltr" placeholder="0x...">
                </div>
            </div>
            <button type="submit" id="wallet-btn" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i><span>ذخیره ولت‌ها</span></button>
        </form>
    </div>

    <div class="section-card">
        <div class="section-title"><i class="fa-solid fa-key"></i><span>تغییر کلمه عبور</span></div>
        <form id="pass-form" onsubmit="handleChangePassword(event)">
            <div class="form-group">
                <label class="form-label">کلمه عبور جدید</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="pass-in" class="form-input" dir="ltr" placeholder="حداقل ۶ کاراکتر" required minlength="6">
                </div>
            </div>
            <button type="submit" id="pass-btn" class="btn-primary"><i class="fa-solid fa-key"></i><span>تغییر رمز عبور</span></button>
        </form>
    </div>

    <div class="section-card" style="border-color: rgba(246,70,93,0.2);">
        <button onclick="handleLogout()" class="btn-outline-danger"><i class="fa-solid fa-right-from-bracket"></i><span>خروج از حساب کاربری</span></button>
    </div>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i><span>داشبورد</span></a>
    <a href="deposit.html" class="nav-item"><i class="fa-solid fa-wallet"></i><span>واریز</span></a>
    <a href="withdraw.html" class="nav-item"><i class="fa-solid fa-money-bill-transfer"></i><span>برداشت</span></a>
    <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i><span>پروفایل</span></a>
</nav>

<script>
const SUPABASE_URL = 'https://kslypmnrphzfxpxrswpt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzbHlwbW5ycGh6ZnhweHJzd3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzODU4ODIsImV4cCI6MjA1NTk2MTg4Mn0.O2m8G2A-fIft1G9G_F9eD1R6WfG4Vf30-OIn7y-u1pI';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

function showToast(msg, type='info') {
    const t = document.getElementById('toast');
    const txt = document.getElementById('toast-text');
    txt.textContent = msg;
    t.className = `toast-msg ${type} show`;
    setTimeout(() => { t.className = 'toast-msg'; }, 3500);
}

document.addEventListener('DOMContentLoaded', async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
        window.location.href = 'login.html';
        return;
    }
    currentUser = session.user;
    
    // نام پیش‌فرض بر اساس متادیتا یا ایمیل
    const fullNameEl = document.getElementById('user-fullname');
    if(fullNameEl) fullNameEl.textContent = session.user.user_metadata?.fullname || session.user.user_metadata?.full_name || session.user.email;

    await loadUserData(currentUser);
});

async function loadUserData(user) {
    const { data, error } = await supabaseClient
        .from('users')
        .select('*')
        .eq('id', user.id)
        .single();

    if (data) {
        // ۱. به‌روزرسانی نام و نام خانوادگی از دیتابیس
        const fullNameEl = document.getElementById('user-fullname');
        if (fullNameEl) {
            fullNameEl.textContent = data.full_name || user.user_metadata?.fullname || user.user_metadata?.full_name || user.email;
        }

        const userIdEl = document.getElementById('user-id');
        if (userIdEl) {
            let displayId = data.referral_code || data.id || data.user_id || data.custom_id;
            if (!displayId) {
                let nums = user.id.replace(/\D/g, '');
                if (nums.length < 6) nums = (nums + '482910').substring(0, 6);
                else nums = nums.substring(0, 6);
                displayId = 'MS-' + nums;
            }
            userIdEl.textContent = 'UID: ' + displayId;
        }

        if (data.phone) {
            lockPhoneInput(data.phone);
        }

        const statusEl = document.getElementById('account-status');
        if(statusEl) {
            const isAccountActive = data.verified === true || 
                                   data.status === 'active' || 
                                   data.active === true || 
                                   data.is_activated === true || 
                                   (Number(data.total_deposit) > 0) || 
                                   (Number(data.deposit) > 0) ||
                                   (Number(data.balance) > 0);

            if (isAccountActive) {
                statusEl.textContent = 'فعال';
                statusEl.style.color = '#22c55e';
            } else {
                statusEl.textContent = 'غیرفعال';
                statusEl.style.color = '#ef4444';
            }
        }

        if(data.trx_address) document.getElementById('trx-in').value = data.trx_address;
        if(data.bep20_address) document.getElementById('bep-in').value = data.bep20_address;
    }
}

function lockPhoneInput(phone) {
    const input = document.getElementById('phone-in');
    const btn = document.getElementById('phone-btn');
    input.value = phone;
    input.disabled = true;
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-lock"></i><span>تثبیت شده</span>`;
    btn.style.opacity = '0.5';
}

async function handleSavePhone(e) {
    e.preventDefault();
    if (!currentUser) return;
    const phone = document.getElementById('phone-in').value.trim();
    if(!phone) return;

    const btn = document.getElementById('phone-btn');
    btn.disabled = true;

    const { error } = await supabaseClient
        .from('users')
        .update({ phone: phone })
        .eq('id', currentUser.id);

    if (error) {
        showToast('خطا در ثبت شماره: ' + error.message, 'error');
        btn.disabled = false;
    } else {
        showToast('شماره موبایل با موفقیت ثبت شد', 'success');
        lockPhoneInput(phone);
    }
}

async function handleSaveWallets(e) {
    e.preventDefault();
    if (!currentUser) return;
    const trx = document.getElementById('trx-in').value.trim();
    const bep = document.getElementById('bep-in').value.trim();

    const { error } = await supabaseClient
        .from('users')
        .update({ trx_address: trx, bep20_address: bep })
        .eq('id', currentUser.id);

    if (error) {
        showToast('خطا در ذخیره ولت‌ها: ' + error.message, 'error');
    } else {
        showToast('آدرس‌های ولت به‌روزرسانی شدند', 'success');
    }
}

async function handleChangePassword(e) {
    e.preventDefault();
    const newPass = document.getElementById('pass-in').value;
    if (newPass.length < 6) {
        showToast('رمز عبور باید حداقل ۶ کاراکتر باشد', 'error');
        return;
    }

    const { error } = await supabaseClient.auth.updateUser({ password: newPass });

    if (error) {
        showToast('خطا در تغییر رمز: ' + error.message, 'error');
    } else {
        showToast('رمز عبور با موفقیت تغییر یافت', 'success');
        document.getElementById('pass-in').value = '';
    }
}

async function handleLogout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
}
</script>
</body>
</html>
