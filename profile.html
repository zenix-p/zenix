<!-- پیکربندی و کدهای اختصاصی Supabase -->
    <script>
        const SUPABASE_URL = "https://ujyenmqdgivuxvxptwyl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO";
        
        var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allMessages = [];
        let currentUserId = null;
        let userRealtimeChannel = null; // متغیر برای مدیریت کانال Realtime

        function lockPhoneInput(phoneNumber) {
            const phoneInput = document.getElementById('user-phone-input');
            const saveBtn = document.getElementById('save-phone-btn');
            const dropdownBtn = document.getElementById('c-select-btn');

            if (phoneNumber) {
                let matchedCountry = countries.find(c => phoneNumber.startsWith(c.c));
                if (matchedCountry) {
                    document.getElementById('country-code').value = matchedCountry.c;
                    dropdownBtn.querySelector('span').innerText = `${matchedCountry.f} ${matchedCountry.c}`;
                    phoneInput.value = phoneNumber.replace(matchedCountry.c, '');
                } else {
                    phoneInput.value = phoneNumber;
                }

                phoneInput.readOnly = true;
                phoneInput.disabled = true;
                if (saveBtn) saveBtn.style.display = 'none';
                if (dropdownBtn) {
                    dropdownBtn.style.pointerEvents = 'none';
                    dropdownBtn.style.opacity = '0.6';
                }
            }
        }

        async function fetchUserMessages(uid) {
          try {
            const { data, error } = await supabaseClient
              .from('notifications')
              .select('*')
              .eq('user_id', uid)
              .order('created_at', { ascending: false });

            if (error) throw error;

            return (data || []).map(dt => ({
              id: dt.id,
              subject: dt.title || dt.subject || 'Announcement',
              body: dt.message || dt.text || dt.body || '',
              time: dt.created_at || dt.timestamp || dt.time || new Date().toISOString(),
              read: dt.read === true || dt.is_read === true
            }));
          } catch (e) {
            console.error(e);
            return [];
          }
        }

        window.openMessageModal = async () => {
          let c = document.getElementById('modal-msg-container');
          if (currentUserId) {
            allMessages = await fetchUserMessages(currentUserId);
            let unread = allMessages.filter(m => !m.read).length;
            let b = document.getElementById('bell-badge');
            if (b) { 
              b.textContent = unread; 
              b.classList.toggle('show', unread > 0); 
            }
          }
          if (allMessages.length > 0) {
            renderMessageList();
          } else {
            c.innerHTML = `<div style="text-align:center;padding:20px;color:#94a3b8">هیچ پیام جدیدی از طرف مدیریت وجود ندارد.</div>`;
          }
          document.getElementById('m-msg')?.classList.add('show');
        };

        function renderMessageList() {
          let c = document.getElementById('modal-msg-container');
          let html = '<div style="display:flex;flex-direction:column;gap:10px;">';
          allMessages.forEach((m, idx) => {
            let dTime = '';
            if (m.time) {
              let d = new Date(m.time);
              dTime = isNaN(d.getTime()) ? String(m.time) : d.toUTCString();
            }
            let unread = !m.read;
            html += `<div class="msg-body-box" style="cursor:pointer;border-right:${unread ? '3px solid #38bdf8' : '1px solid rgba(255,255,255,.08)'};" onclick="window.readAdminMessage(${idx})">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div class="msg-title-text" style="${unread ? 'color:#fff;font-weight:800;' : ''}"><i class="fas fa-envelope${unread ? '' : '-open'}-text" style="color:#38bdf8;margin-left:5px;"></i> ${m.subject}</div>
                ${unread ? `<span style="font-size:9px;background:#38bdf8;color:#0f172a;padding:2px 6px;border-radius:4px;font-weight:700;">جدید</span>` : ''}
              </div>
              <div class="msg-desc-text" style="margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${m.body}</div>
              <div style="font-size:10px;color:#64748b;margin-top:6px;text-align:left" dir="ltr">${dTime}</div>
            </div>`;
          });
          c.innerHTML = html + '</div>';
        }

        window.readAdminMessage = async idx => {
          let m = allMessages[idx]; 
          if (!m) return;
          if (!m.read && currentUserId && m.id) {
            allMessages[idx].read = true;
            try {
              await supabaseClient
                .from('notifications')
                .update({ read: true, is_read: true })
                .eq('id', m.id);

              let unread = allMessages.filter(i => !i.read).length;
              let b = document.getElementById('bell-badge');
              if (b) { 
                b.textContent = unread; 
                b.classList.toggle('show', unread > 0); 
              }
            } catch (e) { console.error(e); }
          }
          let c = document.getElementById('modal-msg-container');
          let dTime = '';
          if (m.time) {
            let d = new Date(m.time);
            dTime = isNaN(d.getTime()) ? String(m.time) : d.toUTCString();
          }
          c.innerHTML = `<button onclick="window.openMessageModal()" style="background:none;border:none;color:#38bdf8;cursor:pointer;font-size:12px;margin-bottom:12px;display:flex;align-items:center;gap:5px;padding:0;"><i class="fas fa-arrow-right"></i> بازگشت به لیست پیام‌ها</button>
          <div class="msg-body-box" style="padding:16px;">
            <div class="msg-title-text" style="font-size:15px;margin-bottom:8px;"><i class="fas fa-envelope-open-text" style="color:#38bdf8;"></i> ${m.subject}</div>
            <div class="msg-desc-text" style="font-size:13px;line-height:1.8;color:#f8fafc;white-space:pre-wrap;">${m.body}</div>
            <div style="font-size:11px;color:#64748b;margin-top:14px;text-align:left;border-top:1px solid rgba(255,255,255,.05);padding-top:8px;" dir="ltr">${dTime}</div>
          </div>`;
        };

        window.closeMessageModal = () => {
          document.getElementById('m-msg')?.classList.remove('show');
        };

        window.sendEmailCode = async function(emailInputId, btnEl) {
          const emailInput = document.getElementById(emailInputId);
          const email = emailInput && emailInput.value ? emailInput.value.trim() : (currentUser ? currentUser.email : '');

          if (!email || !email.includes('@')) {
            alert('لطفاً یک ایمیل معتبر وارد کنید.');
            return;
          }

          const origText = btnEl ? btnEl.textContent : 'ارسال کد به ایمیل';

          try {
            if (btnEl) {
              btnEl.disabled = true;
              btnEl.textContent = 'در حال ارسال...';
            }

            const otpCode = Math.floor(100000 + Math.random() * 900000).toString();

            await emailjs.send('service_tdvuyju', 'template_bmrp41l', {
              to_email: email,
              email: email,
              otp_code: otpCode,
              code: otpCode,
              otp: otpCode,
              passcode: otpCode,
              verification_code: otpCode,
              message: otpCode
            });

            if (currentUser) {
              await supabaseClient
                .from('users')
                .update({ 
                  active_otp: otpCode, 
                  otp_created_at: new Date().toISOString()
                })
                .eq('id', currentUser.id);
            }

            alert(`کد تایید به ایمیل ${email} ارسال شد.\n(کد تست جهت اطمینان: ${otpCode})`);

            if (btnEl) {
              let countdown = 60;
              btnEl.textContent = `${countdown} ثانیه`;
              const timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                  clearInterval(timer);
                  btnEl.disabled = false;
                  btnEl.textContent = origText;
                } else {
                  btnEl.textContent = `${countdown} ثانیه`;
                }
              }, 1000);
            }
          } catch (error) {
            if (btnEl) {
              btnEl.disabled = false;
              btnEl.textContent = origText;
            }
            console.error('خطا در ارسال EmailJS:', error);
            alert('خطا در ارسال ایمیل. لطفاً مجدداً تلاش کنید.');
          }
        };

        async function loadUserData(user) {
          const { data, error } = await supabaseClient
            .from('users')
            .select('*')
            .eq('id', user.id)
            .single();

          if (data) {
            const fullNameEl = document.getElementById('user-fullname');
            if (fullNameEl && (data.fullname || data.full_name)) {
                fullNameEl.textContent = data.fullname || data.full_name;
            }

            const userIdEl = document.getElementById('user-id');
            if (userIdEl) {
                let displayId = data.referral_code || data.id || data.user_id || data.custom_id;
                if (!displayId) {
                    let nums = user.id.replace(/\D/g, '');
                    if (nums.length < 6) nums = (nums + '482910').substring(0, 6);
                    else nums = nums.substring(0, 6);
                    displayId = 'MS-' + nums;
                }
                userIdEl.textContent = 'UID: ' + displayId;
            }

            if (data.phone) {
                lockPhoneInput(data.phone);
            }

            const statusEl = document.getElementById('account-status');
            if(statusEl) {
                const isAccountActive = data.verified === true || 
                                       data.status === 'active' || 
                                       data.active === true || 
                                       data.is_activated === true || 
                                       (Number(data.total_deposit) > 0) || 
                                       (Number(data.deposit) > 0) ||
                                       (Number(data.balance) > 0);

                if (isAccountActive) {
                    statusEl.textContent = 'فعال';
                    statusEl.style.color = '#22c55e';
                } else {
                    statusEl.textContent = 'غیرفعال';
                    statusEl.style.color = '#ef4444';
                }
            }

            if(data.trx_address) document.getElementById('trx-in').value = data.trx_address;
            if(data.bep20_address) document.getElementById('bep-in').value = data.bep20_address;
          }
        }

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
          if (session && session.user) {
            currentUser = session.user;
            currentUserId = session.user.id;

            allMessages = await fetchUserMessages(session.user.id);
            let unread = allMessages.filter(m => !m.read).length;
            let b = document.getElementById('bell-badge');
            if (b) { 
                b.textContent = unread; 
                b.classList.toggle('show', unread > 0); 
            }

            ['email-curr', 'pwd-email', 'tr-email', 'wal-email'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = session.user.email || '';
            });

            const fullNameEl = document.getElementById('user-fullname');
            if (fullNameEl) {
                fullNameEl.textContent = session.user.user_metadata?.fullname || 
                                         session.user.user_metadata?.full_name || 
                                         session.user.email;
            }

            await loadUserData(session.user);

            // حذف کانال قبلی در صورت وجود برای جلوگیری از خطای Re-subscription
            if (userRealtimeChannel) {
              supabaseClient.removeChannel(userRealtimeChannel);
            }

            userRealtimeChannel = supabaseClient
              .channel('user_realtime_' + session.user.id)
              .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'users', filter: `id=eq.${session.user.id}` }, payload => {
                loadUserData(session.user);
              })
              .subscribe();

          } else {
            window.location.href = "index.html";
          }
        });

        // اکشن ذخیره‌سازی شماره تماس
        window.savePhone = async function() {
          const phoneInput = document.getElementById('user-phone-input');
          const errEl = document.getElementById('phone-err-msg');
          const succEl = document.getElementById('phone-success');
          const saveBtn = document.getElementById('save-phone-btn');

          let phone = phoneInput ? phoneInput.value.trim() : '';

          if (phone.startsWith('0')) {
            phone = phone.substring(1);
            phoneInput.value = phone;
          }

          let code = document.getElementById('country-code').value;
          if (!code) {
            code = '+98';
            document.getElementById('country-code').value = '+98';
            const dropdownBtn = document.getElementById('c-select-btn');
            if (dropdownBtn && dropdownBtn.querySelector('span')) {
              dropdownBtn.querySelector('span').innerText = '🇮🇷 +98';
            }
          }

          if (!currentUser) {
            alert('خطا: نشست کاری شما یافت نشد. لطفاً مجدداً وارد شوید.');
            return;
          }

          if (phone.length === 10 && /^\d+$/.test(phone)) {
            if (saveBtn) {
              saveBtn.disabled = true;
              saveBtn.innerText = 'در حال ذخیره‌سازی...';
            }

            const fullPhone = code + phone;

            try {
              let { data, error } = await supabaseClient
                .from('users')
                .update({ phone: fullPhone })
                .eq('id', currentUser.id)
                .select();

              if (!error && (!data || data.length === 0)) {
                const upsertRes = await supabaseClient
                  .from('users')
                  .upsert({ 
                    id: currentUser.id, 
                    phone: fullPhone,
                    email: currentUser.email 
                  }, { onConflict: 'id' });
                error = upsertRes.error;
              }

              if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.innerText = 'ذخیره';
              }

              if (!error) {
                if (succEl) succEl.style.display = 'block';
                if (errEl) errEl.style.display = 'none';
                lockPhoneInput(fullPhone);
                alert('شماره تماس با موفقیت ذخیره شد.');
              } else {
                console.error('خطای دیتابیس سوپابیس:', error);
                const errMsg = error.message || error.details || 'عدم دسترسی ویرایش به دیتابیس';
                if (errEl) {
                  errEl.textContent = 'خطا: ' + errMsg;
                  errEl.style.display = 'block';
                }
                alert('خطای ذخیره‌سازی سوپابیس:\n' + errMsg);
              }
            } catch (e) {
              if (saveBtn) {
                saveBtn.disabled = false;
                saveBtn.innerText = 'ذخیره';
              }
              alert('خطای غیرمنتظره: ' + e.message);
            }
          } else {
            if (errEl) {
              errEl.textContent = 'شماره باید ۱۰ رقم و بدون صفر باشد (مثال: 9123456789)';
              errEl.style.display = 'block';
            }
          }
        };

        window.requestAdminPermission = function() {
          document.getElementById('selfie-capture').click();
        };

        window.handleSelfieCapture = function(input) {
          if (input.files && input.files[0]) {
            document.getElementById('admin-status-box').style.display = 'block';
          }
        };

        window.validatePasswordForm = function(btn) {
          document.getElementById('pwd-success').style.display = 'block';
        };

        window.validateTxForm = function(btn) {
          document.getElementById('tr-success').style.display = 'block';
        };

        window.verifyWalletCode = function(btn) {
          alert('کد تایید با موفقیت تایید شد.');
        };

        window.saveWalletForm = async function(btn) {
          const trx = document.getElementById('trx-in').value.trim();
          const bep = document.getElementById('bep-in').value.trim();
          if (currentUser) {
            const { error } = await supabaseClient
              .from('users')
              .update({ trx_address: trx, bep20_address: bep })
              .eq('id', currentUser.id);

            if (!error) {
              document.getElementById('wal-success').style.display = 'block';
            }
          }
        };

        window.closeHelpModal = () => document.getElementById('m-help').classList.remove('show');

        document.getElementById('help-btn').onclick = () => document.getElementById('m-help').classList.add('show');
        document.getElementById('bell-btn').onclick = (e) => {
            e.stopPropagation();
            window.openMessageModal();
        };
        document.getElementById('menu-btn').onclick = () => document.getElementById('nav-menu').classList.toggle('show');
        document.getElementById('lang-btn').onclick = () => document.getElementById('lang-menu').classList.toggle('show');
        document.getElementById('logout-btn').onclick = async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        };
    </script>
