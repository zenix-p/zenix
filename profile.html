<script>
const SUPABASE_URL = 'https://kslypmnrphzfxpxrswpt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzbHlwbW5ycGh6ZnhweHJzd3B0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzODU4ODIsImV4cCI6MjA1NTk2MTg4Mn0.O2m8G2A-fIft1G9G_F9eD1R6WfG4Vf30-OIn7y-u1pI';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

function showToast(msg, type='info') {
    const t = document.getElementById('toast');
    const txt = document.getElementById('toast-text');
    if(!t || !txt) return;
    txt.textContent = msg;
    t.className = `toast-msg ${type} show`;
    setTimeout(() => { t.className = 'toast-msg'; }, 3500);
}

document.addEventListener('DOMContentLoaded', async () => {
    try {
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError || !session) {
            window.location.href = 'login.html';
            return;
        }
        currentUser = session.user;
        
        // نام پیش‌فرض بر اساس متادیتا یا ایمیل
        const fullNameEl = document.getElementById('user-fullname');
        if(fullNameEl) {
            fullNameEl.textContent = currentUser.user_metadata?.fullname || currentUser.user_metadata?.full_name || currentUser.email;
        }

        await loadUserData(currentUser);
    } catch (err) {
        console.error('Init error:', err);
    }
});

async function loadUserData(user) {
    try {
        // استفاده از maybeSingle برای جلوگیری از ارور در صورت نبود رکورد
        const { data, error } = await supabaseClient
            .from('users')
            .select('*')
            .eq('id', user.id)
            .maybeSingle();

        if (error) {
            console.warn('DB Fetch Warning:', error.message);
            return;
        }

        if (data) {
            const fullNameEl = document.getElementById('user-fullname');
            if (fullNameEl) {
                fullNameEl.textContent = data.full_name || user.user_metadata?.fullname || user.user_metadata?.full_name || user.email;
            }

            const userIdEl = document.getElementById('user-id');
            if (userIdEl) {
                let displayId = data.referral_code || data.id || data.user_id || data.custom_id;
                if (!displayId) {
                    let nums = user.id.replace(/\D/g, '');
                    if (nums.length < 6) nums = (nums + '482910').substring(0, 6);
                    else nums = nums.substring(0, 6);
                    displayId = 'MS-' + nums;
                }
                userIdEl.textContent = 'UID: ' + displayId;
            }

            if (data.phone) {
                lockPhoneInput(data.phone);
            }

            const statusEl = document.getElementById('account-status');
            if(statusEl) {
                const isAccountActive = data.verified === true || 
                                       data.status === 'active' || 
                                       data.active === true || 
                                       data.is_activated === true || 
                                       (Number(data.total_deposit) > 0) || 
                                       (Number(data.deposit) > 0) ||
                                       (Number(data.balance) > 0);

                if (isAccountActive) {
                    statusEl.textContent = 'فعال';
                    statusEl.style.color = '#22c55e';
                } else {
                    statusEl.textContent = 'غیرفعال';
                    statusEl.style.color = '#ef4444';
                }
            }

            if(data.trx_address && document.getElementById('trx-in')) document.getElementById('trx-in').value = data.trx_address;
            if(data.bep20_address && document.getElementById('bep-in')) document.getElementById('bep-in').value = data.bep20_address;
        }
    } catch (err) {
        console.error('loadUserData error:', err);
    }
}

function lockPhoneInput(phone) {
    const input = document.getElementById('phone-in');
    const btn = document.getElementById('phone-btn');
    if(!input || !btn) return;
    input.value = phone;
    input.disabled = true;
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-lock"></i><span>تثبیت شده</span>`;
    btn.style.opacity = '0.5';
}

async function handleSavePhone(e) {
    e.preventDefault();
    if (!currentUser) return;
    const phoneInput = document.getElementById('phone-in');
    if(!phoneInput) return;
    const phone = phoneInput.value.trim();
    if(!phone) return;

    const btn = document.getElementById('phone-btn');
    btn.disabled = true;

    const { error } = await supabaseClient
        .from('users')
        .update({ phone: phone })
        .eq('id', currentUser.id);

    if (error) {
        showToast('خطا در ثبت شماره: ' + error.message, 'error');
        btn.disabled = false;
    } else {
        showToast('شماره موبایل با موفقیت ثبت شد', 'success');
        lockPhoneInput(phone);
    }
}

async function handleSaveWallets(e) {
    e.preventDefault();
    if (!currentUser) return;
    const trx = document.getElementById('trx-in')?.value.trim() || '';
    const bep = document.getElementById('bep-in')?.value.trim() || '';

    const { error } = await supabaseClient
        .from('users')
        .update({ trx_address: trx, bep20_address: bep })
        .eq('id', currentUser.id);

    if (error) {
        showToast('خطا در ذخیره ولت‌ها: ' + error.message, 'error');
    } else {
        showToast('آدرس‌های ولت به‌روزرسانی شدند', 'success');
    }
}

async function handleChangePassword(e) {
    e.preventDefault();
    const passInput = document.getElementById('pass-in');
    if(!passInput) return;
    const newPass = passInput.value;
    if (newPass.length < 6) {
        showToast('رمز عبور باید حداقل ۶ کاراکتر باشد', 'error');
        return;
    }

    const { error } = await supabaseClient.auth.updateUser({ password: newPass });

    if (error) {
        showToast('خطا در تغییر رمز: ' + error.message, 'error');
    } else {
        showToast('رمز عبور با موفقیت تغییر یافت', 'success');
        passInput.value = '';
    }
}

async function handleLogout() {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
}
</script>
