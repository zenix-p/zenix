<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - پشتیبانی هوشمند پلتفرم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo h2{font-size:18px;color:#38bdf8;font-weight:800}
        .header-actions{display:flex;gap:8px;align-items:center}
        .back-btn, .clear-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#38bdf8;text-decoration:none}
        .clear-btn{color:#ef4444;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.1)}
        .clear-btn:hover{background:rgba(239,68,68,.2)}
        .c{max-width:700px;width:100%;margin:20px auto;padding:0 12px;flex:1;display:flex;flex-direction:column}
        .chat-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:16px;display:flex;flex-direction:column;height:540px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8)}
        .chat-header{background:rgba(30,41,59,.9);padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
        .chat-avatar{width:36px;height:36px;background:rgba(56,189,248,.2);border:1px solid #38bdf8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:16px}
        .chat-title h3{font-size:14px;color:#f8fafc}
        .chat-title p{font-size:10px;color:#22c55e;display:flex;align-items:center;gap:4px}
        .chat-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
        .msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.7}
        .msg.bot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;align-self:flex-start;border-top-right-radius:2px}
        .msg.admin{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;align-self:flex-start;border-top-right-radius:2px}
        .msg.user{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8;align-self:flex-end;border-top-left-radius:2px}
        .typing-indicator{display:flex;gap:4px;padding:4px 8px;align-items:center}
        .typing-dot{width:6px;height:6px;background:#38bdf8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
        .typing-dot:nth-child(1){animation-delay:-0.32s}.typing-dot:nth-child(2){animation-delay:-0.16s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.0)}}
        .options-container{display:flex;flex-direction:column;gap:8px;margin-top:10px}
        .opt-btn{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:9px 12px;border-radius:8px;font-size:12px;cursor:pointer;text-align:right;transition:all .3s ease;display:flex;align-items:center;gap:8px}
        .opt-btn:hover{background:rgba(56,189,248,.25);border-color:#38bdf8}
        .chat-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1);background:rgba(15,23,42,.9);display:flex;gap:8px}
        .chat-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;color:#fff;font-size:12px;outline:none}
        .chat-input:focus{border-color:#38bdf8}
        .send-btn{background:#38bdf8;color:#030712;border:none;border-radius:10px;width:40px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
        footer{text-align:center;padding:12px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}
    </style>
</head>
<body>
    <header>
        <div class="logo"><h2>ZENIX AI SUPPORT</h2></div>
        <div class="header-actions">
            <button class="clear-btn" onclick="clearChatHistory()" title="پاک کردن حافظه چت"><i class="fas fa-trash-alt"></i> پاک کردن چت</button>
            <a href="#" class="back-btn" onclick="goBack(event)"><i class="fas fa-arrow-right"></i> بازگشت</a>
        </div>
    </header>
    <div class="c">
        <div class="chat-box">
            <div class="chat-header">
                <div class="chat-avatar"><i class="fas fa-brain"></i></div>
                <div class="chat-title">
                    <h3 id="support-status-title">پشتیبانی آنلاین زنیکس</h3>
                    <p><i class="fas fa-circle" style="font-size:6px;"></i> <span id="support-status-sub">آنلاین و پاسخگوی سوالات شما</span></p>
                </div>
            </div>
            <div class="chat-body" id="chat-body"></div>
            <div class="chat-footer">
                <input type="text" class="chat-input" id="user-input" placeholder="سوال خود را بنویسید...">
                <button class="send-btn" id="send-msg-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 Zenix. All rights reserved.</p></footer>

    <script>
        const chatBody = document.getElementById('chat-body');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-msg-btn');

        let currentUser = null;
        let isConnectedToAdmin = false;

        window.goBack = function(event) {
            if (event) event.preventDefault();
            if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.replace('quantification.html');
            }
        };

        loadChatHistory();

        function saveMessageToStorage(text, sender) {
            try {
                let history = JSON.parse(localStorage.getItem('zenix_chat_history')) || [];
                history.push({ text, sender });
                localStorage.setItem('zenix_chat_history', JSON.stringify(history));
            } catch (e) {
                console.error("Storage error:", e);
            }
        }

        function loadChatHistory() {
            let history = [];
            try {
                history = JSON.parse(localStorage.getItem('zenix_chat_history')) || [];
            } catch (e) {
                history = [];
                localStorage.removeItem('zenix_chat_history');
            }

            if (history.length === 0) {
                const initialMsg = `سلام، وقت بخیر! 👋<br>به پشتیبانی پلتفرم <strong>Zenix</strong> خوش آمدید. چطور می‌توانم کمکتان کنم؟`;
                addMessage(initialMsg, 'bot', false);
            } else {
                chatBody.innerHTML = '';
                history.forEach(item => {
                    addMessage(item.text, item.sender, false);
                });
            }
        }

        window.clearChatHistory = function() {
            if(confirm('آیا مطمئن هستید که می‌خواهید تاریخچه چت را پاک کنید؟')) {
                localStorage.removeItem('zenix_chat_history');
                chatBody.innerHTML = '';
                isConnectedToAdmin = false;
                document.getElementById('support-status-title').innerText = "پشتیبانی آنلاین زنیکس";
                document.getElementById('support-status-sub').innerText = "آنلاین و پاسخگوی سوالات شما";
                loadChatHistory();
            }
        };

        function addMessage(text, sender, save = true) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerHTML = text;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;

            if (save) {
                saveMessageToStorage(text, sender);
            }
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'msg bot typing-msg';
            div.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        window.connectToAdmin = async function() {
            let userId = currentUser ? currentUser.uid : (localStorage.getItem('zenix_guest_uid') || 'guest_' + Math.random().toString(36).substring(2, 9));
            if (!currentUser && !localStorage.getItem('zenix_guest_uid')) {
                localStorage.setItem('zenix_guest_uid', userId);
            }

            addMessage('درخواست ارجاع به مدیریت ثبت شد...', 'user', true);
            const typingElem = showTypingIndicator();

            setTimeout(() => {
                typingElem.remove();
                isConnectedToAdmin = true;

                document.getElementById('support-status-title').innerText = "پشتیبانی مستقیم (مدیریت)";
                document.getElementById('support-status-sub').innerText = "متصل به مدیریت - در انتظار پاسخ";

                addMessage(`پیام شما به مدیریت ارسال شد. لطفاً منتظر پاسخ بمانید. هر پیامی بنویسید مستقیماً برای مدیریت ارسال می‌شود.`, 'bot', true);
            }, 500);
        };

        function sendDirectToAdmin(text) {
            let userId = currentUser ? currentUser.uid : localStorage.getItem('zenix_guest_uid');
            if(!userId) return;
        }

        function processAIResponse(question) {
            if (isConnectedToAdmin) {
                sendDirectToAdmin(question);
                return;
            }

            const typingElem = showTypingIndicator();
            
            setTimeout(() => {
                typingElem.remove();
                let reply = "";
                const q = question.toLowerCase().trim();

                const isGreeting = (q === 'سلام' || q === 'درود' || q === 'سلام علیکم' || q === 'خسته نباشید' || q === 'شب بخیر' || q === 'روز بخیر' || q === 'سلام وقت بخیر');

                if (isGreeting) {
                    reply = `سلام و وقت بخیر! 👋 در خدمتم، چه کمکی از دستم برمی‌آید؟`;
                }
                else if ((q.includes('کد') || q.includes('تایید') || q.includes('نیامده') || q.includes('نیومده') || q.includes('دریافت نکردم') || q.includes('اسپم')) && (q.includes('ایمیل') || q.includes('جمیل') || q.includes('gmail') || q.includes('email'))) {
                    reply = `اگر کد یا لینک تایید به ایمیل‌تان ارسال نشده، لطفاً موارد زیر را چک کنید:<br><br>
                    ۱. پوشه <strong>Spam / Junk</strong> (هرزنامه) ایمیل خود را بررسی کنید.<br>
                    ۲. مطمئن شوید املای آدرس ایمیل را دقیق وارد کرده‌اید.<br>
                    ۳. حدود ۱ تا ۲ دقیقه شکیبا باشید و سپس مجدداً روی دکمه «ارسال مجدد کد» کلیک کنید.<br><br>
                    جهت راهنمایی بیشتر به مدیریت مراجعه کنید:
                    <div class="options-container">
                        <button class="opt-btn" style="border-color:#ef4444;color:#ef4444;" onclick="connectToAdmin()"><i class="fas fa-headset"></i> ارجاع به مدیریت</button>
                    </div>`;
                }
                else if ((q.includes('تغییر') || q.includes('عوض') || q.includes('ویرایش') || q.includes('جایگزین')) && (q.includes('ایمیل') || q.includes('جمیل') || q.includes('gmail') || q.includes('email'))) {
                    reply = `برای تغییر آدرس ایمیل (جمیل) حساب کاربری خود:<br><br>
                    ۱. وارد پنل کاربری شوید و از منو به بخش <strong>تنظیمات / پروفایل</strong> مراجعه کنید.<br>
                    ۲. در بخش اطلاعات کاربری، روی ویرایش ایمیل کلیک کرده و ایمیل جدید را وارد کنید.<br>
                    ۳. کد تاییدی که به ایمیل جدید ارسال می‌شود را ثبت کنید تا تغییرات ذخیره شود.`;
                }
                else if ((q.includes('فراموش') || q.includes('دسترسی ندارم') || q.includes('یادم رفته') || q.includes('گم')) && (q.includes('ایمیل') || q.includes('جمیل') || q.includes('gmail') || q.includes('email'))) {
                    reply = `جهت راهنمایی بیشتر به مدیریت مراجعه کنید:
                    <div class="options-container">
                        <button class="opt-btn" style="border-color:#ef4444;color:#ef4444;" onclick="connectToAdmin()"><i class="fas fa-headset"></i> ارجاع به مدیریت</button>
                    </div>`;
                }
                else if ((q.includes('تکراری') || q.includes('موجود') || q.includes('قبلا ثبت شده')) && (q.includes('ایمیل') || q.includes('جمیل') || q.includes('gmail') || q.includes('email'))) {
                    reply = `پیغام «ایمیل تکراری است» یعنی قبلاً با این جمیل در Zenix حساب ساخته شده است.<br><br>
                    • اگر این حساب متعلق به خودتان است، از صفحه <strong>ورود</strong> استفاده کنید.<br>
                    • اگر رمز عبور آن را فراموش کرده‌اید، گزینه <strong>فراموشی رمز عبور</strong> را بزنید تا بازیابی شود.<br>
                    • در غیر این صورت برای ساخت حساب جدید باید از یک آدرس ایمیل متفاوت استفاده کنید.`;
                }
                else if ((q.includes('ورود') || q.includes('لاگین') || q.includes('گوگل')) && (q.includes('جمیل') || q.includes('gmail') || q.includes('google'))) {
                    reply = `ورود به پلتفرم از طریق ایمیل (جمیل) و رمز عبوری که در هنگام ثبت‌نام تعیین کرده‌اید انجام می‌شود.<br>
                    کافی است در صفحه اصلی ورود، ایمیل و پسورد خود را به همراه کد امنیتی وارد کنید تا وارد حساب شوید.`;
                }
                else if (q.includes('رمز') || q.includes('پسورد') || q.includes('password')) {
                    reply = `برای تغییر یا بازیابی رمز عبور:<br><br>
                    ۱. اگر رمز فعلی را می‌دانید، از بخش <strong>پروفایل</strong> در پنل کاربری اقدام به تغییر آن کنید.<br>
                    ۲. اگر رمز را فراموش کرده‌اید، در صفحه ورود روی گزینه <strong>فراموشی رمز عبور</strong> کلیک کنید تا لینک بازنشانی به ایمیلتان ارسال شود.`;
                }
                else if (q.includes('واریز') || q.includes('شارژ') || q.includes('deposit') || q.includes('پول ریختن')) {
                    reply = `برای واریز و شارژ حساب:<br><br>
                    ۱. به بخش <strong>واریز</strong> در پنل کاربری بروید.<br>
                    ۲. آدرس کیف پول و شبکه مورد نظر را کپی کرده و مبلغ را منتقل کنید.<br>
                    ۳. کد هش تراکنش (TxID) را در فرم مربوطه وارد کنید تا حساب شما شارژ شود.`;
                } 
                else if (q.includes('برداشت') || q.includes('نقد') || q.includes('withdraw') || q.includes('تسویه')) {
                    reply = `برای برداشت دارایی:<br><br>
                    وارد بخش <strong>برداشت</strong> شوید، آدرس کیف پول مقصد و مبلغ را وارد کرده و درخواست را ثبت کنید. درخواست‌ها پس از تایید سیستم در سریع‌ترین زمان به کیف پول شما منتقل می‌شوند.`;
                } 
                else if (q.includes('کوانتیفیکیشن') || q.includes('ربات') || q.includes('سود') || q.includes('quantification') || q.includes('ترید')) {
                    reply = `سیستم <strong>کوانتیفیکیشن (Quantification)</strong> ربات هوشمند معاملاتی است.<br>
                    با فعال‌سازی این بخش، ربات با تحلیل نوسانات بازار به صورت خودکار ترید کرده و سود روزانه را به موجودی حساب شما می‌افزاید.`;
                } 
                else if (q.includes('تیم') || q.includes('زیرمجموعه') || q.includes('رفرال') || q.includes('دعوت')) {
                    reply = `از بخش <strong>تیم / دعوت</strong> می‌توانید لینک اختصاصی خود را کپی کنید.<br>
                    با دعوت دوستانتان به Zenix، از فعالیت‌ها و تراکنش‌های آن‌ها در سطوح مختلف پاداش و کمیسیون دریافت می‌کنید.`;
                }
                else if (q.includes('مدیر') || q.includes('اپراتور') || q.includes('پشتیبان') || q.includes('انسان') || q.includes('ادمین')) {
                    window.connectToAdmin();
                    return;
                }
                else {
                    reply = `جهت راهنمایی بیشتر به مدیریت مراجعه کنید.
                    <div class="options-container">
                        <button class="opt-btn" style="border-color:#ef4444;color:#ef4444;" onclick="connectToAdmin()"><i class="fas fa-headset"></i> ارجاع به مدیریت</button>
                    </div>`;
                }

                addMessage(reply, 'bot', true);
            }, 700);
        }

        sendBtn.onclick = () => {
            const val = userInput.value.trim();
            if(!val) return;
            addMessage(val, 'user', true);
            userInput.value = '';
            processAIResponse(val);
        };

        userInput.onkeypress = (e) => {
            if(e.key === 'Enter') sendBtn.click();
        };
    </script>
</body>
</html>
