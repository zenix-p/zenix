<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - پشتیبانی هوشمند پلتفرم</title>
    <link rel="stylesheet" href="https://cdnjs.loli.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo h2{font-size:18px;color:#38bdf8;font-weight:800}
        .header-actions{display:flex;gap:8px;align-items:center}
        .back-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#38bdf8;text-decoration:none;font-family:inherit}
        .c{max-width:700px;width:100%;margin:20px auto;padding:0 12px;flex:1;display:flex;flex-direction:column;gap:12px}

        .view-section{display:flex;flex-direction:column;gap:12px}

        /* ═══════════════════════════════════════════════════ */
        /* صفحه اول — انتخاب موضوع */
        /* ═══════════════════════════════════════════════════ */
        .topics-section{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.8)}
        .topics-intro{text-align:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
        .topics-intro h2{font-size:16px;color:#38bdf8;font-weight:800;margin-bottom:6px}
        .topics-intro p{font-size:12px;color:#94a3b8;line-height:1.6}
        .topics-title{font-size:13px;color:#38bdf8;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .topics-title i{font-size:15px}
        .topics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
        .topic-card{background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#cbd5e1;cursor:pointer;transition:all .25s ease;min-height:95px;font-family:inherit;position:relative;overflow:hidden}
        .topic-card:hover{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.5);transform:translateY(-2px);box-shadow:0 6px 20px rgba(14,165,233,.2);color:#38bdf8}
        .topic-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
        .topic-label{font-size:11.5px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
        .topic-desc{font-size:9px;color:#64748b;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

        .ni-blue{background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3)}
        .ni-purple{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.3)}
        .ni-green{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3)}
        .ni-yellow{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
        .ni-pink{background:rgba(236,72,153,.15);color:#ec4899;border:1px solid rgba(236,72,153,.3)}
        .ni-cyan{background:rgba(6,182,212,.15);color:#06b6d4;border:1px solid rgba(6,182,212,.3)}
        .ni-rose{background:rgba(244,63,94,.15);color:#f43f5e;border:1px solid rgba(244,63,94,.3)}
        .ni-emerald{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
        .ni-amber{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}

        /* ═══════════════════════════════════════════════════ */
        /* صفحه دوم — چت با کارشناس */
        /* ═══════════════════════════════════════════════════ */
        .chat-view-header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
        .change-topic-btn{background:rgba(148,163,184,.15);border:1px solid rgba(148,163,184,.3);color:#cbd5e1;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .2s}
        .change-topic-btn:hover{background:rgba(148,163,184,.25);color:#fff}
        .conversation-id-badge{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:8px 12px;border-radius:8px;font-size:11px;display:flex;align-items:center;gap:6px}
        .conversation-id-badge strong{font-family:'Courier New',monospace;font-weight:900;letter-spacing:1px;font-size:12px}

        .chat-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:16px;display:flex;flex-direction:column;height:520px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8)}
        .chat-header{background:rgba(30,41,59,.9);padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
        .chat-avatar{width:38px;height:38px;background:rgba(56,189,248,.15);border:1px solid #38bdf8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:16px;flex-shrink:0;transition:all .3s}
        .chat-avatar.expert{border-color:#22c55e;background:rgba(34,197,94,.15);color:#22c55e}
        .chat-title{flex:1;min-width:0}
        .chat-title h3{font-size:13.5px;color:#f8fafc;margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        .chat-title h3 .expert-name{font-weight:800}
        .chat-title h3 .expert-role{font-size:11px;color:#94a3b8;font-weight:500}
        .chat-title p{font-size:10px;display:flex;align-items:center;gap:5px}

        .chat-body{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}

        .msg{max-width:85%;padding:9px 13px;border-radius:12px;font-size:12px;line-height:1.7;word-wrap:break-word}
        .msg.system{background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.25);color:#cbd5e1;align-self:center;text-align:center;font-size:11px;max-width:90%}
        .msg.system.code-msg{background:rgba(168,85,247,.15);border:1.5px solid rgba(168,85,247,.5);color:#e0c7ff;font-size:13px;max-width:95%;white-space:pre-line;line-height:1.9;box-shadow:0 0 20px rgba(168,85,247,.2);min-width:220px}
        .otp-code-display{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
        .otp-code-text{font-size:24px;font-weight:900;letter-spacing:4px;color:#fff;font-family:'Courier New',monospace;direction:ltr;text-shadow:0 0 12px rgba(255,255,255,.3)}
        .copy-otp-btn{background:rgba(168,85,247,.35);border:1px solid rgba(168,85,247,.7);color:#e0c7ff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s;display:flex;align-items:center;justify-content:center;min-width:34px;height:34px}
        .copy-otp-btn:hover{background:rgba(168,85,247,.55);color:#fff}
        .copy-otp-btn.copied{background:rgba(34,197,94,.4);border-color:rgba(34,197,94,.7)}
        .otp-timer-row{font-size:11px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
        .otp-timer-val{color:#fbbf24;font-weight:bold;font-family:monospace}
        .msg.bot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;align-self:flex-start;border-top-right-radius:2px}
        .msg.admin{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;align-self:flex-start;border-top-right-radius:2px}
        .msg.user{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8;align-self:flex-end;border-top-left-radius:2px}
        .msg-meta{font-size:9px;opacity:0.6;margin-top:4px;display:block}
        .msg-sender{font-size:9px;opacity:0.7;margin-bottom:2px;font-weight:700}
        .typing-indicator{display:flex;gap:4px;padding:4px 8px;align-items:center}
        .typing-dot{width:6px;height:6px;background:#38bdf8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
        .typing-dot:nth-child(1){animation-delay:-0.32s}.typing-dot:nth-child(2){animation-delay:-0.16s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.0)}}
        .quick-replies{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:flex-end}
        .quick-reply-btn{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:7px 11px;border-radius:8px;font-size:11px;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
        .quick-reply-btn:hover{background:rgba(56,189,248,.25);border-color:#38bdf8}
        .quick-reply-btn.admin-link{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171}
        .quick-reply-btn.admin-link:hover{background:rgba(239,68,68,.25)}
        .chat-footer{padding:10px 12px;border-top:1px solid rgba(255,255,255,.1);background:rgba(15,23,42,.9);display:flex;gap:8px}
        .chat-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;color:#fff;font-size:12px;outline:none}
        .chat-input:focus{border-color:#38bdf8}
        .chat-input:disabled{opacity:.5;cursor:not-allowed}
        .send-btn{background:#38bdf8;color:#030712;border:none;border-radius:10px;width:40px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
        .send-btn:disabled{background:#475569;cursor:not-allowed}

        .error-banner{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#f87171;padding:12px;border-radius:10px;font-size:12px;display:none}
        .error-banner.show{display:block}
        footer{text-align:center;padding:12px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}

        @media (max-width: 480px) {
            .chat-box{height:460px;border-radius:14px}
            .chat-header{padding:10px 12px}
            .chat-title h3{font-size:12px}
            .chat-title h3 .expert-role{font-size:10px}
            .chat-title p{font-size:9px}
            .chat-body{padding:10px;gap:8px}
            .msg{font-size:11.5px;padding:8px 11px}
            .topics-section{padding:14px;border-radius:14px}
            .topics-intro h2{font-size:14px}
            .topics-intro p{font-size:11px}
            .topics-title{font-size:12px;margin-bottom:10px}
            .topics-grid{gap:7px}
            .topic-card{padding:10px 5px;min-height:78px;border-radius:10px;gap:5px}
            .topic-icon{width:32px;height:32px;font-size:14px;border-radius:8px}
            .topic-label{font-size:9.5px}
            .topic-desc{display:none}
            .back-btn{font-size:11px;padding:0 9px;height:33px}
            .change-topic-btn,.conversation-id-badge{font-size:11px;padding:6px 10px}
            .conversation-id-badge strong{font-size:11px}
        }
        @media (max-width: 360px) {
            .topics-grid{grid-template-columns:repeat(2,1fr)}
            .topic-card{min-height:72px}
            .topic-icon{width:30px;height:30px;font-size:13px}
            .topic-label{font-size:9px}
        }
    </style>
</head>

        function buildTopicsGrid() {
            topicsGrid.innerHTML = '';
            Object.entries(TOPICS).forEach(([key, topic]) => {
                const card = document.createElement('button');
                card.className = 'topic-card';
                card.dataset.topic = key;
                card.innerHTML = `
                    <div class="topic-icon ${topic.color}"><i class="fas ${topic.icon}"></i></div>
                    <div class="topic-label">${topic.label}</div>
                    <div class="topic-desc">${topic.desc}</div>
                `;
                card.onclick = () => window.selectTopic(key);
                topicsGrid.appendChild(card);
            });
        }

        window.selectTopic = function(topicKey) {
            const topic = TOPICS[topicKey];
            if (!topic) return;

            currentTopic = topicKey;
            currentView = 'expert';
            aiMode = true;

            // Switch views
            viewTopics.style.display = 'none';
            viewChat.style.display = 'flex';

            // Set header
            chatAvatarEl.classList.add('expert');
            chatAvatarIcon.className = 'fas fa-user-tie';
            chatTitleH3.innerHTML = `<span class="expert-name">${topic.expert.name}</span><span class="expert-role">— ${topic.expert.role}</span>`;
            chatTitleP.innerHTML = `<i class="fas fa-circle" style="font-size:6px;color:#22c55e;"></i><span style="color:#22c55e;">آنلاین</span>`;
            conversationIdEl.textContent = topic.expert.id;

            // Setup input
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.placeholder = `سوال خود را درباره ${topic.label} بنویسید...`;
            userInput.value = '';

            // Clear and welcome
            chatBody.innerHTML = '';
            renderMessage(topic.welcome, 'bot', new Date().toISOString(), `${topic.expert.name} (${topic.expert.role})`);

            setTimeout(() => userInput.focus(), 200);
        };

        window.changeTopic = function() {
            if (currentView === 'admin') {
                unsubscribeRealtime();
            }
            currentTopic = null;
            currentView = 'topics';
            aiMode = true;

            viewChat.style.display = 'none';
            viewTopics.style.display = 'flex';

            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            chatBody.innerHTML = '';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        function generateTopicReply(question) {
            if (!currentTopic) return { handled: false, text: 'لطفاً ابتدا یک موضوع انتخاب کنید.' };
            const topic = TOPICS[currentTopic];
            const q = question.toLowerCase().trim();

            if (q.includes('ادمین') || q.includes('پشتیبان') || q.includes('مدیر') || q.includes('انسان')) {
                return { handled: 'switch_to_admin' };
            }

            if ((q.includes('کد') || q.includes('تأیید') || q.includes('تایید')) && (q.includes('تغییر') || q.includes('عوض') || q.includes('گم') || q.includes('فراموش') || q.includes('یادم') || q.includes('بگیرم') || q.includes('میخوام') || q.includes('چطور'))) {
                return {
                    handled: true,
                    text: 'برای دریافت کد تأیید امنیتی:<br><br>۱. به صفحه <strong>پروفایل</strong> برو<br>۲. کارتی که می‌خوای تغییر بدی رو باز کن<br>۳. روی «🔐 دریافت کد از پشتیبانی» بزن<br>۴. خودکار به این صفحه برمی‌گردی و کد اینجا نمایش داده می‌شه'
                };
            }

            for (const item of topic.knowledge) {
                if (item.kw.some(k => q.includes(k.toLowerCase()))) {
                    return { handled: true, text: item.r };
                }
            }

            return {
                handled: true,
                text: `متأسفم، در مورد «${question.slice(0, 40)}» در بخش <strong>${topic.label}</strong> اطلاعاتی ندارم.<br><br>می‌تونی:<br>• سوال رو با کلمات دیگه‌ای بپرسی<br>• موضوع رو تغییر بدی<br>• با ادمین صحبت کنی`,
                showAdminBtn: true
            };
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('show');
            setTimeout(() => errorBanner.classList.remove('show'), 5000);
        }

        function isCodeExpired(createdAt) {
            if (!createdAt) return false;
            const createdMs = new Date(createdAt).getTime();
            if (isNaN(createdMs)) return false;
            return (Date.now() - createdMs) >= OTP_EXPIRY_MS;
        }

        window.goBack = function(event) {
            if (event) event.preventDefault();
            if (sessionStorage.getItem('zenix_return_page')) {
                window.location.href = sessionStorage.getItem('zenix_return_page');
            } else if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        };

        window.copyOtp = async function(code, btn) {
            try {
                await navigator.clipboard.writeText(code);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = code;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (_) {}
                document.body.removeChild(ta);
            }
            if (btn) {
                btn.classList.add('copied');
                btn.innerHTML = '<i class="fas fa-check"></i>';
            }

            const returnPage = sessionStorage.getItem('zenix_return_page');
            if (returnPage) {
                const toast = document.createElement('div');
                toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(34,197,94,.95);color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:700;z-index:99999;box-shadow:0 8px 25px rgba(34,197,94,.5);direction:rtl;display:flex;align-items:center;gap:8px;';
                toast.innerHTML = '<i class="fas fa-check-circle"></i> کد کپی شد، در حال بازگشت...';
                document.body.appendChild(toast);

                setTimeout(() => {
                    sessionStorage.removeItem('zenix_return_page');
                    window.location.href = returnPage;
                }, 1200);
            } else {
                setTimeout(() => {
                    if (btn) {
                        btn.classList.remove('copied');
                        btn.innerHTML = '<i class="fas fa-copy"></i>';
                    }
                }, 1500);
            }
        };

        function renderMessage(text, sender, timeIso, senderLabel) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            const safeContent = (sender === 'bot' || sender === 'system') ? text : escapeHtml(text);
            const label = senderLabel ? `<span class="msg-sender">${escapeHtml(senderLabel)}</span>` : '';
            div.innerHTML = `${label}${safeContent}<span class="msg-meta">${formatTime(timeIso)}</span>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        function renderCodeMessage(text, timeIso, createdAt) {
            const match = text.match(/کد شما:\s*(\d{6})/);
            const otpCode = match ? match[1] : null;

            if (!otpCode) {
                const div = document.createElement('div');
                div.className = 'msg system';
                div.innerHTML = text + `<span class="msg-meta">${formatTime(timeIso)}</span>`;
                chatBody.appendChild(div);
                return div;
            }

            const createdMs = createdAt ? new Date(createdAt).getTime() : Date.now();
            const expiresAt = createdMs + OTP_EXPIRY_MS;

            if (Date.now() >= expiresAt) return null;

            const div = document.createElement('div');
            div.className = 'msg system code-msg';

            const render = () => {
                if (!div.isConnected) return false;
                const remaining = expiresAt - Date.now();
                if (remaining <= 0) {
                    div.remove();
                    return false;
                }

                const mins = Math.floor(remaining / 60000);
                const secs = Math.floor((remaining % 60000) / 1000);
                const timerText = `${mins}:${String(secs).padStart(2, '0')}`;

                div.innerHTML = `
                    <span class="msg-sender" style="opacity:.85">🛡️ کد محافظ Zenix</span>
                    <div class="otp-code-display">
                        <span class="otp-code-text">${otpCode}</span>
                        <button class="copy-otp-btn" data-code="${otpCode}" title="کپی کد">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                    <div class="otp-timer-row">
                        <span>⏱ اعتبار:</span>
                        <span class="otp-timer-val">${timerText}</span>
                    </div>
                    <span class="msg-meta">${formatTime(timeIso)}</span>
                `;

                const cpBtn = div.querySelector('.copy-otp-btn');
                if (cpBtn) cpBtn.onclick = () => window.copyOtp(otpCode, cpBtn);
                return true;
            };

            chatBody.appendChild(div);
            render();
            const timer = setInterval(() => { if (!render()) clearInterval(timer); }, 1000);

            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        function renderTyping() {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        async function switchToHumanMode() {
            if (!currentUser) {
                renderMessage('برای اتصال به پشتیبان انسانی، لطفاً ابتدا وارد حساب کاربری خود شوید.', 'system', new Date().toISOString());
                setTimeout(() => { window.location.href = 'index.html'; }, 2500);
                return;
            }
            if (aiMode === false) return;
            aiMode = false;
            currentView = 'admin';
            currentTopic = null;

            chatAvatarEl.classList.add('expert');
            chatAvatarIcon.className = 'fas fa-headset';
            chatTitleH3.innerHTML = `<span class="expert-name">پشتیبانی انسانی</span><span class="expert-role">— ادمین زنیکس</span>`;
            chatTitleP.innerHTML = `<i class="fas fa-circle" style="font-size:6px;color:#22c55e;"></i><span style="color:#22c55e;">متصل</span>`;

            if (!currentChatId) {
                const { data: existing } = await supabase.from('support_chats').select('*').eq('user_email', currentUser.email).maybeSingle();
                if (existing) { currentChatId = existing.id; }
                else {
                    const { data: created, error: createError } = await supabase.from('support_chats').insert([{
                        user_email: currentUser.email, user_name: currentUser.email.split('@')[0],
                        last_message: 'درخواست اتصال به پشتیبان', unread_by_admin: true, unread_by_user: false,
                        status: 'waiting_admin', created_at: new Date().toISOString(), updated_at: new Date().toISOString()
                    }]).select().single();
                    if (createError || !created) { aiMode = true; return; }
                    currentChatId = created.id;
                }
                await supabase.from('support_messages').insert([{
                    chat_id: currentChatId, sender: 'user', text: '🙋 کاربر درخواست اتصال به پشتیبان انسانی دارد.', created_at: new Date().toISOString()
                }]);
            }
            conversationIdEl.textContent = 'TKT-' + currentChatId.slice(0, 6).toUpperCase();
            await loadMessagesFromSupabase();
            subscribeRealtime();
        }

        async function loadMessagesFromSupabase() {
            if (!currentChatId) return;
            try {
                const { data: messages, error } = await supabase.from('support_messages').select('*').eq('chat_id', currentChatId).order('created_at', { ascending: true });
                if (error) return;

                chatBody.innerHTML = '';
                let visibleCount = 0;

                if (messages && messages.length > 0) {
                    messages.forEach(msg => {
                        if (msg.sender === 'system' && (msg.text || '').includes('کد محافظ')) {
                            if (isCodeExpired(msg.created_at)) return;
                            const el = renderCodeMessage(msg.text, msg.created_at, msg.created_at);
                            if (el) visibleCount++;
                        } else {
                            const sender = msg.sender === 'admin' ? 'admin' : (msg.sender === 'system' ? 'system' : 'user');
                            const label = msg.sender === 'admin' ? 'پشتیبان' : (msg.sender === 'system' ? null : 'شما');
                            renderMessage(msg.text, sender, msg.created_at, label);
                            visibleCount++;
                        }
                    });
                }

                if (visibleCount === 0) {
                    renderMessage('هنوز پیامی در این گفتگو وجود ندارد.', 'system', new Date().toISOString());
                }
            } catch (err) {
                console.error('loadMessagesFromSupabase error:', err);
            }
        }

        function unsubscribeRealtime() {
            if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
        }

        function subscribeRealtime() {
            if (!currentChatId) return;
            unsubscribeRealtime();
            realtimeChannel = supabase.channel('support_rt_' + currentChatId)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages', filter: `chat_id=eq.${currentChatId}` }, () => {
                    loadMessagesFromSupabase();
                }).subscribe();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isSending) return;
            if (currentView === 'topics') { showError('لطفاً ابتدا یک موضوع انتخاب کنید.'); return; }
            if (!currentUser && currentView === 'admin') { showError('برای ارسال پیام به ادمین ابتدا وارد شوید.'); return; }
            isSending = true; sendBtn.disabled = true;

            renderMessage(text, 'user', new Date().toISOString(), 'شما');
            userInput.value = '';
            try {
                if (currentView === 'expert') {
                    const reply = generateTopicReply(text);
                    const topic = TOPICS[currentTopic];
                    const expertLabel = topic ? `${topic.expert.name} (${topic.expert.role})` : null;
                    if (reply.handled === 'switch_to_admin') {
                        setTimeout(async () => {
                            renderMessage('باشه، شما را به پشتیبان انسانی وصل می‌کنم...', 'system', new Date().toISOString());
                            await switchToHumanMode();
                        }, 700);
                    } else if (reply.handled === true) {
                        const typing = renderTyping();
                        setTimeout(() => {
                            typing.remove();
                            renderMessage(reply.text, 'bot', new Date().toISOString(), expertLabel);
                            if (reply.showAdminBtn) {
                                const div = document.createElement('div');
                                div.className = 'quick-replies';
                                div.innerHTML = `<button class="quick-reply-btn admin-link" onclick="window.__switchAdmin()">💬 اتصال به ادمین</button>`;
                                chatBody.appendChild(div);
                                chatBody.scrollTop = chatBody.scrollHeight;
                            }
                        }, 700);
                    }
                } else if (currentView === 'admin') {
                    if (!currentChatId) await switchToHumanMode();
                    const now = new Date().toISOString();
                    const { error: msgError } = await supabase.from('support_messages').insert([{
                        chat_id: currentChatId, sender: 'user', text: text, created_at: now
                    }]);
                    if (msgError) throw msgError;
                    await supabase.from('support_chats').update({
                        last_message: text, updated_at: now, unread_by_admin: true, status: 'waiting_admin'
                    }).eq('id', currentChatId);
                }
            } catch (err) { showError('خطا در ارسال پیام: ' + (err.message || 'نامشخص')); }
            finally { isSending = false; sendBtn.disabled = false; userInput.focus(); }
        }

        window.__switchAdmin = async function() {
            const q = document.querySelector('.quick-replies'); if (q) q.remove();
            renderMessage('باشه، شما را به پشتیبان انسانی وصل می‌کنم...', 'system', new Date().toISOString());
            await switchToHumanMode();
        };

        async function init() {
            try {
                buildTopicsGrid();
                const { data: sessionData } = await supabase.auth.getSession();
                if (sessionData?.session?.user) currentUser = sessionData.session.user;

                // آیا از پروفایل اومده برای دریافت کد؟
                const fromProfile = !!sessionStorage.getItem('zenix_return_focus');

                if (fromProfile) {
                    // مستقیم به چت ادمین برو
                    if (currentUser && currentUser.email) {
                        const { data: existingChat } = await supabase.from('support_chats').select('*').eq('user_email', currentUser.email).maybeSingle();
                        if (existingChat) currentChatId = existingChat.id;
                    }
                    await showAdminChatView();
                    return;
                }

                // پیش‌فرض: نمایش صفحه انتخاب موضوع
                viewTopics.style.display = 'flex';
                viewChat.style.display = 'none';
                currentView = 'topics';
            } catch (err) {
                console.error('init error:', err);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
        init();
    </script>
</body>
</html>
