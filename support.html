<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - پشتیبانی هوشمند پلتفرم</title>
    <link rel="stylesheet" href="https://cdnjs.loli.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo h2{font-size:18px;color:#38bdf8;font-weight:800}
        .header-actions{display:flex;gap:8px;align-items:center}
        .back-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#38bdf8;text-decoration:none}
        .c{max-width:700px;width:100%;margin:20px auto;padding:0 12px;flex:1;display:flex;flex-direction:column}
        .chat-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:16px;display:flex;flex-direction:column;height:540px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8)}
        .chat-header{background:rgba(30,41,59,.9);padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
        .chat-avatar{width:36px;height:36px;background:rgba(56,189,248,.2);border:1px solid #38bdf8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:16px}
        .chat-title h3{font-size:14px;color:#f8fafc}
        .chat-title p{font-size:10px;color:#22c55e;display:flex;align-items:center;gap:4px}
        .chat-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
        .msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.7;word-wrap:break-word}
        .msg.system{background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.25);color:#cbd5e1;align-self:center;text-align:center;font-size:11px;max-width:90%}
        .msg.admin{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;align-self:flex-start;border-top-right-radius:2px}
        .msg.user{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8;align-self:flex-end;border-top-left-radius:2px}
        .msg-meta{font-size:9px;opacity:0.6;margin-top:4px;display:block}
        .typing-indicator{display:flex;gap:4px;padding:4px 8px;align-items:center}
        .typing-dot{width:6px;height:6px;background:#38bdf8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
        .typing-dot:nth-child(1){animation-delay:-0.32s}.typing-dot:nth-child(2){animation-delay:-0.16s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.0)}}
        .chat-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1);background:rgba(15,23,42,.9);display:flex;gap:8px}
        .chat-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;color:#fff;font-size:12px;outline:none}
        .chat-input:focus{border-color:#38bdf8}
        .chat-input:disabled{opacity:0.5;cursor:not-allowed}
        .send-btn{background:#38bdf8;color:#030712;border:none;border-radius:10px;width:40px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
        .send-btn:disabled{background:#475569;cursor:not-allowed}
        .error-banner{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#f87171;padding:12px;border-radius:10px;margin-bottom:12px;font-size:12px;display:none}
        .error-banner.show{display:block}
        footer{text-align:center;padding:12px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}
    </style>
</head>
<body>
    <header>
        <div class="logo"><h2>ZENIX SUPPORT</h2></div>
        <div class="header-actions">
            <a href="#" class="back-btn" onclick="goBack(event)"><i class="fas fa-arrow-right"></i> بازگشت</a>
        </div>
    </header>
    <div class="c">
        <div id="error-banner" class="error-banner"></div>
        <div class="chat-box">
            <div class="chat-header">
                <div class="chat-avatar"><i class="fas fa-headset"></i></div>
                <div class="chat-title">
                    <h3 id="support-status-title">پشتیبانی آنلاین زنیکس</h3>
                    <p><i class="fas fa-circle" style="font-size:6px;"></i> <span id="support-status-sub">در حال اتصال...</span></p>
                </div>
            </div>
            <div class="chat-body" id="chat-body"></div>
            <div class="chat-footer">
                <input type="text" class="chat-input" id="user-input" placeholder="سوال خود را بنویسید..." disabled>
                <button class="send-btn" id="send-msg-btn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 Zenix. All rights reserved.</p></footer>

    <script type="module">
        import { createClient } from 'https://cdn.jsdmirror.com/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://ujyenmqdgivuxvxptwyl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const chatBody = document.getElementById('chat-body');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-msg-btn');
        const errorBanner = document.getElementById('error-banner');

        let currentUser = null;
        let currentChatId = null;
        let realtimeChannel = null;
        let isSending = false;

        window.goBack = function(event) {
            if (event) event.preventDefault();
            if (sessionStorage.getItem('zenix_return_page')) {
                window.location.href = sessionStorage.getItem('zenix_return_page');
            } else if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        };

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('show');
        }

        function hideError() {
            errorBanner.classList.remove('show');
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function renderMessage(text, sender, timeIso) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerHTML = `${escapeHtml(text)}<span class="msg-meta">${formatTime(timeIso)}</span>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function renderSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg system';
            div.innerHTML = escapeHtml(text);
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        async function loadMessages() {
            if (!currentChatId) return;
            try {
                const { data: messages, error } = await supabase
                    .from('support_messages')
                    .select('*')
                    .eq('chat_id', currentChatId)
                    .order('created_at', { ascending: true });

                if (error) {
                    console.error('Load messages error:', error);
                    return;
                }

                chatBody.innerHTML = '';

                renderSystemMessage('👋 به پشتیبانی Zenix خوش آمدید. پیام خود را بنویسید تا ادمین پاسخ دهد.');

                if (!messages || messages.length === 0) {
                    renderSystemMessage('هنوز پیامی در این گفتگو ثبت نشده است. اولین پیام را شما بنویسید.');
                } else {
                    messages.forEach(msg => {
                        const sender = msg.sender === 'admin' ? 'admin' : 'user';
                        renderMessage(msg.text, sender, msg.created_at);
                    });
                }
            } catch (err) {
                console.error('loadMessages error:', err);
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || !currentChatId || !currentUser || isSending) return;

            isSending = true;
            sendBtn.disabled = true;
            userInput.disabled = true;
            hideError();

            try {
                const now = new Date().toISOString();

                const { error: msgError } = await supabase
                    .from('support_messages')
                    .insert([{
                        chat_id: currentChatId,
                        sender: 'user',
                        text: text,
                        created_at: now
                    }]);

                if (msgError) throw msgError;

                const { error: chatError } = await supabase
                    .from('support_chats')
                    .update({
                        last_message: text,
                        updated_at: now,
                        unread_by_admin: true,
                        unread_by_user: false,
                        status: 'waiting_admin'
                    })
                    .eq('id', currentChatId);

                if (chatError) throw chatError;

                userInput.value = '';
            } catch (err) {
                console.error('sendMessage error:', err);
                showError('خطا در ارسال پیام: ' + (err.message || 'نامشخص'));
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        async function init() {
            try {
                const { data: sessionData, error: sessionError } = await supabase.auth.getSession();
                if (sessionError || !sessionData?.session?.user) {
                    showError('برای استفاده از پشتیبانی، ابتدا وارد حساب کاربری خود شوید.');
                    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                    return;
                }

                currentUser = sessionData.session.user;
                if (!currentUser.email) {
                    showError('ایمیل کاربری شما یافت نشد. لطفاً دوباره وارد شوید.');
                    return;
                }

                const email = currentUser.email;
                const displayName = email.split('@')[0];

                const { data: existing, error: findError } = await supabase
                    .from('support_chats')
                    .select('*')
                    .eq('user_email', email)
                    .maybeSingle();

                if (findError) {
                    console.error('Find chat error:', findError);
                }

                if (existing) {
                    currentChatId = existing.id;
                } else {
                    const { data: created, error: createError } = await supabase
                        .from('support_chats')
                        .insert([{
                            user_email: email,
                            user_name: displayName,
                            last_message: 'شروع گفتگو',
                            unread_by_admin: true,
                            unread_by_user: false,
                            status: 'open',
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString()
                        }])
                        .select()
                        .single();

                    if (createError || !created) {
                        console.error('Create chat error:', createError);
                        showError('خطا در ایجاد گفتگو. لطفاً دوباره تلاش کنید.');
                        return;
                    }
                    currentChatId = created.id;
                }

                document.getElementById('support-status-title').textContent = 'پشتیبانی زنیکس';
                document.getElementById('support-status-sub').textContent = 'متصل به مدیریت - پیام بدهید تا پاسخ بگیرید';

                await loadMessages();

                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();

                if (realtimeChannel) supabase.removeChannel(realtimeChannel);
                realtimeChannel = supabase
                    .channel('support_realtime_' + currentChatId)
                    .on('postgres_changes', {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'support_messages',
                        filter: `chat_id=eq.${currentChatId}`
                    }, () => {
                        loadMessages();
                        if (document.hidden) {
                            // اگر تب مخفی بود، بعداً میشه Notification داد
                        }
                    })
                    .on('postgres_changes', {
                        event: 'UPDATE',
                        schema: 'public',
                        table: 'support_chats',
                        filter: `id=eq.${currentChatId}`
                    }, () => {
                        // آپدیت وضعیت خوانده‌شدن توسط ادمین
                    })
                    .subscribe();

            } catch (err) {
                console.error('init error:', err);
                showError('خطای اتصال: ' + (err.message || 'نامشخص'));
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        init();
    </script>
</body>
</html>
