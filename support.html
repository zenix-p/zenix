<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - پشتیبانی هوشمند پلتفرم</title>
    <link rel="stylesheet" href="https://cdnjs.loli.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo h2{font-size:18px;color:#38bdf8;font-weight:800}
        .header-actions{display:flex;gap:8px;align-items:center}
        .back-btn, .mode-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#38bdf8;text-decoration:none;font-family:inherit}
        .mode-btn.admin-mode{color:#22c55e;border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.1)}
        .mode-btn.ai-mode{color:#a855f7;border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.1)}
        .c{max-width:700px;width:100%;margin:20px auto;padding:0 12px;flex:1;display:flex;flex-direction:column}
        .chat-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:16px;display:flex;flex-direction:column;height:600px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8)}
        .chat-header{background:rgba(30,41,59,.9);padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
        .chat-avatar{width:36px;height:36px;background:rgba(56,189,248,.2);border:1px solid #38bdf8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:16px}
        .chat-avatar.admin{border-color:#22c55e;background:rgba(34,197,94,.2);color:#22c55e}
        .chat-title h3{font-size:14px;color:#f8fafc}
        .chat-title p{font-size:10px;color:#22c55e;display:flex;align-items:center;gap:4px}
        .chat-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
        .msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.7;word-wrap:break-word}
        .msg.system{background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.25);color:#cbd5e1;align-self:center;text-align:center;font-size:11px;max-width:90%}
        .msg.bot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;align-self:flex-start;border-top-right-radius:2px}
        .msg.admin{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;align-self:flex-start;border-top-right-radius:2px}
        .msg.user{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8;align-self:flex-end;border-top-left-radius:2px}
        .msg-meta{font-size:9px;opacity:0.6;margin-top:4px;display:block}
        .msg-sender{font-size:9px;opacity:0.7;margin-bottom:2px;font-weight:700}
        .typing-indicator{display:flex;gap:4px;padding:4px 8px;align-items:center}
        .typing-dot{width:6px;height:6px;background:#38bdf8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
        .typing-dot:nth-child(1){animation-delay:-0.32s}.typing-dot:nth-child(2){animation-delay:-0.16s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.0)}}
        .quick-replies{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:flex-end}
        .quick-reply-btn{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:7px 11px;border-radius:8px;font-size:11px;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
        .quick-reply-btn:hover{background:rgba(56,189,248,.25);border-color:#38bdf8}
        .quick-reply-btn.admin-link{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171}
        .quick-reply-btn.admin-link:hover{background:rgba(239,68,68,.25)}
        .chat-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1);background:rgba(15,23,42,.9);display:flex;gap:8px}
        .chat-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;color:#fff;font-size:12px;outline:none}
        .chat-input:focus{border-color:#38bdf8}
        .send-btn{background:#38bdf8;color:#030712;border:none;border-radius:10px;width:40px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
        .send-btn:disabled{background:#475569;cursor:not-allowed}
        .error-banner{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#f87171;padding:12px;border-radius:10px;margin-bottom:12px;font-size:12px;display:none}
        .error-banner.show{display:block}
        footer{text-align:center;padding:12px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}
    </style>
</head>
<body>
    <header>
        <div class="logo"><h2>ZENIX SUPPORT</h2></div>
        <div class="header-actions">
            <button id="mode-toggle-btn" class="mode-btn admin-mode" style="display:none;" onclick="toggleMode()">
                <i class="fas fa-headset"></i> <span id="mode-btn-text">اتصال به ادمین</span>
            </button>
            <a href="#" class="back-btn" onclick="goBack(event)"><i class="fas fa-arrow-right"></i> بازگشت</a>
        </div>
    </header>
    <div class="c">
        <div id="error-banner" class="error-banner"></div>
        <div class="chat-box">
            <div class="chat-header">
                <div class="chat-avatar" id="chat-avatar-el"><i class="fas fa-robot" id="chat-avatar-icon"></i></div>
                <div class="chat-title">
                    <h3 id="support-status-title">پشتیبانی آنلاین زنیکس</h3>
                    <p><i class="fas fa-circle" style="font-size:6px;"></i> <span id="support-status-sub">در حال اتصال...</span></p>
                </div>
            </div>
            <div class="chat-body" id="chat-body"></div>
            <div class="chat-footer">
                <input type="text" class="chat-input" id="user-input" placeholder="سوال خود را بنویسید..." disabled>
                <button class="send-btn" id="send-msg-btn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 Zenix. All rights reserved.</p></footer>

    <script type="module">
        import { createClient } from 'https://cdn.jsdmirror.com/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://ujyenmqdgivuxvxptwyl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const chatBody = document.getElementById('chat-body');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-msg-btn');
        const errorBanner = document.getElementById('error-banner');
        const modeBtn = document.getElementById('mode-toggle-btn');
        const modeBtnText = document.getElementById('mode-btn-text');

        let currentUser = null;
        let currentChatId = null;
        let aiMode = true;
        let realtimeChannel = null;
        let isSending = false;

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('show');
        }

        function hideError() {
            errorBanner.classList.remove('show');
        }

        window.goBack = function(event) {
            if (event) event.preventDefault();
            if (sessionStorage.getItem('zenix_return_page')) {
                window.location.href = sessionStorage.getItem('zenix_return_page');
            } else if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        };

        function renderMessage(text, sender, timeIso, senderLabel) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            const safeContent = (sender === 'bot' || sender === 'system') ? text : escapeHtml(text);
            const label = senderLabel ? `<span class="msg-sender">${escapeHtml(senderLabel)}</span>` : '';
            div.innerHTML = `${label}${safeContent}<span class="msg-meta">${formatTime(timeIso)}</span>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        function renderTyping() {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        function renderQuickReplies() {
            const existing = document.querySelector('.quick-replies');
            if (existing) existing.remove();
            
            const div = document.createElement('div');
            div.className = 'quick-replies';
            div.innerHTML = `
                <button class="quick-reply-btn" onclick="window.__quickReply('مشکل در ورود دارم')">🔑 مشکل ورود</button>
                <button class="quick-reply-btn" onclick="window.__quickReply('چطور واریز کنم؟')">💰 واریز</button>
                <button class="quick-reply-btn" onclick="window.__quickReply('چطور برداشت کنم؟')">💳 برداشت</button>
                <button class="quick-reply-btn" onclick="window.__quickReply('ربات کوانتیفیکیشن چیه؟')">🤖 ربات</button>
                <button class="quick-reply-btn admin-link" onclick="window.__quickReply('می‌خوام با ادمین حرف بزنم')">💬 اتصال به ادمین</button>
            `;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        window.__quickReply = function(text) {
            userInput.value = text;
            sendMessage();
        };

        window.generateAIReply = function(question) {
            const q = question.toLowerCase().trim();

            // ۱. احوال‌پرسی
            if (q.includes('سلام') || q.includes('درود') || q.includes('وقت بخیر') || q.includes('خسته نباشی') || q.includes('چطوری') || q.includes('هستی')) {
                return { handled: true, text: 'سلام عزیز دل، وقتت بخیر! 👋 من خوبم ممنون. تو چطوری؟ چیزی شده که کمکت کنم یا سوالی داری؟' };
            }

            // ۲. مشکل کپچا
            if ((q.includes('کپچا') || q.includes('کد امنیتی') || q.includes('کد تصویر') || q.includes('کد رو نمیخونم') || q.includes('کد چیه')) && !q.includes('فراموش')) {
                return { handled: true, text: 'آها، اون کد امنیتی رو میگی. حق داری والا، یکم شیطون بازی درمیاره! 😅<br><br>چند تا راه حل دارم برات:<br>۱. روی خود عکس کد کلیک کن یا دکمه چرخش (Refresh) رو بزن تا یه کد واضح‌تر بیاد.<br>۲. حواست باشه حروف بزرگ و کوچیک (مثل A و a) رو دقیق مثل تصویر وارد کنی.<br>۳. اگه گوشی داری، یه ذره زوم کن روش.<br><br>اگه بازم نشد بگو تا وصلت کنم به مدیریت.' };
            }

            // ۳. ارور ورود
            if ((q.includes('وارد نمیشم') || q.includes('لاگین نمیشم') || q.includes('ورود نمیکنه') || q.includes('ارور میده') || q.includes('خطا میده') || q.includes('invalid') || q.includes('اشتباهه')) && (q.includes('رمز') || q.includes('ایمیل') || q.includes('پسورد') || q.includes('یوزر') || q.includes('login'))) {
                return { handled: true, text: 'آهان، ارور ورود میگیری. نگران نباش، خیلیا این مشکل رو دارن.<br><br>ارور <strong>Invalid credentials</strong> معمولاً یعنی یا ایمیلت رو اشتباه تایپ کردی یا رمز عبورت با اونی که موقع ثبت‌نام زدی فرق داره. یه چک بکن ببین:<br>• Caps Lock (دکمه بزرگ‌نویسی) روشن نباشه.<br>• حتماً کد امنیتی رو هم وارد کرده باشی.<br>• اگه تازه ثبت‌نام کردی، شاید ایمیلت رو تایید نکرده باشی.<br><br>میخوای یه بار دیگه با دقت امتحان کنی؟' };
            }

            // ۴. قفل حساب
            if ((q.includes('قفل') || q.includes('بلاک') || q.includes('موقتا') || q.includes('too many') || q.includes('بستن حساب')) && (q.includes('ورود') || q.includes('لاگین') || q.includes('حساب'))) {
                return { handled: true, text: 'وای، سیستم ضد هکش فعال شده! 🚨<br><br>چون چندبار پشت سر هم رمز اشتباه زدی، سیستم فکر کرده یکی داره حسابتو هک میکنه و برات یه قفل موقت (معمولاً ۱ تا ۵ دقیقه) گذاشته.<br>نگران نباش، این برای امنیت خودته. یه چایی بریز، یه کم صبر کن، بعدش دوباره با آرامش امتحان کن. حتماً درست میشه.' };
            }

            // ۵. دکمه ورود غیرفعال
            if ((q.includes('دکمه') || q.includes('دکمه ورود') || q.includes('غیرفعال') || q.includes('خاکستری') || q.includes('کار نمیکنه')) && (q.includes('ورود') || q.includes('لاگین') || q.includes('btn'))) {
                return { handled: true, text: 'آها، دکمه ورود خاکستریه و روش کلیک نمیشه؟<br><br>این طبیعیه! دکمه ورود فقط وقتی فعال میشه که ۳ تا شرط برقرار باشه:<br>۱. ایمیلت کامل و درست باشه (مثل test@gmail.com).<br>۲. رمز عبورت حداقل ۶ حرف باشه.<br>۳. کد امنیتی رو دقیقاً ۵ حرف زده باشی.<br><br>وقتی اینا کامل بشه، دکمه رنگی میشه و میتونی بزنی. اگه همه رو زدی و بازم خاکستریه، شاید مرورگرت گیر داده، یه بار صفحه رو رفرش کن.' };
            }

            // ۶. فراموشی رمز
            if ((q.includes('فراموش') || q.includes('یادم رفته') || q.includes('گم کردم') || q.includes('ریست') || q.includes('بازیابی')) && (q.includes('رمز') || q.includes('پسورد') || q.includes('password'))) {
                return { handled: true, text: 'برای فراموشی رمز، نگران نباش! توی صفحه ورود، روی گزینه <strong>«فراموشی رمز عبور»</strong> کلیک کن.<br><br>اونجا باید ایمیلت رو وارد کنی، بعدش یه کد ۶ رقمی به ایمیلت میاد. کد رو میزنی، رمز جدیدت رو انتخاب میکنی و تمام!<br>اگه کد به ایمیلت نیومد، پوشه Spam (هرزنامه) رو چک کن. اگه بازم نیومد بگو تا وصلت کنم به مدیریت.' };
            }

            // ۷. تغییر ایمیل
            if ((q.includes('تغییر') || q.includes('عوض')) && (q.includes('ایمیل') || q.includes('جمیل') || q.includes('email'))) {
                return { handled: true, text: 'برای تغییر ایمیل:<br><br>۱. اول باید با حساب فعلیت وارد بشی.<br>۲. برو به بخش <strong>پروفایل / تنظیمات</strong>.<br>۳. اونجا میتونی ایمیل جدیدت رو وارد کنی و تاییدش کنی.<br><br>اگه به هر دلیلی نمیتونی وارد بشی، بگو تا وصلت کنم به مدیریت.' };
            }

            // ۸. واریز
            if (q.includes('واریز') || q.includes('شارژ') || q.includes('پول') || q.includes('deposit')) {
                return { handled: true, text: 'برای واریز و شارژ حساب، از پنل کاربری برو به بخش <strong>واریز</strong>. آدرس کیف پول رو کپی کن و مبلغ رو بفرست. بعدش کد هش تراکنش (TxID) رو اونجا وارد کن تا حسابت شارژ بشه. اگه گیر کردی بگو!' };
            }

            // ۹. برداشت
            if (q.includes('برداشت') || q.includes('تسویه') || q.includes('withdraw')) {
                return { handled: true, text: 'برای برداشت هم از منوی پنل برو به بخش <strong>برداشت</strong>، آدرس کیف پول مقصدت رو بزن و مبلغ رو ثبت کن. درخواستت بعد از تایید سیستم، سریع واریز میشه.' };
            }

            // ۱۰. تیم و رفرال
            if (q.includes('تیم') || q.includes('دعوت') || q.includes('کمیسیون') || q.includes('زیرمجموعه')) {
                return { handled: true, text: 'برای دعوت دوستات، از بخش <strong>تیم / دعوت</strong> لینک اختصاصیت رو کپی کن و بفرست براشون. هرکاری اونا بکنن، کمیسیونش به جیبت میاد. 😉' };
            }

            // ۱۱. VIP
            if (q.includes('vip') || q.includes('سطح') || q.includes('تاج') || q.includes('سود روزانه') || q.includes('چطور باز میشه')) {
                return { handled: true, text: 'سیستم سطوح VIP خیلی ساده‌ست! هرچی سطحت بالاتر بره، درصد سود روزانه‌ت بیشتر میشه (از ۱.۵٪ تا ۴٪).<br><br><strong>چطور سطحم رو ارتقا بدم؟</strong><br>شرط اصلی اینه که <strong>واریزی مستقیم</strong> به همون میزان داشته باشی. مثلاً برای VIP 1 باید ۲۰ دلار واریز کنی، برای VIP 2 باید ۳۰۰ دلار و... .<br><br><span style="color:#fbbf24;">⚠️ نکته مهم:</span> سودی که از معاملات ربات به دست میاری رو برای ارتقای سطح حساب نمی‌کنن، فقط پولی که از بیرون واریز می‌کنی مهمه.' };
            }

            // ۱۲. ساعت نیویورک
            if (q.includes('نیویورک') || q.includes('ساعت') || q.includes('ریست') || q.includes('صفر') || q.includes('چرا ریست شد')) {
                return { handled: true, text: 'ساعت نیویورک (NY Time) برای اینه که کل پلتفرم ما بین‌المللی و زنده‌ست. ما برای معاملات و محاسبه سود، مبنا رو ساعت رسمی نیویورک گذاشتیم.<br><br>هر روز که این ساعت به پایان می‌رسه (ریست میشه)، ظرفیت ۴ بار معامله‌ی تو دوباره پر میشه و می‌تونی از فردای اون روز دوباره شروع کنی. این یعنی همه کاربرا توی کل دنیا هماهنگ هستن.' };
            }

            // ۱۳. محدودیت روزانه
            if ((q.includes('۴ بار') || q.includes('چهار بار') || q.includes('محدودیت') || q.includes('چرا نمیشه') || q.includes('دکمه کوانتیفیکیشن')) && !q.includes('دکمه ورود')) {
                return { handled: true, text: 'آها، اگه دکمه کوانتیفیکیشن برات غیرفعال شده یا نوشته <strong>«پایان ظرفیت امروز»</strong>، به خاطر اینه که تو هر روز فقط ۴ بار می‌تونی از ربات استفاده کنی (سود روزانه به ۴ معامله ۱۰ ثانیه‌ای تقسیم میشه).<br><br>یا ممکنه موجودیت کمتر از ۲۰ دلار باشه که تو این حالت ربات اصلاً فعال نمیشه و باید از بخش واریز، حسابت رو شارژ کنی.' };
            }

            // ۱۴. کوانتیفیکیشن عمومی
            if (q.includes('کوانتیفیکیشن') || q.includes('ربات') || q.includes('quantification') || q.includes('چطور کار میکنه') || q.includes('سود')) {
                return { handled: true, text: 'سیستم <strong>کوانتیفیکیشن</strong> (Quantification) یه ربات معامله‌گر هوشمنده!<br><br>ربات ما به صورت لحظه‌ای قیمت ارزهای دیجیتال رو توی صرافی‌های مختلف جهان بررسی می‌کنه و کوچک‌ترین اختلاف قیمت‌ها رو کشف می‌کنه تا از طریق آربیتراژ و هوش مصنوعی سود مطمئن به دست بیاره.<br>برای فعال کردنش، موجودیت باید بالای ۲۰ دلار باشه. بعد از اون، هر بار که دکمه کوانتیفیکیشن رو بزنی، یه معامله ۱۰ ثانیه‌ای شروع میشه و سودش به موجودیت اضافه میشه.' };
            }

            // ۱۵. موجودی/داشبورد
            if (q.includes('موجودی') || q.includes('داشبورد') || q.includes('بالانس') || q.includes('کیف پول')) {
                return { handled: true, text: 'موجودی کل حسابت رو می‌تونی از بالای صفحه داشبورد یا صفحه کوانتیفیکیشن ببینی. هر سودی هم که از ربات بگیری، به صورت لحظه‌ای به همین موجودی اضافه میشه.<br><br>اگه میخوای موجودیت رو بیشتر کنی، از بخش <strong>واریز</strong> استفاده کن.' };
            }

            // ۱۶. بازار ارز
            if (q.includes('بازار') || q.includes('قیمت') || q.includes('بیت کوین') || q.includes('اتریوم') || q.includes('ارز دیجیتال')) {
                return { handled: true, text: 'بخش <strong>بازار ارز جهانی</strong> که توی داشبورد و صفحه کوانتیفیکیشن می‌بینی، به صورت زنده قیمت‌های لحظه‌ای (مثل بیت‌کوین، اتریوم و...) رو نشون میده.<br><br>این برای اینه که کاربر حس کنه توی یه پلتفرم زنده و بین‌المللیه و ببینه ربات داره توی چه بازار پرنوسانی کار می‌کنه.' };
            }

            // ۱۷. اعلان
            if (q.includes('زنگوله') || q.includes('اعلان') || q.includes('پیام') || q.includes('صندوق پیام')) {
                return { handled: true, text: 'آیکون <strong>زنگوله</strong> (بالای صفحه) صندوق پیام‌ها و اعلان‌های توئه. هر موقع ادمین پیامی برات بفرسته یا درخواست واریز/برداشتت تایید یا رد بشه، اینجا بهت اطلاع میده.<br><br>اگه پیام جدید داشته باشی، یه نقطه قرمز روش ظاهر میشه.' };
            }

            // درخواست مستقیم ادمین
            if (q.includes('مدیر') || q.includes('ادمین') || q.includes('اپراتور') || q.includes('آدم واقعی') || q.includes('انسان') || q.includes('پشتیبان')) {
                return { handled: 'switch_to_admin' };
            }

            return { handled: false };
        };

        function updateStatusUI() {
            const titleEl = document.getElementById('support-status-title');
            const subEl = document.getElementById('support-status-sub');
            const avatarEl = document.getElementById('chat-avatar-el');
            const avatarIcon = document.getElementById('chat-avatar-icon');

            if (aiMode) {
                titleEl.textContent = 'دستیار هوشمند Zenix';
                subEl.textContent = 'آماده پاسخگویی';
                avatarEl.classList.remove('admin');
                avatarIcon.className = 'fas fa-robot';
                modeBtn.style.display = currentUser ? 'flex' : 'none';
                modeBtn.className = 'mode-btn admin-mode';
                modeBtnText.textContent = 'اتصال به ادمین';
            } else {
                titleEl.textContent = 'پشتیبانی زنیکس (ادمین)';
                subEl.textContent = 'متصل - پیام بدهید';
                avatarEl.classList.add('admin');
                avatarIcon.className = 'fas fa-headset';
                modeBtn.style.display = 'flex';
                modeBtn.className = 'mode-btn ai-mode';
                modeBtnText.textContent = 'بازگشت به دستیار';
            }
        }

        async function switchToHumanMode() {
            if (!currentUser) {
                renderMessage('برای اتصال به پشتیبان انسانی، لطفاً ابتدا وارد حساب کاربری خود شوید.', 'system', new Date().toISOString());
                setTimeout(() => { window.location.href = 'index.html'; }, 2500);
                return;
            }

            if (aiMode === false) return;

            aiMode = false;

            if (!currentChatId) {
                const { data: existing, error: findError } = await supabase
                    .from('support_chats')
                    .select('*')
                    .eq('user_email', currentUser.email)
                    .maybeSingle();

                if (existing) {
                    currentChatId = existing.id;
                } else {
                    const { data: created, error: createError } = await supabase
                        .from('support_chats')
                        .insert([{
                            user_email: currentUser.email,
                            user_name: currentUser.email.split('@')[0],
                            last_message: 'درخواست اتصال به پشتیبان',
                            unread_by_admin: true,
                            unread_by_user: false,
                            status: 'waiting_admin',
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString()
                        }])
                        .select()
                        .single();

                    if (createError || !created) {
                        console.error('Create chat error:', createError);
                        showError('خطا در اتصال به ادمین. لطفاً دوباره تلاش کنید.');
                        aiMode = true;
                        updateStatusUI();
                        return;
                    }
                    currentChatId = created.id;
                }

                await supabase.from('support_messages').insert([{
                    chat_id: currentChatId,
                    sender: 'user',
                    text: '🙋 کاربر درخواست اتصال به پشتیبان انسانی دارد.',
                    created_at: new Date().toISOString()
                }]);
            }

            updateStatusUI();
            await loadMessagesFromSupabase();
            subscribeRealtime();
        }

        window.toggleMode = async function() {
            if (aiMode) {
                await switchToHumanMode();
            } else {
                aiMode = true;
                currentChatId = null;
                unsubscribeRealtime();
                chatBody.innerHTML = '';
                renderWelcome();
                updateStatusUI();
            }
        };

        function renderWelcome() {
            chatBody.innerHTML = '';
            renderMessage('سلام، وقتت بخیر! 👋<br>من دستیار هوشمند پلتفرم <strong>Zenix</strong> هستم. اگر سوالی داری بپرس یا از موضوعات زیر انتخاب کن. اگر به کمک بیشتری نیاز داشتی، از دکمه‌ی بالا «اتصال به ادمین» استفاده کن.', 'bot', new Date().toISOString());
            renderQuickReplies();
        }

        async function loadMessagesFromSupabase() {
            if (!currentChatId) return;

            try {
                const { data: messages, error } = await supabase
                    .from('support_messages')
                    .select('*')
                    .eq('chat_id', currentChatId)
                    .order('created_at', { ascending: true });

                if (error) {
                    console.error('Load messages error:', error);
                    return;
                }

                chatBody.innerHTML = '';

                if (!messages || messages.length === 0) {
                    renderMessage('هنوز پیامی در این گفتگو ثبت نشده است. اولین پیام را شما بنویسید.', 'system', new Date().toISOString());
                    return;
                }

                messages.forEach(msg => {
                    const sender = msg.sender === 'admin' ? 'admin' : 'user';
                    const label = msg.sender === 'admin' ? 'پشتیبان' : 'شما';
                    renderMessage(msg.text, sender, msg.created_at, label);
                });
            } catch (err) {
                console.error('loadMessagesFromSupabase error:', err);
            }
        }

        function unsubscribeRealtime() {
            if (realtimeChannel) {
                supabase.removeChannel(realtimeChannel);
                realtimeChannel = null;
            }
        }

        function subscribeRealtime() {
            if (!currentChatId) return;
            unsubscribeRealtime();

            realtimeChannel = supabase
                .channel('support_rt_' + currentChatId)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'support_messages',
                    filter: `chat_id=eq.${currentChatId}`
                }, () => {
                    loadMessagesFromSupabase();
                })
                .subscribe();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isSending) return;

            if (!currentUser && !aiMode) {
                showError('برای ارسال پیام به ادمین ابتدا وارد شوید.');
                return;
            }

            isSending = true;
            sendBtn.disabled = true;

            const quickRepliesEl = document.querySelector('.quick-replies');
            if (quickRepliesEl) quickRepliesEl.remove();

            renderMessage(text, 'user', new Date().toISOString(), 'شما');
            userInput.value = '';

            try {
                if (aiMode) {
                    const reply = window.generateAIReply(text);

                    if (reply.handled === 'switch_to_admin') {
                        setTimeout(async () => {
                            renderMessage('باشه، شما را به پشتیبان انسانی وصل می‌کنم. لطفاً چند لحظه صبر کنید...', 'system', new Date().toISOString());
                            await switchToHumanMode();
                        }, 700);
                    } else if (reply.handled === true) {
                        const typing = renderTyping();
                        setTimeout(() => {
                            typing.remove();
                            renderMessage(reply.text, 'bot', new Date().toISOString());
                        }, 800);
                    } else {
                        const typing = renderTyping();
                        setTimeout(() => {
                            typing.remove();
                            renderMessage('متأسفم، در این مورد نمی‌توانم کمکت کنم. اگر مایل باشید، شما را به پشتیبان انسانی وصل می‌کنم.', 'bot', new Date().toISOString());
                            const div = document.createElement('div');
                            div.className = 'quick-replies';
                            div.innerHTML = `
                                <button class="quick-reply-btn admin-link" onclick="window.__switchAdmin()">💬 بله، به ادمین وصل کن</button>
                                <button class="quick-reply-btn" onclick="document.getElementById('user-input').focus()">✏️ سوال دیگری دارم</button>
                            `;
                            chatBody.appendChild(div);
                            chatBody.scrollTop = chatBody.scrollHeight;
                        }, 800);
                    }
                } else {
                    if (!currentChatId) {
                        await switchToHumanMode();
                    }

                    const now = new Date().toISOString();
                    const { error: msgError } = await supabase.from('support_messages').insert([{
                        chat_id: currentChatId,
                        sender: 'user',
                        text: text,
                        created_at: now
                    }]);

                    if (msgError) throw msgError;

                    await supabase.from('support_chats').update({
                        last_message: text,
                        updated_at: now,
                        unread_by_admin: true,
                        status: 'waiting_admin'
                    }).eq('id', currentChatId);
                }
            } catch (err) {
                console.error('Send error:', err);
                showError('خطا در ارسال پیام: ' + (err.message || 'نامشخص'));
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        window.__switchAdmin = async function() {
            const quickRepliesEl = document.querySelector('.quick-replies');
            if (quickRepliesEl) quickRepliesEl.remove();
            renderMessage('باشه، شما را به پشتیبان انسانی وصل می‌کنم...', 'system', new Date().toISOString());
            await switchToHumanMode();
        };

        async function init() {
            try {
                const { data: sessionData } = await supabase.auth.getSession();
                if (sessionData?.session?.user) {
                    currentUser = sessionData.session.user;
                }

                updateStatusUI();
                renderWelcome();
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();

                if (currentUser && currentUser.email) {
                    const { data: existingChat } = await supabase
                        .from('support_chats')
                        .select('*')
                        .eq('user_email', currentUser.email)
                        .maybeSingle();

                    if (existingChat) {
                        aiMode = false;
                        currentChatId = existingChat.id;
                        updateStatusUI();
                        await loadMessagesFromSupabase();
                        subscribeRealtime();
                    }
                }
            } catch (err) {
                console.error('init error:', err);
                showError('خطای اتصال: ' + (err.message || 'نامشخص'));
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        init();
    </script>
</body>
