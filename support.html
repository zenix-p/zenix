<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - پشتیبانی هوشمند پلتفرم</title>
    <link rel="stylesheet" href="https://cdnjs.loli.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo h2{font-size:18px;color:#38bdf8;font-weight:800}
        .header-actions{display:flex;gap:8px;align-items:center}
        .back-btn, .mode-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#38bdf8;text-decoration:none;font-family:inherit}
        .mode-btn.admin-mode{color:#22c55e;border-color:rgba(34,197,94,.3);background:rgba(34,197,94,.1)}
        .mode-btn.ai-mode{color:#a855f7;border-color:rgba(168,85,247,.3);background:rgba(168,85,247,.1)}
        .c{max-width:700px;width:100%;margin:20px auto;padding:0 12px;flex:1;display:flex;flex-direction:column}
        .chat-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:16px;display:flex;flex-direction:column;height:600px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8)}
        .chat-header{background:rgba(30,41,59,.9);padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
        .chat-avatar{width:36px;height:36px;background:rgba(56,189,248,.2);border:1px solid #38bdf8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:16px;flex-shrink:0}
        .chat-avatar.admin{border-color:#22c55e;background:rgba(34,197,94,.2);color:#22c55e}
        .chat-title h3{font-size:14px;color:#f8fafc}
        .chat-title p{font-size:10px;color:#22c55e;display:flex;align-items:center;gap:4px}
        .gen-code-btn{margin-inline-start:auto;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.4);color:#c084fc;padding:7px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all .2s;white-space:nowrap}
        .gen-code-btn:hover{background:rgba(168,85,247,.3);color:#e0c7ff}
        .gen-code-btn:disabled{opacity:.5;cursor:not-allowed}
        .chat-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
        .msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.7;word-wrap:break-word}
        .msg.system{background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.25);color:#cbd5e1;align-self:center;text-align:center;font-size:11px;max-width:90%}
        .msg.system.code-msg{background:rgba(168,85,247,.15);border:1.5px solid rgba(168,85,247,.5);color:#e0c7ff;font-size:13px;max-width:95%;white-space:pre-line;line-height:1.9;box-shadow:0 0 20px rgba(168,85,247,.2);min-width:220px}
        .otp-code-display{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0}
        .otp-code-text{font-size:24px;font-weight:900;letter-spacing:4px;color:#fff;font-family:'Courier New',monospace;direction:ltr;text-shadow:0 0 12px rgba(255,255,255,.3)}
        .copy-otp-btn{background:rgba(168,85,247,.35);border:1px solid rgba(168,85,247,.7);color:#e0c7ff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s;display:flex;align-items:center;justify-content:center;min-width:34px;height:34px}
        .copy-otp-btn:hover{background:rgba(168,85,247,.55);color:#fff}
        .copy-otp-btn.copied{background:rgba(34,197,94,.4);border-color:rgba(34,197,94,.7)}
        .otp-timer-row{font-size:11px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
        .otp-timer-val{color:#fbbf24;font-weight:bold;font-family:monospace}
        .msg.bot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;align-self:flex-start;border-top-right-radius:2px}
        .msg.admin{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;align-self:flex-start;border-top-right-radius:2px}
        .msg.user{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8;align-self:flex-end;border-top-left-radius:2px}
        .msg-meta{font-size:9px;opacity:0.6;margin-top:4px;display:block}
        .msg-sender{font-size:9px;opacity:0.7;margin-bottom:2px;font-weight:700}
        .typing-indicator{display:flex;gap:4px;padding:4px 8px;align-items:center}
        .typing-dot{width:6px;height:6px;background:#38bdf8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
        .typing-dot:nth-child(1){animation-delay:-0.32s}.typing-dot:nth-child(2){animation-delay:-0.16s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.0)}}
        .quick-replies{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:flex-end}
        .quick-reply-btn{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:7px 11px;border-radius:8px;font-size:11px;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
        .quick-reply-btn:hover{background:rgba(56,189,248,.25);border-color:#38bdf8}
        .quick-reply-btn.admin-link{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171}
        .quick-reply-btn.admin-link:hover{background:rgba(239,68,68,.25)}
        .chat-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1);background:rgba(15,23,42,.9);display:flex;gap:8px}
        .chat-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;color:#fff;font-size:12px;outline:none}
        .chat-input:focus{border-color:#38bdf8}
        .send-btn{background:#38bdf8;color:#030712;border:none;border-radius:10px;width:40px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
        .send-btn:disabled{background:#475569;cursor:not-allowed}
        .error-banner{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#f87171;padding:12px;border-radius:10px;margin-bottom:12px;font-size:12px;display:none}
        .error-banner.show{display:block}
        footer{text-align:center;padding:12px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}
    </style>
</head>
<body>
    <header>
        <div class="logo"><h2>ZENIX SUPPORT</h2></div>
        <div class="header-actions">
            <button id="mode-toggle-btn" class="mode-btn admin-mode" style="display:none;" onclick="toggleMode()">
                <i class="fas fa-headset"></i> <span id="mode-btn-text">اتصال به ادمین</span>
            </button>
            <a href="#" class="back-btn" onclick="goBack(event)"><i class="fas fa-arrow-right"></i> بازگشت</a>
        </div>
    </header>
    <div class="c">
        <div id="error-banner" class="error-banner"></div>
        <div class="chat-box">
            <div class="chat-header">
                <div class="chat-avatar" id="chat-avatar-el"><i class="fas fa-robot" id="chat-avatar-icon"></i></div>
                <div class="chat-title">
                    <h3 id="support-status-title">پشتیبانی آنلاین زنیکس</h3>
                    <p><i class="fas fa-circle" style="font-size:6px;"></i> <span id="support-status-sub">در حال اتصال...</span></p>
                </div>
                <button id="gen-code-btn" class="gen-code-btn" onclick="window.generateAndSendCode()" title="ارسال کد ۶ رقمی تأیید">
                    <i class="fas fa-shield-alt"></i> ارسال کد
                </button>
            </div>
            <div class="chat-body" id="chat-body"></div>
            <div class="chat-footer">
                <input type="text" class="chat-input" id="user-input" placeholder="سوال خود را بنویسید..." disabled>
                <button class="send-btn" id="send-msg-btn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 Zenix. All rights reserved.</p></footer>

    <script type="module">
        import { createClient } from 'https://cdn.jsdmirror.com/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://ujyenmqdgivuxvxptwyl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const chatBody = document.getElementById('chat-body');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-msg-btn');
        const errorBanner = document.getElementById('error-banner');
        const modeBtn = document.getElementById('mode-toggle-btn');
        const modeBtnText = document.getElementById('mode-btn-text');
        const genCodeBtn = document.getElementById('gen-code-btn');

        let currentUser = null;
        let currentChatId = null;
        let aiMode = true;
        let realtimeChannel = null;
        let isSending = false;

        const OTP_EXPIRY_MS = 2 * 60 * 1000;

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.add('show');
            setTimeout(() => errorBanner.classList.remove('show'), 5000);
        }

        function isCodeExpired(createdAt) {
            if (!createdAt) return false;
            const createdMs = new Date(createdAt).getTime();
            if (isNaN(createdMs)) return false;
            return (Date.now() - createdMs) >= OTP_EXPIRY_MS;
        }

        window.goBack = function(event) {
            if (event) event.preventDefault();
            if (sessionStorage.getItem('zenix_return_page')) {
                window.location.href = sessionStorage.getItem('zenix_return_page');
            } else if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.href = 'dashboard.html';
            }
        };

        window.copyOtp = async function(code, btn) {
            try {
                await navigator.clipboard.writeText(code);
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = code;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); } catch (_) {}
                document.body.removeChild(ta);
            }
            if (btn) {
                const orig = btn.innerHTML;
                btn.classList.add('copied');
                btn.innerHTML = '<i class="fas fa-check"></i>';
            }

            const returnPage = sessionStorage.getItem('zenix_return_page');
            if (returnPage) {
                const toast = document.createElement('div');
                toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(34,197,94,.95);color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:700;z-index:99999;box-shadow:0 8px 25px rgba(34,197,94,.5);direction:rtl;display:flex;align-items:center;gap:8px;';
                toast.innerHTML = '<i class="fas fa-check-circle"></i> کد کپی شد، در حال بازگشت...';
                document.body.appendChild(toast);

                setTimeout(() => {
                    sessionStorage.removeItem('zenix_return_page');
                    window.location.href = returnPage;
                }, 1200);
            } else {
                setTimeout(() => {
                    if (btn) {
                        btn.classList.remove('copied');
                        btn.innerHTML = '<i class="fas fa-copy"></i>';
                    }
                }, 1500);
            }
        };

        function renderMessage(text, sender, timeIso, senderLabel) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            const safeContent = (sender === 'bot' || sender === 'system') ? text : escapeHtml(text);
            const label = senderLabel ? `<span class="msg-sender">${escapeHtml(senderLabel)}</span>` : '';
            div.innerHTML = `${label}${safeContent}<span class="msg-meta">${formatTime(timeIso)}</span>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        // ★ اگر کد منقضی شده باشد، null برمی‌گرداند و چیزی نمایش نمی‌دهد
        function renderCodeMessage(text, timeIso, createdAt) {
            const match = text.match(/کد شما:\s*(\d{6})/);
            const otpCode = match ? match[1] : null;

            // اگر کد پیدا نشد - متن خام
            if (!otpCode) {
                const div = document.createElement('div');
                div.className = 'msg system';
                div.innerHTML = text + `<span class="msg-meta">${formatTime(timeIso)}</span>`;
                chatBody.appendChild(div);
                return div;
            }

            const createdMs = createdAt ? new Date(createdAt).getTime() : Date.now();
            const expiresAt = createdMs + OTP_EXPIRY_MS;

            // ★ اگر از قبل منقضی شده، هیچی نشون نده
            if (Date.now() >= expiresAt) return null;

            const div = document.createElement('div');
            div.className = 'msg system code-msg';

            const render = () => {
                if (!div.isConnected) return false;
                const remaining = expiresAt - Date.now();
                if (remaining <= 0) {
                    div.remove();
                    return false;
                }

                const mins = Math.floor(remaining / 60000);
                const secs = Math.floor((remaining % 60000) / 1000);
                const timerText = `${mins}:${String(secs).padStart(2, '0')}`;

                div.innerHTML = `
                    <span class="msg-sender" style="opacity:.85">🛡️ کد محافظ Zenix</span>
                    <div class="otp-code-display">
                        <span class="otp-code-text">${otpCode}</span>
                        <button class="copy-otp-btn" data-code="${otpCode}" title="کپی کد">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                    <div class="otp-timer-row">
                        <span>⏱ اعتبار:</span>
                        <span class="otp-timer-val">${timerText}</span>
                    </div>
                    <span class="msg-meta">${formatTime(timeIso)}</span>
                `;

                const cpBtn = div.querySelector('.copy-otp-btn');
                if (cpBtn) cpBtn.onclick = () => window.copyOtp(otpCode, cpBtn);
                return true;
            };

            chatBody.appendChild(div);
            render();
            const timer = setInterval(() => { if (!render()) clearInterval(timer); }, 1000);

            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        function renderTyping() {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        function renderQuickReplies() {
            const existing = document.querySelector('.quick-replies');
            if (existing) existing.remove();
            const div = document.createElement('div');
            div.className = 'quick-replies';
            div.innerHTML = `
                <button class="quick-reply-btn" onclick="window.__quickReply('مشکل در ورود دارم')">🔑 مشکل ورود</button>
                <button class="quick-reply-btn" onclick="window.__quickReply('چطور واریز کنم؟')">💰 واریز</button>
                <button class="quick-reply-btn" onclick="window.__quickReply('چطور برداشت کنم؟')">💳 برداشت</button>
                <button class="quick-reply-btn" onclick="window.__quickReply('ربات کوانتیفیکیشن چیه؟')">🤖 ربات</button>
                <button class="quick-reply-btn admin-link" onclick="window.__quickReply('می‌خوام با ادمین حرف بزنم')">💬 اتصال به ادمین</button>
            `;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        window.__quickReply = function(text) { userInput.value = text; sendMessage(); };

        window.generateAIReply = function(question) {
            const q = question.toLowerCase().trim();
            if (q.includes('سلام') || q.includes('درود') || q.includes('وقت بخیر')) return { handled: true, text: 'سلام عزیز دل، وقتت بخیر! 👋 چطور می‌تونم کمکت کنم؟' };
            if (q.includes('واریز') || q.includes('شارژ') || q.includes('پول')) return { handled: true, text: 'برای واریز، از منو برو به بخش <strong>واریز</strong>. آدرس کیف پول رو کپی کن و مبلغ رو بفرست. بعدش TxID رو وارد کن.' };
            if (q.includes('برداشت') || q.includes('تسویه')) return { handled: true, text: 'برای برداشت از منوی پنل برو به بخش <strong>برداشت</strong>، آدرس و مبلغ رو وارد کن.' };
            if (q.includes('vip') || q.includes('سطح')) return { handled: true, text: 'هرچی موجودیت بالاتر، درصد سود روزانه بیشتر (از ۱.۵٪ تا ۴٪). برای ارتقا باید واریزی مستقیم داشته باشی.' };
            if (q.includes('کوانتیفیکیشن') || q.includes('ربات') || q.includes('سود')) return { handled: true, text: 'ربات معامله‌گر هوشمند ما از آربیتراژ و هوش مصنوعی برای کسب سود استفاده می‌کنه. حداقل موجودی: ۲۰ دلار.' };
            if (q.includes('مدیر') || q.includes('ادمین') || q.includes('پشتیبان')) return { handled: 'switch_to_admin' };
            return { handled: false };
        };

        function updateStatusUI() {
            const titleEl = document.getElementById('support-status-title');
            const subEl = document.getElementById('support-status-sub');
            const avatarEl = document.getElementById('chat-avatar-el');
            const avatarIcon = document.getElementById('chat-avatar-icon');
            if (aiMode) {
                titleEl.textContent = 'دستیار هوشمند Zenix';
                subEl.textContent = 'آماده پاسخگویی';
                avatarEl.classList.remove('admin');
                avatarIcon.className = 'fas fa-robot';
                modeBtn.style.display = currentUser ? 'flex' : 'none';
                modeBtn.className = 'mode-btn admin-mode';
                modeBtnText.textContent = 'اتصال به ادمین';
            } else {
                titleEl.textContent = 'پشتیبانی زنیکس (ادمین)';
                subEl.textContent = 'متصل - پیام بدهید';
                avatarEl.classList.add('admin');
                avatarIcon.className = 'fas fa-headset';
                modeBtn.style.display = 'flex';
                modeBtn.className = 'mode-btn ai-mode';
                modeBtnText.textContent = 'بازگشت به دستیار';
            }
        }

        async function switchToHumanMode() {
            if (!currentUser) {
                renderMessage('برای اتصال به پشتیبان انسانی، لطفاً ابتدا وارد حساب کاربری خود شوید.', 'system', new Date().toISOString());
                setTimeout(() => { window.location.href = 'index.html'; }, 2500);
                return;
            }
            if (aiMode === false) return;
            aiMode = false;
            if (!currentChatId) {
                const { data: existing } = await supabase.from('support_chats').select('*').eq('user_email', currentUser.email).maybeSingle();
                if (existing) { currentChatId = existing.id; }
                else {
                    const { data: created, error: createError } = await supabase.from('support_chats').insert([{
                        user_email: currentUser.email, user_name: currentUser.email.split('@')[0],
                        last_message: 'درخواست اتصال به پشتیبان', unread_by_admin: true, unread_by_user: false,
                        status: 'waiting_admin', created_at: new Date().toISOString(), updated_at: new Date().toISOString()
                    }]).select().single();
                    if (createError || !created) { aiMode = true; updateStatusUI(); return; }
                    currentChatId = created.id;
                }
                await supabase.from('support_messages').insert([{
                    chat_id: currentChatId, sender: 'user', text: '🙋 کاربر درخواست اتصال به پشتیبان انسانی دارد.', created_at: new Date().toISOString()
                }]);
            }
            updateStatusUI();
            await loadMessagesFromSupabase();
            subscribeRealtime();
        }

        window.toggleMode = async function() {
            if (aiMode) { await switchToHumanMode(); }
            else {
                aiMode = true; currentChatId = null; unsubscribeRealtime();
                chatBody.innerHTML = ''; renderWelcome(); updateStatusUI();
            }
        };

        window.generateAndSendCode = async function() {
            if (!currentUser) { showError('برای دریافت کد، ابتدا وارد حساب خود شوید'); return; }
            if (isSending) return;
            isSending = true; genCodeBtn.disabled = true;
            try {
                const { data: result, error: rpcErr } = await supabase.rpc('generate_otp_for_chat');
                if (rpcErr) throw new Error(rpcErr.message || 'خطا در ساخت کد');
                if (!result || result.success !== true) {
                    if (result && result.error === 'too_soon') {
                        const secs = result.retry_after || 60;
                        showError(`⏳ لطفاً ${secs} ثانیه صبر کنید`);
                        return;
                    }
                    throw new Error((result && result.error) || 'خطا در ساخت کد');
                }
                currentChatId = result.chat_id;
                if (aiMode) { aiMode = false; updateStatusUI(); subscribeRealtime(); }
                await loadMessagesFromSupabase();
            } catch (e) {
                showError('خطا: ' + (e.message || 'نامشخص'));
            } finally {
                isSending = false; genCodeBtn.disabled = false;
            }
        };

        function renderWelcome() {
            chatBody.innerHTML = '';
            renderMessage('سلام، وقتت بخیر! 👋<br>من دستیار هوشمند <strong>Zenix</strong> هستم. اگر سوالی داری بپرس.', 'bot', new Date().toISOString());
            renderQuickReplies();
        }

        async function loadMessagesFromSupabase() {
            if (!currentChatId) return;
            try {
                const { data: messages, error } = await supabase.from('support_messages').select('*').eq('chat_id', currentChatId).order('created_at', { ascending: true });
                if (error) return;

                chatBody.innerHTML = '';
                let visibleCount = 0;

                if (messages && messages.length > 0) {
                    messages.forEach(msg => {
                        if (msg.sender === 'system' && (msg.text || '').includes('کد محافظ')) {
                            // ★ کدهای منقضی رو کلاً نمایش نمی‌دیم
                            if (isCodeExpired(msg.created_at)) return;
                            const el = renderCodeMessage(msg.text, msg.created_at, msg.created_at);
                            if (el) visibleCount++;
                        } else {
                            const sender = msg.sender === 'admin' ? 'admin' : (msg.sender === 'system' ? 'system' : 'user');
                            const label = msg.sender === 'admin' ? 'پشتیبان' : (msg.sender === 'system' ? null : 'شما');
                            renderMessage(msg.text, sender, msg.created_at, label);
                            visibleCount++;
                        }
                    });
                }

                // ★ اگر همه پیام‌ها منقضی بودن، پیام خوش‌آمد
                if (visibleCount === 0) {
                    renderMessage('هنوز پیامی در این گفتگو وجود ندارد. اگر نیاز به کد تأیید دارید، روی «ارسال کد» بزنید.', 'system', new Date().toISOString());
                }
            } catch (err) {
                console.error('loadMessagesFromSupabase error:', err);
            }
        }

        function unsubscribeRealtime() {
            if (realtimeChannel) { supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
        }

        function subscribeRealtime() {
            if (!currentChatId) return;
            unsubscribeRealtime();
            realtimeChannel = supabase.channel('support_rt_' + currentChatId)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'support_messages', filter: `chat_id=eq.${currentChatId}` }, () => {
                    loadMessagesFromSupabase();
                }).subscribe();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isSending) return;
            if (!currentUser && !aiMode) { showError('برای ارسال پیام به ادمین ابتدا وارد شوید.'); return; }
            isSending = true; sendBtn.disabled = true;
            const quickRepliesEl = document.querySelector('.quick-replies');
            if (quickRepliesEl) quickRepliesEl.remove();
            renderMessage(text, 'user', new Date().toISOString(), 'شما');
            userInput.value = '';
            try {
                if (aiMode) {
                    const reply = window.generateAIReply(text);
                    if (reply.handled === 'switch_to_admin') {
                        setTimeout(async () => {
                            renderMessage('باشه، شما را به پشتیبان انسانی وصل می‌کنم...', 'system', new Date().toISOString());
                            await switchToHumanMode();
                        }, 700);
                    } else if (reply.handled === true) {
                        const typing = renderTyping();
                        setTimeout(() => { typing.remove(); renderMessage(reply.text, 'bot', new Date().toISOString()); }, 800);
                    } else {
                        const typing = renderTyping();
                        setTimeout(() => {
                            typing.remove();
                            renderMessage('متأسفم، در این مورد نمی‌توانم کمکت کنم.', 'bot', new Date().toISOString());
                            const div = document.createElement('div');
                            div.className = 'quick-replies';
                            div.innerHTML = `<button class="quick-reply-btn admin-link" onclick="window.__switchAdmin()">💬 اتصال به ادمین</button>`;
                            chatBody.appendChild(div);
                        }, 800);
                    }
                } else {
                    if (!currentChatId) await switchToHumanMode();
                    const now = new Date().toISOString();
                    const { error: msgError } = await supabase.from('support_messages').insert([{
                        chat_id: currentChatId, sender: 'user', text: text, created_at: now
                    }]);
                    if (msgError) throw msgError;
                    await supabase.from('support_chats').update({
                        last_message: text, updated_at: now, unread_by_admin: true, status: 'waiting_admin'
                    }).eq('id', currentChatId);
                }
            } catch (err) { showError('خطا در ارسال پیام: ' + (err.message || 'نامشخص')); }
            finally { isSending = false; sendBtn.disabled = false; userInput.focus(); }
        }

        window.__switchAdmin = async function() {
            const q = document.querySelector('.quick-replies'); if (q) q.remove();
            renderMessage('باشه، شما را به پشتیبان انسانی وصل می‌کنم...', 'system', new Date().toISOString());
            await switchToHumanMode();
        };

        async function init() {
            try {
                const { data: sessionData } = await supabase.auth.getSession();
                if (sessionData?.session?.user) currentUser = sessionData.session.user;
                updateStatusUI();
                renderWelcome();
                userInput.disabled = false; sendBtn.disabled = false; userInput.focus();
                if (currentUser && currentUser.email) {
                    const { data: existingChat } = await supabase.from('support_chats').select('*').eq('user_email', currentUser.email).maybeSingle();
                    if (existingChat) {
                        aiMode = false; currentChatId = existingChat.id;
                        updateStatusUI();
                        await loadMessagesFromSupabase();
                        subscribeRealtime();
                    }
                }
            } catch (err) { showError('خطای اتصال: ' + (err.message || 'نامشخص')); }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
        init();
    </script>
</body>
</html>
