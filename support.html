<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix - پشتیبانی هوشمند پلتفرم</title>
    <link rel="stylesheet" href="https://cdnjs.loli.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
        body{background:#030712;min-height:100vh;color:#f8fafc;display:flex;flex-direction:column}
        header{background:rgba(15,23,42,.9);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
        .logo h2{font-size:18px;color:#38bdf8;font-weight:800}
        .header-actions{display:flex;gap:8px;align-items:center}
        .back-btn, .clear-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);height:36px;padding:0 12px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12px;color:#38bdf8;text-decoration:none}
        .clear-btn{color:#ef4444;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.1)}
        .clear-btn:hover{background:rgba(239,68,68,.2)}
        .c{max-width:700px;width:100%;margin:20px auto;padding:0 12px;flex:1;display:flex;flex-direction:column}
        .chat-box{background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.1);border-radius:16px;display:flex;flex-direction:column;height:540px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.8)}
        .chat-header{background:rgba(30,41,59,.9);padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
        .chat-avatar{width:36px;height:36px;background:rgba(56,189,248,.2);border:1px solid #38bdf8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#38bdf8;font-size:16px}
        .chat-title h3{font-size:14px;color:#f8fafc}
        .chat-title p{font-size:10px;color:#22c55e;display:flex;align-items:center;gap:4px}
        .chat-body{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
        .msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:12px;line-height:1.7}
        .msg.bot{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#cbd5e1;align-self:flex-start;border-top-right-radius:2px}
        .msg.admin{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:#4ade80;align-self:flex-start;border-top-right-radius:2px}
        .msg.user{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#38bdf8;align-self:flex-end;border-top-left-radius:2px}
        .typing-indicator{display:flex;gap:4px;padding:4px 8px;align-items:center}
        .typing-dot{width:6px;height:6px;background:#38bdf8;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
        .typing-dot:nth-child(1){animation-delay:-0.32s}.typing-dot:nth-child(2){animation-delay:-0.16s}
        @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1.0)}}
        .options-container{display:flex;flex-direction:column;gap:8px;margin-top:10px}
        .opt-btn{background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.3);color:#38bdf8;padding:9px 12px;border-radius:8px;font-size:12px;cursor:pointer;text-align:right;transition:all .3s ease;display:flex;align-items:center;gap:8px}
        .opt-btn:hover{background:rgba(56,189,248,.25);border-color:#38bdf8}
        .chat-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1);background:rgba(15,23,42,.9);display:flex;gap:8px}
        .chat-input{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;color:#fff;font-size:12px;outline:none}
        .chat-input:focus{border-color:#38bdf8}
        .send-btn{background:#38bdf8;color:#030712;border:none;border-radius:10px;width:40px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
        footer{text-align:center;padding:12px;font-size:11px;color:#64748b;border-top:1px solid rgba(255,255,255,.05);margin-top:auto}
    </style>
</head>
<body>
    <header>
        <div class="logo"><h2>ZENIX AI SUPPORT</h2></div>
        <div class="header-actions">
            <button class="clear-btn" onclick="clearChatHistory()" title="پاک کردن حافظه چت"><i class="fas fa-trash-alt"></i> پاک کردن چت</button>
            <a href="#" class="back-btn" onclick="goBack(event)"><i class="fas fa-arrow-right"></i> بازگشت</a>
        </div>
    </header>
    <div class="c">
        <div class="chat-box">
            <div class="chat-header">
                <div class="chat-avatar"><i class="fas fa-headset"></i></div>
                <div class="chat-title">
                    <h3 id="support-status-title">پشتیبانی آنلاین زنیکس</h3>
                    <p><i class="fas fa-circle" style="font-size:6px;"></i> <span id="support-status-sub">آنلاین و پاسخگوی سوالات شما</span></p>
                </div>
            </div>
            <div class="chat-body" id="chat-body"></div>
            <div class="chat-footer">
                <input type="text" class="chat-input" id="user-input" placeholder="سوال خود را بنویسید...">
                <button class="send-btn" id="send-msg-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 Zenix. All rights reserved.</p></footer>

    <script>
        const chatBody = document.getElementById('chat-body');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-msg-btn');

        let currentUser = null;
        let isConnectedToAdmin = false;

        window.goBack = function(event) {
            if (event) event.preventDefault();
            if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.replace('quantification.html');
            }
        };

        loadChatHistory();

        function saveMessageToStorage(text, sender) {
            try {
                let history = JSON.parse(localStorage.getItem('zenix_chat_history')) || [];
                history.push({ text, sender });
                localStorage.setItem('zenix_chat_history', JSON.stringify(history));
            } catch (e) {
                console.error("Storage error:", e);
            }
        }

        function loadChatHistory() {
            let history = [];
            try {
                history = JSON.parse(localStorage.getItem('zenix_chat_history')) || [];
            } catch (e) {
                history = [];
                localStorage.removeItem('zenix_chat_history');
            }

            if (history.length === 0) {
                const initialMsg = `سلام، وقتت بخیر! 👋<br>من پشتیبان پلتفرم <strong>Zenix</strong> هستم. هر سوالی درباره ثبت‌نام، ورود، شارژ، برداشت یا ربات معاملاتی داری، راحت بپرس تا کمکت کنم.`;
                addMessage(initialMsg, 'bot', false);
            } else {
                chatBody.innerHTML = '';
                history.forEach(item => {
                    addMessage(item.text, item.sender, false);
                });
            }
        }

        window.clearChatHistory = function() {
            if(confirm('مطمئنی میخوای تاریخچه چت رو پاک کنی؟')) {
                localStorage.removeItem('zenix_chat_history');
                chatBody.innerHTML = '';
                isConnectedToAdmin = false;
                document.getElementById('support-status-title').innerText = "پشتیبانی آنلاین زنیکس";
                document.getElementById('support-status-sub').innerText = "آنلاین و پاسخگوی سوالات شما";
                loadChatHistory();
            }
        };

        function addMessage(text, sender, save = true) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerHTML = text;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;

            if (save) {
                saveMessageToStorage(text, sender);
            }
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.className = 'msg bot typing-msg';
            div.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
            chatBody.appendChild(div);
            chatBody.scrollTop = chatBody.scrollHeight;
            return div;
        }

        window.connectToAdmin = async function() {
            let userId = currentUser ? currentUser.uid : (localStorage.getItem('zenix_guest_uid') || 'guest_' + Math.random().toString(36).substring(2, 9));
            if (!currentUser && !localStorage.getItem('zenix_guest_uid')) {
                localStorage.setItem('zenix_guest_uid', userId);
            }

            addMessage('لطفاً منو به مدیریت وصل کن...', 'user', true);
            const typingElem = showTypingIndicator();

            setTimeout(() => {
                typingElem.remove();
                isConnectedToAdmin = true;

                document.getElementById('support-status-title').innerText = "پشتیبانی مستقیم (مدیریت)";
                document.getElementById('support-status-sub').innerText = "متصل به مدیریت - در انتظار پاسخ";

                addMessage(`باشه، درخواستت رو فرستادم برای مدیریت. یه لحظه صبر کن، به زودی یه نفر از تیم پشتیبانی باهات حرف میزنه. هر پیامی هم بنویسی مستقیم به دستشون می‌رسه.`, 'admin', true);
            }, 800);
        };

        function sendDirectToAdmin(text) {
            let userId = currentUser ? currentUser.uid : localStorage.getItem('zenix_guest_uid');
            if(!userId) return;
        }

        function processAIResponse(question) {
            if (isConnectedToAdmin) {
                sendDirectToAdmin(question);
                return;
            }

            const typingElem = showTypingIndicator();
            
            setTimeout(() => {
                typingElem.remove();
                let reply = "";
                const q = question.toLowerCase().trim();

                // --- ۱. احوال‌پرسی و سلام ---
                const isGreeting = q.includes('سلام') || q.includes('درود') || q.includes('وقت بخیر') || q.includes('خسته نباشی') || q.includes('چطوری') || q.includes('هستی');
                
                // --- ۲. مشکل با کپچا ---
                const isCaptchaProblem = (q.includes('کپچا') || q.includes('کد امنیتی') || q.includes('کد تصویر') || q.includes('کد رو نمیخونم') || q.includes('کد چیه')) && !q.includes('فراموش');
                
                // --- ۳. ارورهای ورود ---
                const isLoginError = (q.includes('وارد نمیشم') || q.includes('لاگین نمیشم') || q.includes('ورود نمیکنه') || q.includes('ارور میده') || q.includes('خطا میده') || q.includes('invalid') || q.includes('اشتباهه')) && (q.includes('رمز') || q.includes('ایمیل') || q.includes('پسورد') || q.includes('یوزر') || q.includes('login'));

                // --- ۴. قفل شدن حساب (Rate Limit) ---
                const isAccountLocked = (q.includes('قفل') || q.includes('بلاک') || q.includes('موقتا') || q.includes('too many') || q.includes('بستن حساب')) && (q.includes('ورود') || q.includes('لاگین') || q.includes('حساب'));

                // --- ۵. دکمه ورود غیرفعال است ---
                const isButtonDisabled = (q.includes('دکمه') || q.includes('دکمه ورود') || q.includes('غیرفعال') || q.includes('خاکستری') || q.includes('کار نمیکنه')) && (q.includes('ورود') || q.includes('لاگین') || q.includes('btn'));

                // --- ۶. فراموشی رمز عبور ---
                const isForgotPassword = (q.includes('فراموش') || q.includes('یادم رفته') || q.includes('گم کردم') || q.includes('ریست') || q.includes('بازیابی') || q.includes('کد ۶ رقمی') || q.includes('otp')) && (q.includes('رمز') || q.includes('پسورد') || q.includes('password'));

                // --- ۷. ثبت نام و کد دعوت ---
                const isRegisterProblem = q.includes('ثبت نام') || q.includes('ثبت‌نام') || q.includes('عضویت') || q.includes('کد دعوت') || q.includes('لینک دعوت') || q.includes('رفرال') || q.includes('ایمیل تکراری');

                // --- ۸. شارژ و واریز ---
                const isDeposit = q.includes('واریز') || q.includes('شارژ') || q.includes('پول') || q.includes('deposit');

                // --- ۹. برداشت ---
                const isWithdraw = q.includes('برداشت') || q.includes('تسویه') || q.includes('withdraw');

                // --- ۱۰. ربات و کوانتیفیکیشن ---
                const isBot = q.includes('ربات') || q.includes('کوانتیفیکیشن') || q.includes('quantification') || q.includes('سود') || q.includes('ترید');

                // --- ۱۱. تیم و رفرال ---
                const isTeam = q.includes('تیم') || q.includes('دعوت') || q.includes('کمیسیون') || q.includes('زیرمجموعه');

                // --- ۱۲. درخواست ادمین ---
                const isAdminRequest = q.includes('مدیر') || q.includes('ادمین') || q.includes('اپراتور') || q.includes('آدم واقعی') || q.includes('انسان') || q.includes('پشتیبان');

                if (isGreeting) {
                    reply = `سلام عزیز دل، وقتت بخیر! 👋 من خوبم ممنون. تو چطوری؟ چیزی شده که کمکت کنم یا سوالی داری؟`;
                }
                else if (isCaptchaProblem) {
                    reply = `آها، اون کد امنیتی رو میگی. حق داری والا، یکم شیطون بازی درمیاره! 😅<br><br>
                    چند تا راه حل دارم برات:<br>
                    ۱. روی خود عکس کد کلیک کن یا دکمه چرخش (Refresh) رو بزن تا یه کد واضح‌تر بیاد.<br>
                    ۲. حواست باشه حروف بزرگ و کوچیک (مثل A و a) رو دقیق مثل تصویر وارد کنی.<br>
                    ۳. اگه گوشی داری، یه ذره زوم کن روش.<br><br>
                    اگه بازم نشد بگو تا وصلت کنم به مدیریت.`;
                }
                else if (isLoginError) {
                    reply = `آهان، ارور ورود میگیری. نگران نباش، خیلیا این مشکل رو دارن.<br><br>
                    ارور <strong>Invalid credentials</strong> معمولاً یعنی یا ایمیلت رو اشتباه تایپ کردی یا رمز عبورت با اونی که موقع ثبت‌نام زدی فرق داره. یه چک بکن ببین:<br>
                    • Caps Lock (دکمه بزرگ‌نویسی) روشن نباشه.<br>
                    • حتماً کد امنیتی رو هم وارد کرده باشی.<br>
                    • اگه تازه ثبت‌نام کردی، شاید ایمیلت رو تایید نکرده باشی.<br><br>
                    میخوای یه بار دیگه با دقت امتحان کنی؟`;
                }
                else if (isAccountLocked) {
                    reply = `وای، سیستم ضد هکش فعال شده! 🚨<br><br>
                    چون چندبار پشت سر هم رمز اشتباه زدی، سیستم فکر کرده یکی داره حسابتو هک میکنه و برات یه قفل موقت (معمولاً ۱ تا ۵ دقیقه) گذاشته.<br>
                    نگران نباش، این برای امنیت خودته. یه چایی بریز، یه کم صبر کن، بعدش دوباره با آرامش امتحان کن. حتماً درست میشه.`;
                }
                else if (isButtonDisabled) {
                    reply = `آها، دکمه ورود خاکستریه و روش کلیک نمیشه؟<br><br>
                    این طبیعیه! دکمه ورود فقط وقتی فعال میشه که ۳ تا شرط برقرار باشه:<br>
                    ۱. ایمیلت کامل و درست باشه (مثل test@gmail.com).<br>
                    ۲. رمز عبورت حداقل ۶ حرف باشه.<br>
                    ۳. کد امنیتی رو دقیقاً ۵ حرف زده باشی.<br><br>
                    وقتی اینا کامل بشه، دکمه رنگی میشه و میتونی بزنی. اگه همه رو زدی و بازم خاکستریه، شاید مرورگرت گیر داده، یه بار صفحه رو رفرش کن.`;
                }
                else if (isForgotPassword) {
                    reply = `برای فراموشی رمز، نگران نباش! توی صفحه ورود، روی گزینه <strong>«فراموشی رمز عبور»</strong> کلیک کن.<br><br>
                    اونجا باید ایمیلت رو وارد کنی، بعدش یه کد ۶ رقمی به ایمیلت میاد. کد رو میزنی، رمز جدیدت رو انتخاب میکنی و تمام!<br>
                    اگه کد به ایمیلت نیومد، پوشه Spam (هرزنامه) رو چک کن. اگه بازم نیومد بگو تا وصلت کنم به مدیریت.`;
                }
                else if (isRegisterProblem) {
                    reply = `برای ثبت‌نام توی زنیکس، حتماً باید از <strong>لینک دعوت</strong> استفاده کنی.<br><br>
                    بدون کد معرف یا لینک دعوت، سیستم اجازه ثبت‌نام نمیده. اگه لینک دعوت نداری، باید از دوستت یا کسی که تو رو معرفی کرده بخوای لینکش رو برات بفرسته.<br>
                    اگه لینک رو باز کردی و ایمیلت قبلاً ثبت شده بود، پیغام میده که ایمیل تکراریه. در این صورت باید از صفحه ورود لاگین کنی یا رمزت رو بازیابی کنی.`;
                }
                else if (isDeposit) {
                    reply = `برای واریز و شارژ حساب، از پنل کاربری برو به بخش <strong>واریز</strong>.<br><br>
                    آدرس کیف پول (Wallet Address) و شبکه مورد نظر (مثلاً TRC20) رو کپی کن، مبلغ رو انتقال بده. بعد از انتقال، کد هش تراکنش (TxID) رو اونجا وارد کن تا حسابت شارژ بشه.<br>
                    دقت کن شبکه‌ای که انتخاب میکنی با شبکه‌ای که از صرافی می‌فرستی یکی باشه، وگرنه پولت گم میشه!`;
                }
                else if (isWithdraw) {
                    reply = `برای برداشت، از منوی پنل برو به بخش <strong>برداشت</strong>.<br><br>
                    آدرس کیف پول مقصدت رو بزن و مبلغ رو ثبت کن. درخواستت بعد از تایید سیستم، سریع واریز میشه. دقت کن که حداقل مبلغ برداشت رو رعایت کنی و شبکه رو درست انتخاب کنی.`;
                }
                else if (isBot) {
                    reply = `سیستم <strong>کوانتیفیکیشن</strong> یه ربات معامله‌گر هوشمنده. وقتی فعالش کنی، خودش با تحلیل نوسانات بازار ترید میکنه و سودش رو روزانه به حسابت اضافه میکنه.<br><br>
                    خیلی هم راحته، کافیه موجودی داشته باشی و ربات رو روشن کنی تا برات کار کنه. سودش هم به صورت لحظه‌ای توی داشبوردت نمایش داده میشه.`;
                }
                else if (isTeam) {
                    reply = `برای دعوت دوستات، از بخش <strong>تیم / دعوت</strong> لینک اختصاصیت رو کپی کن و بفرست براشون.<br><br>
                    هرکاری اونا بکنن، کمیسیونش به جیبت میاد. هرچی زیرمجموعه بیشتری جذب کنی، درآمدت از این بخش بیشتر میشه. 😉`;
                }
                else if (isAdminRequest) {
                    window.connectToAdmin();
                    return;
                }
                // --- اگر سوال نامفهوم بود (Fallback) ---
                else {
                    reply = `ببخشید عزیز، متوجه نشدم دقیقاً منظورت چیه. میشه یه ذره واضح‌تر بگی؟<br>
                    مثلاً بگو تو <strong>صفحه ورود</strong> چه اروری میگیره؟ یا اگه درباره واریز و برداشته، بگو کجاش گیر کردی تا بهتر راهنماییت کنم.<br><br>
                    یا اگه دوست داری مستقیم با یه آدم حرف بزنی:
                    <div class="options-container">
                        <button class="opt-btn" style="border-color:#ef4444;color:#ef4444;" onclick="connectToAdmin()"><i class="fas fa-headset"></i> ارجاع به مدیریت (اپراتور انسانی)</button>
                    </div>`;
                }

                addMessage(reply, 'bot', true);
            }, 900); // تاخیر طبیعی مثل تایپ کردن انسان
        }

        sendBtn.onclick = () => {
            const val = userInput.value.trim();
            if(!val) return;
            addMessage(val, 'user', true);
            userInput.value = '';
            processAIResponse(val);
        };

        userInput.onkeypress = (e) => {
            if(e.key === 'Enter') sendBtn.click();
        };
    </script>
</body>
</html>
