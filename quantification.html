<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://ujyenmqdgivuxvxptwyl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tRJPNKN0KUFfcta6I3xsNw_icShZQhO';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let uUid=null,tProf=0,bBal=0;
const tpEl=document.getElementById('today-profit-val'),tbEl=document.getElementById('total-balance-val'),hList=document.getElementById('history-list');

window.cachedNotifications = [];
window.activeNotifFilter = 'all';
window.actualUserKeys = [];

// تابع کمکی برای پاک‌سازی فرمت تاریخ (فقط YYYY-MM-DD)
function cleanDateStr(d) {
  if (!d) return '';
  return String(d).split('T')[0].split(' ')[0].trim();
}

async function saveUserFields(dict) {
  if (!uUid) return;

  // ذخیره در LocalStorage به عنوان پشتیبان سریع
  try {
    const localData = {
      count: dict.count,
      date: dict.date,
      profit: dict.profit,
      balance: dict.balance,
      history: dict.history || allTradesArray
    };
    localStorage.setItem(`zenix_quant_state_${uUid}`, JSON.stringify(localData));
  } catch(e) {}

  const payload = {};
  const keys = window.actualUserKeys || [];
  const getCol = (candidates, fallback) => {
    const found = keys.find(x => candidates.some(c => c.toLowerCase() === x.toLowerCase()));
    return found || fallback;
  };

  if (dict.count !== undefined) payload[getCol(['quantCount', 'quant_count'], 'quant_count')] = dict.count;
  if (dict.date !== undefined) payload[getCol(['quantDate', 'quant_date'], 'quant_date')] = dict.date;
  if (dict.profit !== undefined) payload[getCol(['todayProfit', 'today_profit'], 'today_profit')] = dict.profit;
  if (dict.balance !== undefined) payload[getCol(['balance'], 'balance')] = dict.balance;
  if (dict.history !== undefined) payload[getCol(['tradeHistoryArray', 'quantHistory', 'trades', 'history'], 'tradeHistoryArray')] = dict.history;

  if (Object.keys(payload).length > 0) {
    const { error: updateErr } = await supabase.from("users").update(payload).eq("id", uUid);
    if (updateErr) console.error("خطا در بروزرسانی اطلاعات در Supabase:", updateErr);
  }
}

window.setNotifFilter = function(filter, btnElement) {
  window.activeNotifFilter = filter;
  document.querySelectorAll('.notif-tab').forEach(t => t.classList.remove('active'));
  if(btnElement) btnElement.classList.add('active');
  window.renderNotifications();
};

window.getNotifCategory = function(n) {
  const type = (n.type || '').toLowerCase();
  const title = (n.title || '').toLowerCase();

  if (type.includes('approved') || type.includes('confirm') || title.includes('تایید') || title.includes('موفق') || title.includes('شارژ شد')) {
    return 'approved';
  }
  if (type.includes('rejected') || type.includes('canceled') || type.includes('cancel') || title.includes('رد') || title.includes('لغو') || title.includes('ناموفق')) {
    return 'rejected';
  }
  return 'admin_message';
};

window.renderNotifications = function() {
  const container = document.getElementById('modal-msg-container');
  if (!container) return;

  const filter = window.activeNotifFilter;
  const filtered = window.cachedNotifications.filter(n => {
    if (filter === 'all') return true;
    return window.getNotifCategory(n) === filter;
  });

  if (filtered.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:25px;color:#94a3b8;font-size:12px;"><i class="fas fa-inbox" style="font-size:24px;margin-bottom:8px;display:block;opacity:0.5;"></i>هیچ پیامی در این دسته‌بندی وجود ندارد.</div>`;
    return;
  }

  let html = '';
  filtered.forEach(n => {
    const title = n.title || 'پیام سیستم';
    const msg = n.message || n.text || n.body || '';
    const category = window.getNotifCategory(n);

    let borderStyle = "border:1px solid rgba(255,255,255,.08);";
    let bgStyle = "background:rgba(255,255,255,.03);";
    let icon = '<i class="fas fa-bullhorn" style="color:#38bdf8"></i>';
    let tagHtml = '<span style="font-size:10px;background:rgba(56,189,248,0.2);color:#38bdf8;padding:2px 6px;border-radius:4px;margin-right:auto;font-weight:700;">پیام مدیریت</span>';
    let supportBtn = '';

    if (category === 'approved') {
      borderStyle = "border:1px solid rgba(34, 197, 94, 0.4);";
      bgStyle = "background:rgba(34, 197, 94, 0.08);";
      icon = '<i class="fas fa-check-circle" style="color:#22c55e"></i>';
      tagHtml = '<span style="font-size:10px;background:rgba(34,197,94,0.2);color:#22c55e;padding:2px 6px;border-radius:4px;margin-right:auto;font-weight:700;">تایید درخواست</span>';
    } else if (category === 'rejected') {
      borderStyle = "border:1px solid rgba(239, 68, 68, 0.4);";
      bgStyle = "background:rgba(239, 68, 68, 0.08);";
      icon = '<i class="fas fa-times-circle" style="color:#ef4444"></i>';
      tagHtml = '<span style="font-size:10px;background:rgba(239,68,68,0.2);color:#ef4444;padding:2px 6px;border-radius:4px;margin-right:auto;font-weight:700;">لغو درخواست</span>';
      
      supportBtn = `
        <div style="margin-top:10px;padding-top:8px;border-top:1px dashed rgba(239,68,68,0.2);display:flex;justify-content:flex-end;">
          <a href="support.html" onclick="sessionStorage.setItem('zenix_return_page', window.location.href);" style="display:inline-flex;align-items:center;gap:6px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#f8fafc;padding:5px 10px;border-radius:6px;font-size:11px;text-decoration:none;font-weight:600;transition:0.2s;">
            <i class="fas fa-headset" style="color:#ef4444;"></i>
            <span>پیگیری از طریق پشتیبانی</span>
          </a>
        </div>
      `;
    }

    html += `<div class="msg-body-box" style="${borderStyle} ${bgStyle}">
      <div class="msg-title-text" style="display:flex;align-items:center;gap:8px;">
        ${icon}
        <span>${title}</span>
        ${tagHtml}
      </div>
      <div class="msg-desc-text" style="margin-top:6px;">${msg}</div>
      ${supportBtn}
    </div>`;
  });

  container.innerHTML = html;
};

function getNYDateStr(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(new Date());}
let todayNY=getNYDateStr(),cCnt=0,allTradesArray=[];

function formatTradeDate(item){
  if (!item) return '';
  let d = null;
  if (item.timestamp) {
    d = typeof item.timestamp === 'number' ? new Date(item.timestamp) : new Date(item.timestamp);
  } else if (item.time) {
    d = new Date(item.time);
  } else if (item.date) {
    d = new Date(item.date);
  }

  if (d && !isNaN(d.getTime())) {
    return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} - ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  return item.dateStr || item.date || item.time || '';
}

function uC(){
  const dateStr=getNYDateStr();
  if(dateStr!==todayNY){
    todayNY=dateStr;cCnt=0;tProf=0;
    saveUserFields({ count: 0, date: todayNY, profit: 0, history: [] });
    if(tpEl)tpEl.innerText='$0.00';
    window.checkClickState();
  }
  const t=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date());
  const c=document.getElementById('ny-clock-val');if(c)c.innerText=t;
}
setInterval(uC,1000);uC();

const cList=[
  {name:'Bitcoin',symbol:'BTC',cls:'fab fa-bitcoin',color:'#f7931a'},
  {name:'Ethereum',symbol:'ETH',cls:'fab fa-ethereum',color:'#627eea'},
  {name:'Solana',symbol:'SOL',cls:'fas fa-coins',color:'#14f195'},
  {name:'Ripple',symbol:'XRP',cls:'fas fa-water',color:'#23292f'},
  {name:'Cardano',symbol:'ADA',cls:'fas fa-circle-dot',color:'#0033ad'},
  {name:'Dogecoin',symbol:'DOGE',cls:'fas fa-dog',color:'#c2a633'},
  {name:'Binance Coin',symbol:'BNB',cls:'fas fa-cube',color:'#f3ba2f'}
];

window.checkClickState=function(){
  const qBtn = document.getElementById('quant-btn');
  if(!qBtn || !window.isBotActive) return;

  const l=window.currentActiveLang||'fa',t=(window.LD&&window.LD[l])||(window.LD&&window.LD.fa)||{};
  if(cCnt>=4){
    qBtn.disabled=true;qBtn.style.opacity="0.5";qBtn.style.cursor="not-allowed";
    qBtn.innerHTML=`<i class="fas fa-ban"></i> <span>${t.dailyLimit || 'پایان ظرفیت امروز'}</span>`;
  }else{
    qBtn.disabled=false;qBtn.style.opacity="1";qBtn.style.cursor="pointer";
    qBtn.innerHTML=`<i class="fas fa-robot"></i> <span>${t.quantification || 'کوانتیفیکیشن'} (${cCnt}/4)</span>`;
  }
};

window.renderHistory=function(){
  if(!hList) return;
  const l=window.currentActiveLang||'fa',t=(window.LD&&window.LD[l])||(window.LD&&window.LD.fa)||{};
  const btn=document.getElementById('view-all-history-btn'),btnTxt=document.getElementById('history-btn-text'),btnIcon=document.getElementById('history-btn-icon');
  
  if(!allTradesArray || !Array.isArray(allTradesArray) || allTradesArray.length===0){
    hList.innerHTML=`<div style="font-size:12px;color:#94a3b8;text-align:center;" data-i18n="noHistory">${t.noHistory || 'هنوز معامله‌ای ثبت نشده است'}</div>`;
    if(btn)btn.style.display='none';
    return;
  }

  if(btn){
    btn.style.display = allTradesArray.length > 4 ? 'flex' : 'none';
    if(btnTxt)btnTxt.innerText=window.showAllHistory?(t.showLess||'بستن تاریخچه'):(t.showFullHistory||'مشاهده کامل تاریخچه');
    if(btnIcon)btnIcon.className=window.showAllHistory?'fas fa-chevron-up':'fas fa-list-ul';
  }

  const tradesToDisplay = window.showAllHistory ? allTradesArray : allTradesArray.slice(0, 4);
  let htmlStr='';

  tradesToDisplay.forEach(item=>{
    if(!item) return;
    const rawProf = item.profit ?? item.amount ?? item.profitAmount ?? 0;
    const numProf = parseFloat(rawProf);
    const profStr = isNaN(numProf) ? '0.00' : numProf.toFixed(2);
    
    const formattedDate = formatTradeDate(item);
    const coinName = item.name || item.coinName || item.currency || 'Crypto';
    const coinSym = item.symbol || item.coinSymbol || '';
    const coinColor = item.color || '#38bdf8';
    const coinIcon = item.cls || 'fas fa-coins';

    htmlStr+=`<div style="background:rgba(255,255,255,0.03);padding:10px 12px;border-radius:8px;font-size:11px;display:flex;justify-content:space-between;margin-bottom:4px;align-items:center;border:1px solid rgba(255,255,255,0.05);">
      <span style="color:#22c55e;font-weight:bold;font-size:12px;">+$${profStr}</span>
      <span style="color:#94a3b8;font-size:10px;font-family:monospace;">${formattedDate}</span>
      <span style="display:flex;align-items:center;gap:6px;"><span style="color:#f8fafc;font-weight:600;">${coinName} ${coinSym ? `(${coinSym})` : ''}</span><span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:${coinColor};color:#fff;font-size:11px;"><i class="${coinIcon}"></i></span></span>
    </div>`;
  });
  hList.innerHTML=htmlStr;
};

// فعال‌سازی رویداد کلیک دکمه
function initQuantButton() {
  const qBtn = document.getElementById('quant-btn');
  if(!qBtn) return;

  qBtn.onclick=function(e){
    e.preventDefault();
    if(cCnt>=4||!window.isBotActive||!uUid)return;
    cCnt++;
    qBtn.disabled=true;qBtn.style.opacity="0.5";
    const l=window.currentActiveLang||'fa',t=(window.LD&&window.LD[l])||(window.LD&&window.LD.fa)||{};
    let dailyRate=0.015;
    if(bBal>=10000)dailyRate=0.04;
    else if(bBal>=5000)dailyRate=0.035;
    else if(bBal>=2500)dailyRate=0.03;
    else if(bBal>=1000)dailyRate=0.025;
    else if(bBal>=300)dailyRate=0.02;

    const tradeAmount = bBal;
    const p=(tradeAmount*dailyRate)/4;
    const tBox=document.getElementById('trade-box'),tDet=document.getElementById('trade-details');
    if(tBox) tBox.style.display='block';
    const rc=cList[Math.floor(Math.random()*cList.length)];
    let tLeft=10;

    if(tDet) {
      tDet.innerHTML=`
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;">
          <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;">
            <i class="fas fa-spinner fa-spin" style="color:#38bdf8;"></i> 
            <span>${t.trading || 'معامله'}</span> 
            <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:${rc.color};color:#fff;font-size:12px;margin:0 2px;"><i class="${rc.cls}"></i></span> 
            <b>${rc.name} (${rc.symbol})</b>
          </div>
          <div style="font-size:11px;color:#cbd5e1;background:rgba(255,255,255,0.04);padding:5px 12px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;width:100%;max-width:320px;border:1px solid rgba(255,255,255,0.06);">
            <span>${t.tradeAmount || 'مبلغ معامله'}: <b style="color:#38bdf8;">$${tradeAmount.toFixed(2)}</b></span>
            <span>زمان: <b id="cd-v" style="color:#f59e0b;">10</b> ${t.seconds || 'ثانیه'}</span>
          </div>
        </div>
      `;
    }

    const tI=setInterval(()=>{
      tLeft--;
      const cd=document.getElementById('cd-v');if(cd)cd.innerText=tLeft;
      if(tLeft<=0)clearInterval(tI);
    },1000);

    setTimeout(async ()=>{
      clearInterval(tI);
      tProf+=p;bBal+=p;
      if(tpEl)tpEl.innerText='$'+tProf.toFixed(2);
      if(tbEl)tbEl.innerText='$'+bBal.toFixed(2);

      if(tDet) {
        tDet.innerHTML=`
          <div style="display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;">
            <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:#22c55e;">
              <i class="fas fa-check-circle"></i> ${t.success || 'موفق!'} 
              <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:${rc.color};color:#fff;font-size:12px;margin:0 2px;"><i class="${rc.cls}"></i></span> 
              <b>${rc.name} (${rc.symbol})</b>
            </div>
            <div style="font-size:11px;color:#cbd5e1;background:rgba(34,197,94,0.1);padding:5px 12px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;width:100%;max-width:320px;border:1px solid rgba(34,197,94,0.25);">
              <span>${t.tradeAmount || 'مبلغ معامله'}: <b style="color:#f8fafc;">$${tradeAmount.toFixed(2)}</b></span>
              <span>${t.prof || 'سود'}: <b style="color:#22c55e;">+$${p.toFixed(2)}</b></span>
            </div>
          </div>
        `;
      }
      
      const now=new Date();
      const dateStr=`${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} - ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const tradeObj={name:rc.name,symbol:rc.symbol,cls:rc.cls,color:rc.color,profit:p,dateStr:dateStr,timestamp:now.getTime()};
      allTradesArray.unshift(tradeObj);
      window.renderHistory();
      
      window.checkClickState();

      await saveUserFields({
        count: cCnt,
        date: todayNY,
        profit: tProf,
        balance: bBal,
        history: allTradesArray
      });
    },10000);
  };
}

async function initPage() {
  try {
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error || !session || !session.user) {
      window.location.href = 'index.html';
      return;
    }

    const u = session.user;
    uUid = u.id;

    initQuantButton();

    try {
      const { data, error: notifError } = await supabase.from('notifications').select('*').eq('user_id', u.id);
      if (!notifError && data) {
        window.cachedNotifications = data;
        window.renderNotifications();
        const unreadCount = data.filter(n => !n.read && !n.isRead).length;
        const badge = document.getElementById('bell-badge');
        if (badge) {
          badge.innerText = unreadCount;
          if (unreadCount > 0) badge.classList.add('show');
          else badge.classList.remove('show');
        }
      }
    } catch (err) {
      console.warn('جدول اعلانات یا خطا در دریافت آن:', err);
    }

    const { data: userData } = await supabase.from("users").select("*").eq("id", u.id).single();

    let localCache = null;
    try {
      const rawCache = localStorage.getItem(`zenix_quant_state_${uUid}`);
      if (rawCache) localCache = JSON.parse(rawCache);
    } catch(e) {}

    if (userData) {
      window.actualUserKeys = Object.keys(userData);

      bBal = Number(userData.balance || userData.depositAmount || 0);
      const qDate = cleanDateStr(userData.quantDate || userData.quant_date);
      const qCount = userData.quantCount ?? userData.quant_count ?? 0;
      const tProfit = userData.todayProfit ?? userData.today_profit ?? 0;
      const currentNY = cleanDateStr(todayNY);

      if (qDate && qDate === currentNY) {
        cCnt = Number(qCount);
        tProf = Number(tProfit);
      } else if (localCache && cleanDateStr(localCache.date) === currentNY) {
        cCnt = Number(localCache.count || 0);
        tProf = Number(localCache.profit || 0);
      } else {
        cCnt = 0;
        tProf = 0;
      }

      if (tpEl) tpEl.innerText = '$' + tProf.toFixed(2);
      if (tbEl) tbEl.innerText = '$' + bBal.toFixed(2);
      
      const rawHistory = userData.tradeHistoryArray || userData.quantHistory || userData.trades || userData.history || (localCache ? localCache.history : []);
      if (Array.isArray(rawHistory) && rawHistory.length > 0) {
        allTradesArray = rawHistory;
        window.renderHistory();
      }

      const b = document.getElementById('status-badge'), v = document.getElementById('vip1-badge'), l = window.currentActiveLang || localStorage.getItem('zenix_lang') || 'fa', t = (window.LD&&window.LD[l])||(window.LD&&window.LD.fa)||{};
      const qBtn = document.getElementById('quant-btn');

      if (bBal >= 20) {
        window.isBotActive = true;
        window.checkClickState();
        if(b){
          b.style.background = "rgba(34,197,94,.18)";
          b.style.borderColor = "#22c55e";
          b.style.color = "#22c55e";
          b.style.boxShadow = "0 0 12px rgba(34,197,94,.4)";
          b.innerHTML = `<i class="fas fa-robot"></i> <span>${t.active || 'فعال'}</span>`;
        }
        if(v){
          v.className = "badge-active";
          v.innerText = t.active || 'فعال';
        }
      } else {
        window.isBotActive = false;
        if(qBtn){
          qBtn.disabled = true;
          qBtn.style.opacity = "0.5";
          qBtn.style.cursor = "not-allowed";
        }
        if(b){
          b.style.background = "rgba(239,68,68,.18)";
          b.style.borderColor = "#ef4444";
          b.style.color = "#ef4444";
          b.style.boxShadow = "0 0 12px rgba(239,68,68,.4)";
          b.innerHTML = `<i class="fas fa-lock"></i> <span>${t.inactive || 'غیرفعال'}</span>`;
        }
        if(v){
          v.className = "badge-lock";
          v.innerHTML = '<i class="fas fa-lock"></i>';
        }
      }
    }
  } catch (err) {
    console.error('خطا در بارگذاری اولیه صفحه:', err);
  }
}

initPage();

const lBtn = document.getElementById('logout-btn');
if (lBtn) {
  lBtn.onclick = async e => {
    e.preventDefault();
    await supabase.auth.signOut();
    localStorage.clear();
    window.location.href = 'index.html';
  };
}
</script>
